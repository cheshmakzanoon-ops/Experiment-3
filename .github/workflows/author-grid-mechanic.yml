name: Author original grid mechanic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/author-grid-mechanic.py, .github/workflows/author-grid-mechanic.yml]
permissions:
  contents: write
concurrency:
  group: author-grid-mechanic
  cancel-in-progress: false
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore pinned official Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Author the dedicated mechanic without modifying retained people or player assets
        run: ${{ runner.temp }}/blender-5.2.2-linux-x64/blender -b --python-exit-code 1 --python scripts/author-grid-mechanic.py
      - name: Preserve original assets and append only the four authored outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src/rendering/aurel-people.geometry.json src/rendering/aurel-people.glb.gz src/rendering/aurel-people.manifest.json scripts/aurel-people.blend src/rendering/supplied-player.manifest.json
          git add scripts/grid-mechanic.blend src/rendering/grid-mechanic.geometry.json src/rendering/grid-mechanic.glb.gz src/rendering/grid-mechanic.manifest.json
          if git diff --cached --quiet; then exit 0; fi
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'art(grid): retain authored mechanic scene, exchange model and verified runtime geometry'
          git push origin HEAD:refs/heads/main
      - uses: actions/upload-artifact@v4
        with:
          name: original-grid-mechanic
          path: |
            scripts/grid-mechanic.blend
            src/rendering/grid-mechanic.geometry.json
            src/rendering/grid-mechanic.glb.gz
            src/rendering/grid-mechanic.manifest.json
          retention-days: 7
