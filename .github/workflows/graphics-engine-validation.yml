name: Graphics advancement GPU evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/rendering/**'
      - 'src/simulation/open-world/ambient-traffic.ts'
      - 'e2e/graphics-engine-advancement.spec.ts'
      - 'e2e/fixtures/graphics-engine-advancement.ts'
      - 'e2e/temporal-depth-rejection.spec.ts'
      - 'e2e/fixtures/temporal-depth-rejection.ts'
      - 'e2e/terrain-morph-contract.spec.ts'
      - 'e2e/fixtures/terrain-morph-contract.ts'
      - 'e2e/texture-source-ownership.spec.ts'
      - 'e2e/fixtures/texture-source-ownership.ts'
      - '.github/workflows/graphics-engine-validation.yml'
permissions:
  contents: read
concurrency:
  group: graphics-advancement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Production morphs, terrain, occlusion, temporal depth, texture lifetime and Festival pipeline
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/graphics-engine-advancement.spec.ts e2e/terrain-morph-contract.spec.ts e2e/temporal-depth-rejection.spec.ts e2e/texture-source-ownership.spec.ts e2e/festival-rendering.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-advancement-gpu
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 14
# Diagnostic evidence only. All existing full CI and publication gates remain
# required; this workflow cannot publish or substitute for those gates.
