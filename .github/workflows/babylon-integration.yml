name: Babylon engine integration
on:
  workflow_dispatch:
  push:
    branches: [babylon-js]
    paths:
      - 'src/engine/**'
      - 'babylon.html'
      - 'vite.config.ts'
      - 'package*.json'
      - 'tests/babylon-*.test.ts'
      - 'tests/migration-gpu-scheduling.test.ts'
      - 'tests/formula-surfaces.test.ts'
      - 'tests/circuit-line-profile.test.ts'
      - 'tests/indexed-ribbon-normals.test.ts'
      - 'tests/circuit-ribbon-data.test.ts'
      - 'tests/road-detail.test.ts'
      - 'tests/tyre-marks.test.ts'
      - 'tests/fixtures/circuit-ribbon-*'
      - 'src/rendering/circuit.ts'
      - 'src/rendering/circuit-finish.ts'
      - 'src/rendering/grid-paint.ts'
      - 'src/rendering/geometry.ts'
      - 'tests/gp-grid-paint.test.ts'
      - 'public/models/aurel-track-boards.glb'
      - 'src/rendering/track-boards.ts'
      - 'src/rendering/track-boards.manifest.json'
      - 'src/rendering/track-board-plan.ts'
      - 'src/rendering/studio/branding-plan.ts'
      - 'src/rendering/studio/brand-atlas.ts'
      - 'src/rendering/ground-profile.ts'
      - 'src/rendering/grandstand.ts'
      - 'src/rendering/venue-plan.ts'
      - 'src/rendering/track-signal-plan.ts'
      - 'src/simulation/track.ts'
      - 'src/simulation/circuits.ts'
      - 'tests/track-boards.test.ts'
      - 'tests/fixtures/a09-triplet-original.ts'
      - 'e2e/babylon-braking-triplet.spec.ts'
      - 'e2e/fixtures/babylon-braking-triplet.ts'
      - 'e2e/fixtures/babylon-braking-triplet-shader.ts'
      - 'tests/a09-submitted-shader-contract.test.ts'
      - 'src/rendering/studio/road-detail.ts'
      - 'src/rendering/tyre-marks.ts'
      - 'e2e/babylon-start-gantry.spec.ts'
      - 'e2e/babylon-start-lamps.spec.ts'
      - 'e2e/babylon-start-banner.spec.ts'
      - 'e2e/babylon-start-finish-stripe.spec.ts'
      - 'e2e/babylon-grid-paint.spec.ts'
      - 'e2e/fixtures/babylon-grid-paint.ts'
      - 'e2e/fixtures/babylon-grid-paint-reference.ts'
      - 'e2e/fixtures/babylon-start-finish-stripe.ts'
      - 'e2e/fixtures/babylon-start-banner.ts'
      - 'e2e/fixtures/babylon-start-lamps.ts'
      - 'e2e/fixtures/babylon-start-gantry.ts'
      - 'e2e/fixtures/babylon-start-gantry-gamma.ts'
      - 'tests/fixtures/a07-atlas-pixels.json'
      - 'tests/start-gantry.test.ts'
      - 'e2e/babylon-engine.spec.ts'
      - 'e2e/babylon-player-lods.spec.ts'
      - 'e2e/babylon-height-parity.spec.ts'
      - 'e2e/babylon-surface-parity.spec.ts'
      - 'e2e/fixtures/babylon-surface-parity.ts'
      - 'e2e/fixtures/babylon-context-recovery.ts'
      - 'e2e/fixtures/asphalt-reference.ts'
      - 'e2e/fixtures/asphalt-parity-metrics.ts'
      - 'e2e/fixtures/babylon-asphalt-parity.ts'
      - 'e2e/fixtures/grounding-reference.ts'
      - 'e2e/fixtures/grounding-parity-metrics.ts'
      - 'e2e/fixtures/babylon-grounding-parity.ts'
      - 'e2e/fixtures/babylon-height-parity.ts'
      - 'e2e/fixtures/babylon-player-lods.ts'
      - 'e2e/discipline-entry.spec.ts'
      - '.github/workflows/babylon-integration.yml'
permissions:
  contents: read
jobs:
  gpu:
    name: GPU ${{ matrix.suite }}
    # Cancel obsolete heavy jobs per suite, without locking behind a queued verifier.
    concurrency:
      group: babylon-integration-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: retained
          - suite: start-lamps
          - suite: start-banner
          - suite: start-finish-stripe
          - suite: grid-paint
          - suite: braking-triplet
    if: github.ref == 'refs/heads/babylon-js'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate source and both entry points
        run: npm run lint && npm run build
      - name: Engine component and existing asset geometry contracts
        run: npx vitest run tests/babylon-*.test.ts tests/discipline-presets.test.ts tests/input.test.ts tests/formula-surfaces.test.ts tests/circuit-line-profile.test.ts tests/indexed-ribbon-normals.test.ts tests/circuit-ribbon-data.test.ts tests/road-detail.test.ts tests/tyre-marks.test.ts tests/start-gantry.test.ts tests/gp-grid-paint.test.ts tests/track-boards.test.ts tests/a09-submitted-shader-contract.test.ts
      - name: GPU scheduling contracts
        run: npx vitest run tests/migration-gpu-scheduling.test.ts
      - run: npx playwright install --with-deps chromium
      # Keep literal selectors: existing asphalt/grounding contracts inspect this step.
      - name: Real WebGL engine, model import and mode-switching journeys
        if: matrix.suite == 'retained'
        run: npx playwright test e2e/babylon-engine.spec.ts e2e/discipline-entry.spec.ts e2e/babylon-player-lods.spec.ts e2e/babylon-height-parity.spec.ts e2e/babylon-surface-parity.spec.ts e2e/babylon-start-gantry.spec.ts
      - name: Original start lamps GPU qualification
        if: matrix.suite == 'start-lamps'
        run: npx playwright test e2e/babylon-start-lamps.spec.ts
      - name: Original start banner GPU qualification
        if: matrix.suite == 'start-banner'
        run: npx playwright test e2e/babylon-start-banner.spec.ts
      - name: Original start finish stripe GPU qualification
        if: matrix.suite == 'start-finish-stripe'
        run: npx playwright test e2e/babylon-start-finish-stripe.spec.ts
      - name: Original Formula grid paint GPU qualification
        if: matrix.suite == 'grid-paint'
        run: npx playwright test e2e/babylon-grid-paint.spec.ts
      - name: Original A09 first braking triplet GPU qualification
        if: matrix.suite == 'braking-triplet'
        run: npx playwright test e2e/babylon-braking-triplet.spec.ts
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-integration-${{ matrix.suite }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
            dist/BUILD_IDENTITY.json
          retention-days: 14

  verify:
    # Keep the original aggregate check name; every matrix shard is required.
    if: always() && github.ref == 'refs/heads/babylon-js'
    needs: gpu
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every GPU shard to pass
        run: test '${{ needs.gpu.result }}' = success
