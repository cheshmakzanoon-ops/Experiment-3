name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and deployment branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branches = ["claude/happy-heisenberg-8lveo4", "playable-cdn"]

          for branch in branches:
              ref = quote("heads/" + branch, safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/{ref}"
              request = urllib.request.Request(
                  url,
                  method="DELETE",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(f"Unexpected status {response.status} deleting {branch}")
                  print(f"deleted {branch}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"{branch} already absent")
                  else:
                      raise
          PY
