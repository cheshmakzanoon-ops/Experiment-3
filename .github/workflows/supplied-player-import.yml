name: Validate and publish supplied player
on:
  push:
    branches: [main]
    paths: [.github/workflows/supplied-player-import.yml]
permissions:
  contents: write
concurrency:
  group: supplied-player-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Receive hash-pinned rendering corrections without overwriting concurrent edits
        env:
          TRANSFER_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-1178-822f-8b5b-81bfb75314fa/raw?se=2026-09-27T20%3A17%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=6f8b79df-3add-53cc-b7db-32fdd6864040&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T12%3A13%3A31Z&ske=2026-09-28T12%3A13%3A31Z&sks=b&skv=2026-02-06&sig=oqR6J8wvU9yscJ/onCA68ejoXpmVDYai3gzhtgnesq4%3D'
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, zipfile, shutil
          url = os.environ['TRANSFER_URL']
          print('::add-mask::' + url, flush=True)
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'supplied-player-transfer.zip'
          request = urllib.request.Request(url, headers={'User-Agent': 'Experiment3-Authorized-Asset-Import/1.0', 'Accept': 'application/zip, application/octet-stream'})
          with urllib.request.urlopen(request, timeout=120) as response, archive.open('wb') as out:
              shutil.copyfileobj(response, out)
          assert archive.stat().st_size == 18304
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'ecad1ddf844b167b0c016c4883f05a368114e9d590c23fd7f8711f6a8227e4b5'
          allowed = {'src/rendering/supplied-player.ts', 'tests/supplied-player.test.ts', 'e2e/fixtures/supplied-player.ts', 'e2e/39-supplied-player.spec.ts', 'docs/SUPPLIED_PLAYER.md'}
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist()) == allowed | {'TRANSFER_MANIFEST.json'}
              assert len(z.namelist()) == len(allowed) + 1
              manifest = json.loads(z.read('TRANSFER_MANIFEST.json'))
              assert {f['path'] for f in manifest['files']} == allowed
              pending = []
              for f in manifest['files']:
                  p = pathlib.Path(f['path'])
                  assert not p.is_symlink()
                  current = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  assert current == f['originalSHA256'], 'Concurrent file change: ' + str(p)
                  data = z.read(f['path'])
                  assert len(data) == f['bytes'] and hashlib.sha256(data).hexdigest() == f['sha256']
                  pending.append((p, data))
              for p, data in pending:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(data)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'player-paths').write_bytes(b'\0'.join(p.encode() for p in sorted(allowed)) + b'\0')
          print('Verified and applied five rendering correction files; originals matched.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint, all unit tests and production build
        shell: bash
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/player-checks.log"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Actual model surface and fit captures
        run: npx playwright test e2e/39-supplied-player.spec.ts
      - name: Preserve model inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplied-player-corrected-studio
          path: playwright-report/
          retention-days: 7
      - name: Normal application input, POV, cameras, failure and replay checks
        run: npx playwright test e2e/24-coupled-driver.spec.ts
      - name: Commit and fast-forward main only after validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main moved during validation; refusing overwrite.'; exit 1; }
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git add --pathspec-from-file="$RUNNER_TEMP/player-paths" --pathspec-file-nul
          git diff --cached --check
          git commit -m 'fix: restore player height textures and align chassis suspension datum'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/published-player-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplied-player-corrected-validation
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/player-checks.log
            ${{ runner.temp }}/published-player-commit.txt
          retention-days: 7
          if-no-files-found: warn
