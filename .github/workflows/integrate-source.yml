name: Integrate validated source changes
on:
  push:
    branches: [main]
    paths: ['.github/pending-source.patch']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decode and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          data = pathlib.Path('.github/pending-source.patch').read_bytes()
          if data.startswith(b'APEX-PATCH-GZIP/1\n'):
              _, expected, encoded = data.split(b'\n', 2)
              if len(encoded) > 3000000:
                  raise SystemExit('Encoded patch is too large')
              compressed = base64.b64decode(encoded.strip(), validate=True)
              decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
              data = decoder.decompress(compressed, 8000001)
              if len(data) > 8000000 or not decoder.eof or decoder.unused_data:
                  raise SystemExit('Invalid or oversized compressed patch')
              if hashlib.sha256(data).hexdigest().encode() != expected:
                  raise SystemExit('Source patch integrity mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'apex-source.patch').write_bytes(data)
          PY
          git apply --check --recount "$RUNNER_TEMP/apex-source.patch"
          git apply --index --recount "$RUNNER_TEMP/apex-source.patch"
          python3 - <<'PY'
          import pathlib, subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          roots = {'src','tests','scripts','e2e','docs','public'}
          root_files = {'README.md','package.json','package-lock.json','index.html','tsconfig.json','vite.config.ts','vitest.config.ts','playwright.config.ts','eslint.config.js','.prettierrc.json','.gitignore'}
          for name in filter(None, paths):
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or (p.parts[0] not in roots and name not in root_files):
                  raise SystemExit('Disallowed source path: '+name)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:physics
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish tested source without overwriting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git rm -- .github/pending-source.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate tested APEX simulator source and regression coverage'
          git push origin HEAD:main
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-integration-evidence
          path: |
            docs/scenario-results.json
            test-results/
            playwright-report/
          retention-days: 7
