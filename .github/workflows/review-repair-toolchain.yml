name: Apply validated render budget
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-repair-toolchain.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the exact locally validated source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2b70603fa1c4a0a6b93968a3ee5af2a5f31bcef2
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, os
          patch = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest() == "89cf75f01ed510b51fc32192394fac4e544b6732a2cadd40b2562e1c94f2ed55"
          open(os.environ['RUNNER_TEMP'] + '/render-budget.patch', 'wb').write(patch)
          PYCODE
          git apply --check "$RUNNER_TEMP/render-budget.patch"
          git apply "$RUNNER_TEMP/render-budget.patch"
          git diff --check
          cat > "$RUNNER_TEMP/expected-sources.sha256" <<'HASHES'
          375b00534fe693fd8a3c3d22b4b9f2a1749aea4128e2dfda4b5b410cab7ef6a6  docs/RENDER_BUDGET_CONTINUATION.md
          7dd2cbbbc0f417553d5e669ccd4d705bc810f6680df5b53a902060a8e1f282ac  docs/SUPPLIED_PLAYER_RUNTIME.md
          1110fe038d305ddcf02b343aa4e9581e8375d67ab6c41b8eda3456b1fcee182f  e2e/29-populated-race-review.spec.ts
          216a42fb5e0b15382b435cb78d019fdc223410ecb62ad77d6cb6e30292c9b26d  e2e/39-supplied-player.spec.ts
          bd0cb4a33f06e982b08ad0427fe491200ff2fc03c4ac0a096f50041d72ed002e  e2e/41-player-render-budget.spec.ts
          4046cfa30357b098c423b17061a5fca95c3eeda6d2e973fd8c7caa539a6bfce3  e2e/fixtures/player-render-budget.ts
          5605316e6686b71d66984b387d5d60c379a1cb33523a3af04149ca546f77e34b  scripts/build-player-lods.mjs
          0fb386aab07c140fa1946ca95df6142703d50952c6a7166841c077877c7a0195  src/rendering/imported-texture-budget.ts
          137ec470c1654b1404747a686cf66686085d03bb7e5c1a4b9a33fe255c26bf19  src/rendering/opaque-order.ts
          c6f9cd11e3357ca9e1162de821e114d83841f1f43f00c86e0691a7ee76166366  src/rendering/renderer.ts
          b62a25a7d19d9a2b462a694a97571f1b579e092f4882efdf93fe78a1052caae0  src/rendering/supplied-player-lods.manifest.json
          719f636f7365d5b0e35efb5efab0649804da547ee0fdce02851a9e0fa56f1815  src/rendering/supplied-player-materials.ts
          12d0199fb9973f62b7355a18012f6336c987fa79d728c34a45596d5500110be3  src/rendering/supplied-player.ts
          40ae60f72c2bccd88a25d1b7c6fe165941e650f19aa2ef947aaa71251b3cc35e  src/rendering/texture-budget.ts
          ab05b0e7e1894599095eb552240a236619886459c29ef1d81ae26a3bbc9e30ee  tests/imported-render-budget.test.ts
          HASHES
          sha256sum --check "$RUNNER_TEMP/expected-sources.sha256"
          git diff --stat
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Commit and fast-forward the validated source on main
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/expected-sources.sha256"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git add -- docs/RENDER_BUDGET_CONTINUATION.md docs/SUPPLIED_PLAYER_RUNTIME.md e2e/29-populated-race-review.spec.ts e2e/39-supplied-player.spec.ts e2e/41-player-render-budget.spec.ts e2e/fixtures/player-render-budget.ts scripts/build-player-lods.mjs src/rendering/imported-texture-budget.ts src/rendering/opaque-order.ts src/rendering/renderer.ts src/rendering/supplied-player-lods.manifest.json src/rendering/supplied-player-materials.ts src/rendering/supplied-player.ts src/rendering/texture-budget.ts tests/imported-render-budget.test.ts
          git commit -m 'perf: bound supplied-player rendering cost and preserve race-review evidence'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/committed-source.txt"
      - name: Retain the readable patch and exact source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-budget-source-receipt
          path: |
            ${{ runner.temp }}/render-budget.patch
            ${{ runner.temp }}/expected-sources.sha256
            ${{ runner.temp }}/committed-source.txt
          retention-days: 7
