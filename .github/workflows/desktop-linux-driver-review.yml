name: Compare Linux software graphics driver
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-linux-driver-review.yml'
      - '.github/workflows/desktop-platform.yml'
      - 'src/engine/babylon/**'
      - 'src/rendering/**'
      - 'desktop/target.ts'
      - 'scripts/desktop-smoke.mjs'
      - 'scripts/desktop-compatibility.mjs'
      - 'scripts/native-smoke-control.*'
      - 'scripts/native-preparation-evidence.*'
      - 'scripts/native-gpu-trace.*'
      - 'tests/native-gpu-trace*.test.ts'
      - 'public/assets/basis/**'
permissions:
  contents: read
concurrency:
  group: linux-driver-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    # Diagnostic only. Required release validation still uses Mesa unchanged.
    # This workflow cannot publish a release or turn a failed Mesa lane green.
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ubuntu-22.04
      target: linux
      arch: x64
      linux_graphics: swiftshader
  compatibility-mesa:
    # A separate diagnostic scope reaches the real Game-menu compatibility
    # journeys without the heavy Babylon model workload, explicitly omitted
    # in its receipt. It cannot
    # replace the required full Mesa lane and uploads no release installers.
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ubuntu-22.04
      target: linux
      arch: x64
      linux_graphics: mesa
      smoke_journey: compatibility-diagnostic
  gpu-trace-mesa:
    name: Mesa full journey GPU trace (nonpublishing diagnostic)
    # Same real model/import and compatibility checks, with bounded built-in
    # tracing only. Required Mesa and the existing comparisons stay untraced.
    # Trace timing is diagnostic, never a replacement for native acceptance.
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ubuntu-22.04
      target: linux
      arch: x64
      linux_graphics: mesa
      smoke_journey: full
      gpu_trace: true
