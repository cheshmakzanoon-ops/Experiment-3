name: A35 validated publication candidate v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/a35-candidate.yml]
permissions:
  contents: read
concurrency:
  group: a35-validated-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PLAYWRIGHT_JSON_OUTPUT_FILE: a35-browser-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Apply only the isolated A35 source and six lifecycle hooks
        env:
          A35_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          fragments=['c5c40ecac13b70cb6edba32a0bad8fbfb3f68297','a973172a246fd7f91da4336703d1a78ab9e33f67','fba3ab3968d199a2e324c6273412093be77e2a33','0a6f587a00ee7d9b07ea02864596ae1a7d00046d','e5e39b782b77236e6c8e06db64aa6a6c1c07bfe1','a3d8745ccc97cd868c2b63b31353a3382cd058e3']
          encoded=''
          for sha in fragments:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['A35_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response: blob=json.load(response)
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              encoded+=raw.decode()
          raw=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='a4a8dfaaad077ec72b47b3bbb19bb1f1132a6dadd5945d0d470f3a1070477e8e'
          payload=json.loads(raw)
          allowed={
            'scripts/author-tyre-trolleys-racks.py',
            'src/rendering/tyre-trolleys-racks.ts',
            'tests/tyre-trolleys-racks.test.ts',
            'e2e/fixtures/tyre-trolleys-racks.ts',
            'e2e/a35-tyre-trolleys-racks.spec.ts',
            'docs/A35_TYRE_TROLLEYS_RACKS.md',
            '.github/workflows/a35-authoring.yml',
          }
          assert set(payload['files'])==allowed,'Unexpected source ownership'
          base=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          for name,text in payload['files'].items():
              p=Path(name)
              assert not p.exists(),f'Concurrent A35 owner at {name}'
              assert hashlib.sha256(text.encode()).hexdigest()==payload['hashes'][name],name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          renderer=Path('src/rendering/renderer.ts')
          text=renderer.read_text()
          renderer_before=hashlib.sha256(text.encode()).hexdigest()
          for old,new in payload['rendererEdits']:
              assert old and text.count(old)==1,f'Concurrent renderer hook changed: {old[:80]}'
              text=text.replace(old,new,1)
          renderer.write_text(text)
          Path('/tmp/a35-local-contract.json').write_text(json.dumps(payload['localContract']))
          paths=sorted(allowed|{'src/rendering/renderer.ts','scripts/aurel-tyre-trolleys-racks.blend','public/models/aurel-tyre-trolleys-racks.glb','src/rendering/tyre-trolleys-racks.manifest.json'})
          receipt={'base':base,'baseTree':base_tree,'rendererBeforeSHA256':renderer_before,'paths':paths,'branchUpdatePerformed':False}
          Path('/tmp/a35-candidate-base.json').write_text(json.dumps(receipt))
          print(json.dumps(receipt))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install exact Blender authoring tool
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir /tmp/a35-blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/a35-blender --strip-components=1
      - name: Generate editable source and self-contained game export
        run: |
          /tmp/a35-blender/blender -b -t 2 --factory-startup --python-exit-code 1 --python scripts/author-tyre-trolleys-racks.py
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/a35-local-contract.json').read_text())
          new=json.loads(Path('src/rendering/tyre-trolleys-racks.manifest.json').read_text())
          keys=['sourceSHA256','materials','images','meshes','nodes','templates','sockets','tyreRadius','halfWidths','maxBounds','capacity']
          assert all(old[k]==new[k] for k in keys),'Hosted geometry contract differs'
          Path('a35-export-comparison.json').write_text(json.dumps({'localGLB':old['sha256'],'hostGLB':new['sha256'],'exactGLBReproduced':old['sha256']==new['sha256'],'hostBlend':new['blendSHA256']},indent=2)+'\n')
          PY
      - name: Full lint, unit and production-build gate
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: A35 startup and actual-circuit views plus A22, A24 and A33 regressions
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a35-tyre-trolleys-racks.spec.ts e2e/43-hero-garage.spec.ts e2e/44-pit-wall-station.spec.ts e2e/a33-spare-wheel-set.spec.ts --reporter=line,html,json
      - name: Retain exact validated files and upload blobs; no tree or branch writes
        env:
          A35_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, time, urllib.request, urllib.error
          from pathlib import Path
          receipt=json.loads(Path('/tmp/a35-candidate-base.json').read_text())
          report=json.loads(Path('a35-browser-results.json').read_text())
          stats=report['stats']
          assert stats['unexpected']==0 and stats['flaky']==0 and stats['skipped']==0,stats
          entries=[]; files={}
          for name in receipt['paths']:
              raw=Path(name).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              files[name]={'gitBlob':sha,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          entries.append({'path':'.github/workflows/a35-candidate.yml','mode':'100644','type':'blob','sha':None})
          receipt.update({'entries':entries,'files':files,'runId':os.environ['GITHUB_RUN_ID'],'validation':{'npmRunCheck':'passed','browserStats':stats,'browserBackend':'mesa','finalArtApproved':False},'blobsUploaded':False})
          Path('a35-candidate-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          subprocess.run(['tar','-czf',os.environ['RUNNER_TEMP']+'/a35-validated-files.tar.gz',*receipt['paths']],check=True)
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          for name,info in files.items():
              raw=Path(name).read_bytes()
              body={'encoding':'base64','content':base64.b64encode(raw).decode()}
              req=urllib.request.Request(api+'/git/blobs',data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['A35_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: remote=json.load(r)
              except urllib.error.HTTPError as e:
                  print('BLOB_UPLOAD_ERROR',name,e.code,e.read().decode());raise
              assert remote['sha']==info['gitBlob'],name
              print('A35_BLOB',name,remote['sha'])
              time.sleep(.3)
          receipt['blobsUploaded']=True
          Path('a35-candidate-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a35-candidate-evidence
          path: |
            a35-candidate-receipt.json
            a35-export-comparison.json
            a35-browser-results.json
            browser-backend.json
            playwright-report/
            test-results/
            ${{ runner.temp }}/a35-validated-files.tar.gz
          retention-days: 7
          if-no-files-found: error
