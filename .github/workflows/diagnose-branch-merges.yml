name: Diagnose branch merge conflicts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-branch-merges.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git fetch --no-tags origin \
            automation/fh6-reference-pack-20261016 \
            automation/motocross-reference-pack-build \
            claude/nifty-johnson-cylfks \
            claude/serene-tesla-u8thlo
          base_sha="$(git rev-parse HEAD)"
          for branch in \
            automation/fh6-reference-pack-20261016 \
            automation/motocross-reference-pack-build \
            claude/nifty-johnson-cylfks \
            claude/serene-tesla-u8thlo
          do
            git reset --hard "$base_sha"
            git clean -fdx
            echo "===== BEGIN $branch ====="
            set +e
            git merge --no-commit --no-ff "origin/$branch"
            status=$?
            set -e
            echo "MERGE_STATUS=$status"
            if [ "$status" -ne 0 ]; then
              echo "CONFLICT_FILES_BEGIN"
              git diff --name-only --diff-filter=U
              echo "CONFLICT_FILES_END"
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                echo "----- CONFLICT $file -----"
                git diff --cc -- "$file" | sed -n '1,320p'
                echo "----- END CONFLICT $file -----"
              done < <(git diff --name-only --diff-filter=U)
              git merge --abort
            else
              echo "CLEAN_MERGE"
              git merge --abort
            fi
            echo "===== END $branch ====="
          done
