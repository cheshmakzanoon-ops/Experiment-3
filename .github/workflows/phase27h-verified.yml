# Repair bytes are retained in an ancestor checkpoint, not the active game tree.
name: Phase 27H exact candidate validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/phase27h-verified.yml]
permissions:
  contents: read
concurrency:
  group: phase27h-exact-candidate
  cancel-in-progress: true
env:
  TARGET_TREE: d2562149bc047f59aab168dcdae554b0bc314313
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover pinned candidate and apply verified import-lifecycle repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib, subprocess, textwrap, os
          prior = 'e31a271c83d5184fc84cec9402b2b8d8ff052372'
          subprocess.run(['git','merge-base','--is-ancestor',prior,'HEAD'],check=True)
          workflow = subprocess.check_output(['git','show',prior+':.github/workflows/phase27h-verified.yml'],text=True)
          # Execute only the already inspected, immutable prepare block. It checks
          # every retained blob, original lock/directive and both previous trees.
          body = workflow.split("        python - <<'PY'\n",1)[1].split('\n        PY',1)[0]
          exec(compile(textwrap.dedent(body),'pinned-27h-recovery','exec'))
          assert actual == 'f9ccf5b8799ea5aede45ed1fc2d357c74880553b'
          repair = pathlib.Path(os.environ['RUNNER_TEMP'])/'import-lifecycle.patch'
          repair.write_bytes(blob('dfa91b862d3ce51f3544fe4fa23f70449a5feeae'))
          subprocess.run(['git','apply','--check',str(repair)],check=True)
          subprocess.run(['git','apply',str(repair)],check=True)
          subprocess.run(['node','--experimental-transform-types','scripts/phase27h-matrix.ts','--write'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          actual = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual == os.environ['TARGET_TREE'], ('Repaired tree mismatch',actual)
          print('EXACT REPAIRED CANDIDATE',actual)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Verify and archive tested source
        run: |
          node --experimental-transform-types scripts/phase27h-matrix.ts --check
          node --experimental-transform-types scripts/phase27h-matrix.ts --json test-results/phase27h-matrix.json
          git add -A
          test "$(git write-tree)" = "$TARGET_TREE"
          git archive --format=tar.gz "$TARGET_TREE" > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h-web
          path: dist/
          retention-days: 7
          if-no-files-found: error
  scenarios:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-source
          path: ${{ runner.temp }}/source
      - name: Restore exact candidate
        run: |
          tar -xzf "$RUNNER_TEMP/source/source.tar.gz"
          rm .github/workflows/phase27h-verified.yml
          git add -A
          test "$(git write-tree)" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: node --experimental-transform-types scripts/race-classification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h-scenarios
          path: |
            docs/*-results.json
            docs/*-benchmark.json
            docs/*-integration.json
            docs/integrated-driving.json
            docs/race-classification.json
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-source
          path: ${{ runner.temp }}/source
      - name: Restore exact candidate
        run: |
          tar -xzf "$RUNNER_TEMP/source/source.tar.gz"
          rm .github/workflows/phase27h-verified.yml
          git add -A
          test "$(git write-tree)" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h-browser-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  wet-presentation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-source
          path: ${{ runner.temp }}/source
      - name: Restore exact candidate
        run: |
          tar -xzf "$RUNNER_TEMP/source/source.tar.gz"
          rm .github/workflows/phase27h-verified.yml
          git add -A
          test "$(git write-tree)" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/00-wet-presentation.spec.ts e2e/weather.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h-wet
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  seal:
    needs: [prepare, scenarios, browser, wet-presentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase27h-source
          path: ${{ runner.temp }}/source
      - name: Restore exact candidate
        run: |
          tar -xzf "$RUNNER_TEMP/source/source.tar.gz"
          rm .github/workflows/phase27h-verified.yml
          git add -A
          test "$(git write-tree)" = "$TARGET_TREE"
      - name: Retain verified commit without advancing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          base='edc2a8d644c67e313d9f599ba4ee738586431915'
          target=os.environ['TARGET_TREE']; staging=os.environ['GITHUB_SHA']
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path, body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(root+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          assert request('/git/ref/heads/main')['object']['sha']==staging, 'Concurrent main change: reconcile before publication'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==target
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          entries=[]
          for name in paths:
              p=pathlib.Path(name); assert p.is_file() and not p.is_symlink(), name
              data=p.read_bytes(); expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              remote=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert remote['sha']==expected, name
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          tree=request('/git/trees',{'base_tree':'09659d0870c53c7ea09d39605cbae2df13b04873','tree':entries})
          assert tree['sha']==target, 'Remote source differs from tested tree'
          message='feat: publish verified Phase 27H bodywork and acceptance increment\n\nIntegrate retained Blender body skins, deforming elbow cloth, corrected showroom wheel placement and all 148 directive/100 reference acceptance rows. Repair import-time URL evaluation without weakening existing GPU tests. Preserve original physics, lockfile and explicit open final-art, reference-parity, human and hardware gates.'
          commit=request('/git/commits',{'message':message,'tree':target,'parents':[staging]})
          report={'commit':commit['sha'],'tree':target,'base':base,'staging':staging,'workflowRun':os.environ['GITHUB_RUN_ID'],'files':paths,'sourceFingerprint':'5c5b1a1d7fabee66d5b56a75e72a744a4b3d92c35ce0ce947a459262dce5f2af','branchAdvanced':False,'humanApproved':False,'physicalHardwareApproved':False,'finalArtApproved':False,'allReferenceParity':False}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'phase27h-sealed.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h-sealed
          path: ${{ runner.temp }}/phase27h-sealed.json
          retention-days: 30
          if-no-files-found: error
