name: Cockpit framing evidence
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cockpit-framing.yml
      - src/rendering/camera-dynamics.ts
      - src/rendering/cockpit-framing.ts
      - src/rendering/renderer.ts
      - e2e/p0-cockpit-framing.spec.ts
      - e2e/fixtures/cockpit-framing.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    # Five independent groups under SwiftShader. Each frame costs 10-15 s at
    # 1280x720 Medium, so the drive is split across 'driving' (3.5 min) and
    # 'braking' (2.1 min); the specs total about 11.5 min on a slow runner,
    # inside the per-test 5 min deadline but too close to 15 min with setup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Release gate G15: this spec measures the owner-supplied cockpit, which a product build does
      # not contain. It runs on a QA build (never uploaded, never certified: `build:qa` does not call
      # the IP guard and the guard refuses its output).
      - run: npm run build:qa
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/p0-cockpit-framing.spec.ts
        env:
          MOTOBOUND_SUPPLIED_PLAYER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-cockpit-framing
          path: |
            test-results/
            playwright-report/
            browser-backend.json
          retention-days: 7
