name: Reference review workbench
on:
  push:
    branches: [main]
    paths: [.github/workflows/reference-review-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-review-workbench
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve reproducible offline review tools
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/apex-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          tar -czf "$RUNNER_TEMP/apex-dependencies.tar.gz" node_modules
          sha256sum package-lock.json > "$RUNNER_TEMP/dependency-lock.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-review-workbench
          path: |
            ${{ runner.temp }}/apex-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/apex-dependencies.tar.gz
            ${{ runner.temp }}/dependency-lock.sha256
          retention-days: 3
      - name: Lint, unit tests and production build
        run: npm run check
# Phase 27H: refresh the source-matched workbench without changing game behavior.
