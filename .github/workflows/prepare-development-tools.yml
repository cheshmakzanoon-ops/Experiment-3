name: Prepare development tools
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-development-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --save-dev --save-exact meshoptimizer@0.25.0 --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - name: Package dependency-only development runtime
        run: |
          tar -czf "$RUNNER_TEMP/apex-node-tools.tar.gz" node_modules package.json package-lock.json
          tar -czf "$RUNNER_TEMP/apex-browser-tools.tar.gz" -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: apex-development-tools
          path: |
            ${{ runner.temp }}/apex-node-tools.tar.gz
            ${{ runner.temp }}/apex-browser-tools.tar.gz
          retention-days: 1
