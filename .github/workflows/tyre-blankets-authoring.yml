name: A34 tyre-blanket reproducibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tyre-blankets-authoring.yml
      - scripts/author-tyre-blankets.py
      - src/rendering/tyre-blankets.manifest.json
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve reviewed receipt
        run: cp src/rendering/tyre-blankets.manifest.json "$RUNNER_TEMP/a34-expected.json"
      - name: Install pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Reproduce exact runtime export
        run: |
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python scripts/author-tyre-blankets.py
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'a34-expected.json').read_text())
          actual=json.loads(Path('src/rendering/tyre-blankets.manifest.json').read_text())
          assert actual==expected, 'A34 reproduction differs from the reviewed contract'
          assert hashlib.sha256(Path('public/models/aurel-tyre-blankets-and-controllers.glb').read_bytes()).hexdigest()==expected['sha256']
          print('A34 EXACT REPRODUCTION',expected['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a34-authoring-receipt
          path: |
            scripts/aurel-tyre-blankets-and-controllers.blend
            public/models/aurel-tyre-blankets-and-controllers.glb
            src/rendering/tyre-blankets.manifest.json
          retention-days: 7
