name: Validate and integrate pre-race presentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/grid-preparation/candidate.patch, docs/grid-preparation/candidate-fixes.patch, .github/workflows/grid-presentation-candidate.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: grid-presentation-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the explicit source patches without rewriting existing history
        run: |
          set -euo pipefail
          git apply --check --index docs/grid-preparation/candidate.patch
          git apply --index docs/grid-preparation/candidate.patch
          git apply --check --index docs/grid-preparation/candidate-fixes.patch
          git apply --index docs/grid-preparation/candidate-fixes.patch
          git diff --cached > "$RUNNER_TEMP/validated-grid.patch"
          git rm docs/grid-preparation/candidate.patch docs/grid-preparation/candidate-fixes.patch .github/workflows/grid-presentation-candidate.yml
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, full unit suite and production build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Install the established Mesa browser backend
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Real menu, preparation, pose seeking and race handover
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/50-grid-presentation.spec.ts
      - name: Commit only the tested index, then start the full validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'feat(pregame): authored grid mechanics, planted steps, blanket handling and safe race handover'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > "$RUNNER_TEMP/grid-source-commit.txt"
          gh workflow run ci.yml --ref main
      - name: Preserve browser captures and exact integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-presentation-integration
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            ${{ runner.temp }}/validated-grid.patch
            ${{ runner.temp }}/grid-source-commit.txt
          retention-days: 7
