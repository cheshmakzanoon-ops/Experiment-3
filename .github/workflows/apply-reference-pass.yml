name: Apply reference pass
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-reference-pass:
    if: github.event.head_commit.message == 'chore: stage exact reference pass for publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tested patch and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          test -f .patches/0efe470.patch
          git apply --check .patches/0efe470.patch
          git apply --index .patches/0efe470.patch
          git rm .patches/0efe470.patch .github/workflows/apply-reference-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement reference-driven academy, guidance, grid preparation and night showroom"
          test "$(git rev-parse HEAD^{tree})" = "5fa0c3ec2c4e24fc075c9109eaae7de41f4952ff"
          git push origin HEAD:main
