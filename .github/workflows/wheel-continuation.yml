name: Validate exact wheel continuation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wheel-continuation.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TREE: 11cbab3fa442138fd03cda09b7621a460ae38831
      PATCH_SHA256: d0dd82b3614f9de4a4fbba9fd4c4c4e45d8855522a1dabab158c6de46cffe198
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Retrieve preserved change set
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = await github.rest.git.getBlob({...context.repo, file_sha: '6b83fcd4c01903501e0871c2e58e990ab98da373'});
            fs.writeFileSync(process.env.RUNNER_TEMP + '/transfer.json', JSON.stringify(data.data));
      - name: Apply exact preserved change set
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/wheel-continuation.yml .github/workflows/continuation-environment.yml
          test "$(git write-tree)" = ba53fadd70a5ac9fabdd01b80d65aa321f70ef7a
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          encoded = ''.join(json.loads((temp / 'transfer.json').read_text())['content'].split())
          payload = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == os.environ['PATCH_SHA256'], 'Transfer checksum mismatch'
          (temp / 'wheel.patch').write_bytes(payload)
          PY
          git apply --index "$RUNNER_TEMP/wheel.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/02-wheel-fidelity.spec.ts e2e/instruments.spec.ts e2e/00-marbles.spec.ts
      - name: Preserve validated candidate without publishing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const git = (...args) => cp.execFileSync('git', args, {encoding: 'utf8'}).trim();
            const head = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (head.data.object.sha !== context.sha) throw new Error('Main advanced; refusing stale candidate');
            const base = await github.rest.git.getCommit({...context.repo, commit_sha: context.sha});
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
            const entries = [];
            for (const path of paths) {
              if (!fs.existsSync(path)) {
                entries.push({path, mode: '100644', type: 'blob', sha: null});
                continue;
              }
              const content = fs.readFileSync(path);
              const blob = await github.rest.git.createBlob({...context.repo, content: content.toString('base64'), encoding: 'base64'});
              if (blob.data.sha !== git('hash-object', path)) throw new Error('Blob mismatch: ' + path);
              entries.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const tree = await github.rest.git.createTree({...context.repo, base_tree: base.data.tree.sha, tree: entries});
            if (tree.data.sha !== process.env.EXPECTED_TREE) throw new Error('Candidate tree mismatch');
            const commit = await github.rest.git.createCommit({...context.repo, tree: tree.data.sha, parents: [context.sha], message: 'feat: couple wheel alignment and deformable tires to recorded physics'});
            const evidence = {sha: commit.data.sha, tree: tree.data.sha, parent: context.sha, source: 'exact checksum-verified preserved patch', validation: 'npm run check and targeted production WebGL browser tests passed', published: false};
            fs.writeFileSync(process.env.RUNNER_TEMP + '/validated-commit.json', JSON.stringify(evidence, null, 2));
            core.summary.addRaw(JSON.stringify(evidence, null, 2)).write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-publication-candidate
          path: |
            ${{ runner.temp }}/validated-commit.json
            ${{ runner.temp }}/transfer.json
            test-results/
            playwright-report/
          retention-days: 7
