name: Retain verified garage integration objects
on:
  push:
    branches: [main]
    paths: [.github/workflows/garage-wiring.yml]
permissions:
  contents: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the reviewed two-file patch without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def call(path,data=None):
              req=urllib.request.Request(base+path,headers=headers,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected={'src/rendering/circuit.ts':('4d9860539d6d03bc4c37435b7926a675a0c3d738','57e49b3a6870eef5acfe067c1bdfa863410a87af'),'src/rendering/renderer.ts':('889c6128d2337071be1c63a3fe42e17878d36c37','0884ffc385402970c6b9ff272e0e31a007150b4b')}
          for path,(before,after) in expected.items(): assert blob(Path(path).read_bytes())==before,path
          patch=base64.b64decode(call('/git/blobs/e7e6319084f7762c417dd8def03fd15de974b8d2')['content'])
          assert blob(patch)=='e7e6319084f7762c417dd8def03fd15de974b8d2'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          report={'source':os.environ['GITHUB_SHA'],'files':{},'branchUpdated':False}
          for path,(before,after) in expected.items():
              data=Path(path).read_bytes()
              assert blob(data)==after,path
              result=call('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert result['sha']==after
              report['files'][path]={'blob':after,'bytes':len(data)}
          Path('garage-wiring-blobs.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: garage-wiring-receipt
          path: garage-wiring-blobs.json
          if-no-files-found: error
          retention-days: 1
