name: Author original Aurel people assets
on:
  push:
    branches: [main]
    paths: [scripts/author-people.py, .github/workflows/people-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aurel-people-authoring
  cancel-in-progress: false
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install checksum-verified Blender 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.1-linux-x64.tar.xz
          curl --fail --location --retry 3 -o blender.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.1.sha256
          expected=$(grep 'blender-4.5.1-linux-x64.tar.xz$' blender.sha256 | awk '{print $1}')
          test "${#expected}" = 64
          printf '%s  blender.tar.xz\n' "$expected" | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender-4.5.1-linux-x64" >> "$GITHUB_PATH"
      - name: Correct the Blender vector-property spelling in the authored source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/author-people.py')
          source = p.read_text()
          source = source.replace('axis.length_squared()', 'axis.length_squared')
          p.write_text(source)
          PY
      - name: Author editable human meshes and matching runtime data
        run: blender --background --python-exit-code 1 --python scripts/author-people.py
      - name: Preserve authored outputs and locked local validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/aurel-people-assets.tar.gz" scripts/author-people.py scripts/aurel-people.blend src/rendering/aurel-people.glb.gz src/rendering/aurel-people.geometry.json src/rendering/aurel-people.manifest.json
          tar -czf "$RUNNER_TEMP/aurel-locked-node.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: aurel-people-authoring
          path: |
            ${{ runner.temp }}/aurel-people-assets.tar.gz
            ${{ runner.temp }}/aurel-locked-node.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Commit only generated people assets without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/author-people.py scripts/aurel-people.blend src/rendering/aurel-people.glb.gz src/rendering/aurel-people.geometry.json src/rendering/aurel-people.manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'art: retain Blender-authored Aurel crew and spectator meshes'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
