name: Verify original driver and Aurel people assets
on:
  push:
    branches: [main]
    paths:
      - scripts/author-driver.py
      - scripts/author-people.py
      - src/rendering/apx01-driver.*
      - src/rendering/aurel-people.*
      - .github/workflows/people-assets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurel-people-authoring
  cancel-in-progress: false
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the exact checksum-verified authoring toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 240 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  blender.tar.xz' | sha256sum --check
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Regenerate from the committed authors without rewriting their source
        run: |
          blender --background --python-exit-code 1 --python scripts/author-driver.py
          blender --background --python-exit-code 1 --python scripts/author-people.py
      - name: Require byte-identical game assets and source-bound manifests
        run: |
          git diff --exit-code -- scripts/author-driver.py scripts/author-people.py src/rendering/apx01-driver.glb.gz src/rendering/apx01-driver.manifest.json src/rendering/aurel-people.glb.gz src/rendering/aurel-people.geometry.json src/rendering/aurel-people.manifest.json
          npx vitest run tests/driver-asset.test.ts tests/people.test.ts tests/character-quality.test.ts
      - name: Preserve editable outputs for inspection, never auto-push replacements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurel-people-authoring
          path: |
            scripts/apx01-driver.blend
            scripts/aurel-people.blend
            src/rendering/apx01-driver.glb.gz
            src/rendering/apx01-driver.manifest.json
            src/rendering/aurel-people.glb.gz
            src/rendering/aurel-people.geometry.json
            src/rendering/aurel-people.manifest.json
          retention-days: 7
          if-no-files-found: error
# Editable .blend files include host/project metadata; runtime GLB, geometry and
# manifests must be byte-identical. This read-only job cannot race a main update
# or replace accepted 5.2.2 assets with the former 4.5.1 export on an author edit.
