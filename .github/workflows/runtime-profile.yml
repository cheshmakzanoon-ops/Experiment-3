name: Verify and publish static range correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-profile.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply independently hash-verified runtime files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for path, sha in {
              'src/rendering/supplied-draw-ranges.ts':'ace81e05999c8d0ddd4e44b9d2ee10cac951e2fc',
              'tests/supplied-draw-ranges.test.ts':'a11fdb32503e9efd273a7061888e2d5acda60475',
          }.items():
              assert not Path(path).exists(), path
              response=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              raw=base64.b64decode(response['content'])
              assert blob(raw)==sha, path
              Path(path).write_bytes(raw)
          edits={
              'src/rendering/supplied-player-lods.ts':('4108939e0ba07c3ca81ca572301cc406ccc82d2f','1365555b9b3927e0fb91e3b51662fc6bff7caf57',[
                  ("import * as T from 'three';", "import * as T from 'three';\nimport { SuppliedDrawRanges } from './supplied-draw-ranges.ts';"),
                  ('  private tier = 0;', '  readonly drawRanges?: SuppliedDrawRanges;\n  private tier = 0;'),
                  ('      if (used.size !== manifest.primitives) fail();', '      if (used.size !== manifest.primitives) fail();\n      this.drawRanges = new SuppliedDrawRanges(this.bindings);'),
                  ('      disposed: this.disposed,','      disposed: this.disposed,\n      drawRanges: this.drawRanges?.diagnostics() ?? null,'),
                  ('    // Restore original ownership','    this.drawRanges?.dispose();\n    // Restore original ownership'),
              ]),
              'e2e/fixtures/player-render-budget.ts':('40827fd256b08f9438a0f98124da1d27ca4576d9','2ff0540ce63d6e0f3042943d92b97781612b8a42',[
                  ("    for (const view of ['front', 'rear', 'cockpit'] as const) {", "    for (const view of ['front', 'rear', 'cockpit'] as const) {\n      player.lods!.drawRanges!.enabled = false;"),
                  ('      const culled = shot();','      const culled = shot();\n      player.lods!.drawRanges!.enabled = true;\n      shot();\n      const ranged = shot();'),
                  ('        cullingDelta: delta(shaderWork.pixels, culled.pixels),','        cullingDelta: delta(shaderWork.pixels, culled.pixels),\n        rangeDelta: delta(culled.pixels, ranged.pixels),\n        ranged: { ...ranged, pixels: undefined },'),
              ]),
              'e2e/41-player-render-budget.spec.ts':('ab60a32c6b8e99286d7f5038c768026f0d9416ff','8d37f046d070db19615b73800bc4923f4b0fe327',[
                  ("      'culled',", "      'culled',\n      'ranged',"),
                  ('    expect(row.cullingDelta.max, row.view).toBe(0);', "    expect(row.cullingDelta.max, row.view).toBe(0);\n    expect(row.rangeDelta.max, row.view).toBe(0);\n    expect(row.ranged.calls, row.view).toBeLessThanOrEqual(row.culled.calls);\n    expect(row.ranged.triangles, row.view).toBeLessThanOrEqual(row.culled.triangles);\n    if (row.view === 'cockpit')\n      expect(row.ranged.triangles).toBeLessThan(row.culled.triangles * 0.85);"),
              ]),
          }
          for path,(old_sha,new_sha,replacements) in edits.items():
              p=Path(path); raw=p.read_bytes()
              assert blob(raw)==old_sha, path
              text=raw.decode()
              for old,new in replacements:
                  assert text.count(old)==1,(path,old)
                  text=text.replace(old,new)
              raw=text.encode();assert blob(raw)==new_sha,path
              p.write_bytes(raw)
          report=Path('docs/RENDER_BUDGET_CONTINUATION.md')
          report.write_text(report.read_text()+'''
          ## Static draw-range continuation

          The remaining failures on `ad99b6c7` include sparse full-lap observations and
          unqualified close-racing/wet-following sequences. Read-only investigation run
          `36494318155` measured 2665.4 ms for the supplied Low cockpit at 640x400 versus
          1066.7 ms at 16x10 with the same 668110 submitted triangles. A diagnostic basic
          material measured 313.5 ms; that material substitution is NOT used in the game.
          These are synchronized isolated software-GPU samples, not target-hardware FPS.

          The continuation conservatively trims only wholly off-frustum prefixes and
          suffixes of static primitive index streams. All visible triangles and intervening
          indices keep their original order, attributes, maps and material shading. Bounds
          are prepared for the existing representations; no new GPU buffer or draw call is
          introduced. Each main, mirror and shadow camera computes its own range, restored
          immediately after submission. Skinning, morphs, instancing, displacement, custom
          shader materials, modified attributes and authored draw ranges retain their
          untrimmed path. Disposal restores callbacks without disposing source geometry.

          Eight focused unit cases cover these boundaries. The existing actual-binary
          player GPU fixture additionally requires exact unchanged front/rear/cockpit
          pixels, unchanged resource ownership and fewer submitted cockpit triangles.
          The five full-race failures, all eight browser shards, existing sample/event
          thresholds, zero retries, physics and successful-artifact publication remain
          independent mandatory gates. A source commit does not claim those gates passed.
          The temporary investigation workflow is removed with the runtime publication.
          ''')
          assert blob(report.read_bytes())=='d18dbca19fb9482b9c19d2ad5729532e42459afa'
          Path('.github/workflows/runtime-profile.yml').unlink()
          PY
          git diff --exit-code -- src/simulation .github/workflows/ci.yml .github/workflows/publish-playable-cdn.yml
          git diff --check
      - name: Validate the actual runtime correction before committing
        run: npm run check
      - name: Commit without overwriting concurrent work and dispatch complete release validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/supplied-draw-ranges.ts tests/supplied-draw-ranges.test.ts src/rendering/supplied-player-lods.ts e2e/fixtures/player-render-budget.ts e2e/41-player-render-budget.spec.ts docs/RENDER_BUDGET_CONTINUATION.md .github/workflows/runtime-profile.yml
          git commit -m 'perf: trim off-frustum supplied-player ranges without changing visible geometry'
          git push origin HEAD:main
          git rev-parse HEAD > published-source.txt
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-range-publication
          path: published-source.txt
          retention-days: 7
