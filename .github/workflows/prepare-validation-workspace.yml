name: Prepare validation workspace
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-validation-workspace.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package source and locked public development dependencies
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          tar -czf "$RUNNER_TEMP/dependencies.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/lock-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: directive-validation-workspace
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/dependencies.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/lock-sha256.txt
          retention-days: 1
