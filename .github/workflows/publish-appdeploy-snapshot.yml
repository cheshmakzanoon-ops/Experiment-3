name: Publish AppDeploy snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-appdeploy-snapshot.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish immutable static snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD^)"
          rm -rf "$RUNNER_TEMP/appdeploy"
          mkdir -p "$RUNNER_TEMP/appdeploy"
          cp -R dist/. "$RUNNER_TEMP/appdeploy/"
          find "$RUNNER_TEMP/appdeploy" -type f -name '*.map' -delete
          printf '%s\n' "$source_sha" > "$RUNNER_TEMP/appdeploy/SOURCE_COMMIT.txt"
          touch "$RUNNER_TEMP/appdeploy/.nojekyll"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan appdeploy-snapshot-build
          git rm -rf .
          git clean -fdx
          cp -R "$RUNNER_TEMP/appdeploy/." .
          git add -A
          git commit -m "deploy: AppDeploy snapshot $source_sha"
          git branch -M appdeploy-snapshot
          git push --force origin appdeploy-snapshot
