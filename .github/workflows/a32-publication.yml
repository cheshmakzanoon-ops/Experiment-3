name: A32 source and exact GLB publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/a32-publication.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: a32-exact-delivery-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the hash-verified original source delta
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/a32-validation-base.txt"
          git fetch --no-tags --depth=1 origin 7760d1c54ae45d5e8bdce86b6987cbeb64f09f75
          python3 - <<'PY'
          import os,json,base64,zlib,hashlib
          from pathlib import Path
          meta=json.loads(Path('.github/a32-original-delivery.json').read_text())
          chunks=[Path('.github/a32-source-%d.b64'%i).read_text() for i in range(3)]
          # Correct two known transport transcription errors before the exact hash gate.
          chunks[1]=chunks[1].replace('R0xcFtyeAa2eAa2u8','R0xcFtyeAa2eA2u8').replace('OrncOTvncOTvY','OrncOTvY')
          patch=zlib.decompress(base64.b64decode(''.join(chunks),validate=True))
          if len(patch)!=128929 or hashlib.sha256(patch).hexdigest()!=meta['sourcePatchSHA256']:
              raise RuntimeError('A32 source transfer identity mismatch')
          Path(os.environ['RUNNER_TEMP'],'a32-source.patch').write_bytes(patch)
          PY
          git apply --3way --index "$RUNNER_TEMP/a32-source.patch"
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          meta=json.loads(Path('.github/a32-original-delivery.json').read_text())
          binary={p for p in meta['sourceFiles'] if p.endswith(('.blend','.glb','.jpg'))}
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(paths)!=set(meta['sourceFiles'])-binary: raise RuntimeError('Unexpected staged A32 source scope')
          shared={'src/rendering/pit-crew.ts','src/rendering/renderer.ts','src/rendering/pit-presentation.ts'}
          for p in paths:
              if p not in shared and hashlib.sha256(Path(p).read_bytes()).hexdigest()!=meta['sourceFiles'][p]:
                  raise RuntimeError('Original A32 source changed: '+p)
          print('All original A32 text transferred; shared files reconciled by three-way patch.')
          PY
          git diff --cached --stat
      - name: Recover the pinned authoring toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Reproduce the original GLB without relaxing its identity
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --factory-startup --python scripts/author-a32-pit-jacks.py -- --output-root "$RUNNER_TEMP/a32-reproduction" 2>&1 | tee "$RUNNER_TEMP/a32-authoring.log"
          python3 - <<'PY'
          import os,json,hashlib,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'a32-reproduction'
          source=json.loads(Path('src/rendering/a32-pit-jacks.manifest.json').read_text())
          made=json.loads((root/'src/rendering/a32-pit-jacks.manifest.json').read_text())
          if source!=made: raise RuntimeError('Hosted GLB/manifest differs from original; retain evidence, do not replace the integrity contract')
          for p in ['public/models/aurel-a32-pit-jacks.glb','scripts/aurel-a32-pit-jacks.blend']:
              Path(p).parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(root/p,p)
          raw=Path('public/models/aurel-a32-pit-jacks.glb').read_bytes()
          if hashlib.sha256(raw).hexdigest()!='73eca21be2433d045dc4a8c54a24afa9dd82146041bfa5bef44305a2af52a8b0': raise RuntimeError('A32 GLB identity failure')
          print('Original GLB bytes reproduced exactly; editable source regenerated by the unchanged script.')
          PY
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --python scripts/author-a32-pit-jacks.py -- --check-source
          git add -- scripts/aurel-a32-pit-jacks.blend public/models/aurel-a32-pit-jacks.glb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full source validation on reconciled main
        shell: bash
        run: set -o pipefail; npm run check 2>&1 | tee "$RUNNER_TEMP/a32-source-check.log"
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Normal application and native-texture assembly browser validation
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a32-pit-jacks.spec.ts e2e/a32-pit-jacks-offline.spec.ts 2>&1 | tee "$RUNNER_TEMP/a32-browser-check.log"
      - name: Retain current visual review and publication context
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/a32-review-env"
          "$RUNNER_TEMP/a32-review-env/bin/pip" -q install Pillow
          "$RUNNER_TEMP/a32-review-env/bin/python" - <<'PY'
          import os,json,hashlib,datetime
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          files=sorted(Path('test-results').rglob('a32-offline-*-phase-4-8.png'))
          if len(files)!=9: raise RuntimeError('Expected nine held-service assembly views')
          sheet=Image.new('RGB',(1920,1160),(24,28,33)); draw=ImageDraw.Draw(sheet)
          draw.text((18,15),'A32 / HOSTED ASSEMBLY REVIEW / '+os.environ['GITHUB_RUN_ID'],fill='white')
          draw.text((18,36),'Actual supplied car and pit personnel. Assembly floor, not a driven circuit. Day / sunset / night.',fill='white')
          for row,light in enumerate(['day','sunset','night']):
              for col,view in enumerate(['front','rear','pair']):
                  matches=[p for p in files if p.name=='a32-offline-'+light+'-'+view+'-phase-4-8.png']
                  if len(matches)!=1: raise RuntimeError('Missing '+light+'/'+view+' review')
                  image=Image.open(matches[0]).convert('RGB')
                  thumb=ImageOps.contain(image,(630,330)); x=col*640+5; y=row*360+70
                  sheet.paste(thumb,(x,y)); draw.text((x,y+335),light.upper()+' / '+view.upper()+' / TYRE SERVICE',fill='white')
          sheet.save('docs/A32_OFFLINE_ASSEMBLY_REVIEW.jpg',quality=91)
          root=Path(os.environ['RUNNER_TEMP']); meta=json.loads(Path('.github/a32-original-delivery.json').read_text())
          note='> Publication update: this revision was reconciled onto newer main and validated on GitHub. See [A32_PUBLICATION.json](A32_PUBLICATION.json). A32_VALIDATION.json is the original offline checkpoint, not the current publication status. The contact sheet was regenerated from hosted browser captures.\n\n'
          p=Path('docs/A32_FRONT_REAR_JACKS.md'); original=p.read_text(); p.write_text(note+original)
          p=Path('docs/A32_VALIDATION.json'); old=json.loads(p.read_text()); old={'recordContext':'Historical offline checkpoint. Its githubPushed=false describes that earlier time. See A32_PUBLICATION.json for hosted validation and the enclosing Git commit for publication.',**old}; p.write_text(json.dumps(old,indent=2)+'\n')
          report={'assetId':'A32','originalLocalCommit':meta['localCommit'],'originalUpstreamBase':meta['upstreamBase'],'validatedBase':(root/'a32-validation-base.txt').read_text().strip(),'runId':int(os.environ['GITHUB_RUN_ID']),'runUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'originalSourcePatchSHA256':meta['sourcePatchSHA256'],'originalGLBReproducedExactly':True,'blenderSource':'Regenerated by the byte-identical retained authoring script with the pinned toolchain; packed-source check passed. File-save bytes are not claimed identical.','visualEvidence':'Nine held-service views in the updated contact sheet, from the hosted 27-image assembly suite. Normal-application tests are a separate suite.','sourceValidation':'npm run check passed','browserValidation':'Both normal-application and native-texture assembly suites passed','finalArtApproved':False,'externalDeployment':'not performed','phase6ReleaseChoreography':'still outstanding','publication':'Validated candidate; the Git commit enclosing this file records source publication.'}
          report['sourceFiles']={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in meta['sourceFiles']}
          Path('docs/A32_PUBLICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add -- docs/A32_FRONT_REAR_JACKS.md docs/A32_VALIDATION.json docs/A32_OFFLINE_ASSEMBLY_REVIEW.jpg docs/A32_PUBLICATION.json
      - name: Retain validated Git blobs without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,hashlib,subprocess,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); meta=json.loads(Path('.github/a32-original-delivery.json').read_text())
          paths=list(meta['sourceFiles'])+['docs/A32_PUBLICATION.json']
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(staged)!=set(paths): raise RuntimeError('Unexpected staged publication scope')
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          entries=[]
          for path in paths:
              data=Path(path).read_bytes()
              if data!=subprocess.check_output(['git','show',':'+path]): raise RuntimeError('Staged/worktree mismatch: '+path)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=90) as response: blob=json.load(response)
              if blob['sha']!=expected: raise RuntimeError('Retained Git blob identity mismatch: '+path)
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          receipt={'base':(root/'a32-validation-base.txt').read_text().strip(),'runId':os.environ['GITHUB_RUN_ID'],'files':entries,'unpublishedUntilExternalRefUpdate':True}
          (root/'a32-retained-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (root/'a32-ready.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Keep source, binaries and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a32-publication-evidence
          path: |
            ${{ runner.temp }}/a32-retained-blobs.json
            ${{ runner.temp }}/a32-ready.patch
            ${{ runner.temp }}/a32-validation-base.txt
            ${{ runner.temp }}/a32-source-check.log
            ${{ runner.temp }}/a32-browser-check.log
            ${{ runner.temp }}/a32-authoring.log
            ${{ runner.temp }}/a32-reproduction/
            docs/A32_PUBLICATION.json
            docs/A32_OFFLINE_ASSEMBLY_REVIEW.jpg
            test-results/
            playwright-report/
            browser-backend.json
          retention-days: 7
