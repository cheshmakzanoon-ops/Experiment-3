name: Publish validated playable release
on:
  workflow_run:
    workflows: [Build and validation]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
concurrency:
  group: validated-playable-release
  cancel-in-progress: false
jobs:
  publish:
    # Only the exact successful, first-party main artifact can become a release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Reject superseded source before downloading
        id: source
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if test "$current" = "$VALIDATED_SHA"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Source advanced; previous release retained.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the release that passed every validation job
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-release
          path: ${{ runner.temp }}/validated-playable
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify source and publish a branchless, source-addressed release
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: bash scripts/publish-validated-release.sh "$RUNNER_TEMP/validated-playable"
