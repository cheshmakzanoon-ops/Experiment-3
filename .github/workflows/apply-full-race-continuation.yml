name: Apply full-race stability patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-full-race-continuation.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-full-race-continuation
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'cheshmakzanoon-ops/Experiment-3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the fixed hash-verified source patch
        shell: bash
        env:
          EXPECTED_TREE: '383e11ec49e760e59de01954b2730989ba888c34'
          PATCH_SHA256: '958432fb3148b4ab4b7eb2c610363630568194c42a17ce072234d56ccacc8e3d'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 4ec7a86869c0e7516148abcb9fef38f71cd6704c
          python3 - <<'PYCODE'
          import os, re, subprocess, base64, gzip, hashlib
          from pathlib import Path
          fixed = subprocess.check_output(['git', 'show', '4ec7a86869c0e7516148abcb9fef38f71cd6704c:.github/workflows/apply-full-race-continuation.yml'], text=True)
          encoded = re.search(r"encoded = '([A-Za-z0-9+/=]+)'", fixed).group(1)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('Patch digest mismatch')
          Path(os.environ['RUNNER_TEMP'], 'full-race-stability.patch').write_bytes(patch)
          PYCODE
          git apply --check "$RUNNER_TEMP/full-race-stability.patch"
          git apply --index "$RUNNER_TEMP/full-race-stability.patch"
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('tests/supplied-shader-work.test.ts')
          source = path.read_text()
          old = 'material.onBeforeRender.apply(material, [] as unknown as Parameters<typeof material.onBeforeRender>);'
          new = 'material.onBeforeRender(...([] as unknown as Parameters<typeof material.onBeforeRender>));'
          if source.count(old) != 2 or source.count('material.roughnessMap.source') != 1:
              raise SystemExit('Unexpected regression test source')
          path.write_text(source.replace(old, new).replace('material.roughnessMap.source', 'material.roughnessMap!.source'))
          PYCODE
          git add tests/supplied-shader-work.test.ts
          git rm -- .github/workflows/apply-full-race-continuation.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          git diff --cached --stat
      - run: npm ci --no-audit --no-fund
      - name: Locked toolchain validation
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/full-race-preflight.log"
      - name: Commit and fast-forward the verified tree
        shell: bash
        env:
          EXPECTED_TREE: '383e11ec49e760e59de01954b2730989ba888c34'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'perf: reduce supplied-player shader work and warm real pit materials before grid release'
          git push origin HEAD:main
          published=$(git rev-parse HEAD)
          echo "PUBLISHED_COMMIT=$published"
          echo "Verified source pushed: $published" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref=main
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-race-preflight
          path: ${{ runner.temp }}/full-race-preflight.log
          retention-days: 7
          if-no-files-found: warn
