name: Verify live race board pixels and integrate correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/live-board-review.patch, .github/workflows/live-board-review.yml]
permissions:
  contents: read
concurrency:
  group: live-board-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lighting: [day, sunset, night]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the verified visual-review correction
        run: |
          set -euo pipefail
          echo '818b601fa5c111779cee94f7d32c21ce39435d10b5e041972dcdc253ffbb1876  docs/live-board-review.patch' | sha256sum --check
          git apply --check --index docs/live-board-review.patch
          git apply --index docs/live-board-review.patch
      - run: npm ci --no-audit --no-fund
      - name: Types, lint, targeted regression and production build
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint
          npx vitest run tests/start-finish.test.ts
          npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils
      - name: Inspect actual panel pixels in the unchanged production scene
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/55-start-finish.spec.ts --grep 'production ${{ matrix.lighting }} architecture' --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-board-${{ matrix.lighting }}-evidence
          path: |
            test-results/
            playwright-report/
            browser-progress.json
            browser-backend.json
          retention-days: 7
  integrate:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Append tested correction without replacing concurrent source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '818b601fa5c111779cee94f7d32c21ce39435d10b5e041972dcdc253ffbb1876  docs/live-board-review.patch' | sha256sum --check
          git apply --check --index docs/live-board-review.patch
          git apply --index docs/live-board-review.patch
          git rm docs/live-board-review.patch .github/workflows/live-board-review.yml
          git diff --cached --check
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'fix(venue): preserve live board canvas through texture budgeting; verify displayed pixels'
          git push origin HEAD:refs/heads/main
          gh workflow run ci.yml --ref main
