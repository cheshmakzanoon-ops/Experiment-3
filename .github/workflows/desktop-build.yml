name: Build MOTOBOUND desktop game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'build/**'
      - 'scripts/*desktop*'
      - 'package*.json'
      - '*.html'
      - 'vite.config.ts'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/desktop-platform.yml'
permissions:
  contents: read
concurrency:
  group: motobound-desktop-${{ github.ref }}
  # Only current-source packages can publish. Preserve completed job evidence,
  # but do not spend another full native matrix on a superseded payload.
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
  publish-development:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: motobound-package-*
          path: packages
          merge-multiple: true
      - name: Publish source-addressed desktop development packages
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if test "$current" != "$GITHUB_SHA"; then
            echo 'A newer source exists; leaving these packages as CI artifacts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="desktop-dev-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "MOTOBOUND desktop development · ${GITHUB_SHA:0:7}" \
              --notes "Unsigned development executables for Windows, macOS and Linux. Source: $GITHUB_SHA. Windows x64, Linux x64 and Apple Silicon macOS package build and launch jobs passed. Intel macOS remains experimental and is not included. Physical GPU performance and full-game qualification remain outstanding. This is NOT a completed game or Steam-ready certification; Babylon migration and gameplay regressions remain documented in docs/CURRENT_STATUS.md. Signing and macOS notarization are not configured. Validation: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          mkdir -p "$RUNNER_TEMP/desktop-existing"
          for file in packages/*; do
            name=$(basename "$file")
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/desktop-existing"
              cmp "$file" "$RUNNER_TEMP/desktop-existing/$name"
            else
              gh release upload "$tag" "$file"
            fi
          done
          gh release edit "$tag" --draft=false --prerelease --latest=false
