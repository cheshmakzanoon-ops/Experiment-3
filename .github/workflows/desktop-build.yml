name: Build MOTOBOUND desktop game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'build/**'
      - 'scripts/*desktop*'
      - 'package*.json'
      - '*.html'
      - 'vite.config.ts'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-build.yml'
permissions:
  contents: read
concurrency:
  group: motobound-desktop-${{ github.ref }}
  # Only current-source packages can publish. Preserve completed job evidence,
  # but do not spend another full native matrix on a superseded payload.
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MOTOBOUND_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Rosetta for the macOS x64 executable
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: /usr/bin/arch -x86_64 /usr/bin/uname -m
      - run: npm ci --no-audit --no-fund
      - name: Validate desktop isolation and engine contracts
        run: npx vitest run tests/desktop-policy.test.ts tests/desktop-target.test.ts tests/repository-portability.test.ts tests/motocross-ground-physics.test.ts tests/motocross-contact-impulse.test.ts tests/babylon-*.test.ts tests/input.test.ts
      - name: Build the bundled offline desktop game
        run: npm run desktop:package -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y libgl1-mesa-dri mesa-utils
      - name: Launch the packaged Linux executable
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOTOBOUND_CI_GL: mesa
        run: xvfb-run -a node scripts/desktop-smoke.mjs
      - name: Launch the packaged Windows or macOS application
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs
      - name: Record package checksums and exact source
        run: node scripts/desktop-checksums.mjs
      - name: Preserve native launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop-evidence/
          retention-days: 7
      - name: Upload development installers
        uses: actions/upload-artifact@v4
        with:
          name: motobound-package-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop-out/*.exe
            desktop-out/*.dmg
            desktop-out/*.AppImage
            desktop-out/*.tar.gz
            desktop-out/*.zip
            desktop-out/SHA256SUMS-*.txt
            desktop-out/source-*.json
          if-no-files-found: error
          retention-days: 7
  publish-development:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: motobound-package-*
          path: packages
          merge-multiple: true
      - name: Publish source-addressed desktop development packages
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if test "$current" != "$GITHUB_SHA"; then
            echo 'A newer source exists; leaving these packages as CI artifacts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="desktop-dev-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "MOTOBOUND desktop development · ${GITHUB_SHA:0:7}" \
              --notes "Unsigned development executables for Windows, macOS and Linux. Source: $GITHUB_SHA. All four package build and launch jobs passed; macOS x64 was exercised under Rosetta on Apple Silicon, not physical Intel hardware. This is NOT a completed game or Steam-ready certification; Babylon migration and gameplay regressions remain documented in docs/CURRENT_STATUS.md. Signing and macOS notarization are not configured. Validation: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          mkdir -p "$RUNNER_TEMP/desktop-existing"
          for file in packages/*; do
            name=$(basename "$file")
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/desktop-existing"
              cmp "$file" "$RUNNER_TEMP/desktop-existing/$name"
            else
              gh release upload "$tag" "$file"
            fi
          done
          gh release edit "$tag" --draft=false --prerelease --latest=false
