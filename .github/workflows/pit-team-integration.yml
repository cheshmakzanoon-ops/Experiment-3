name: Author and validate coordinated pit team
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/pit-team-transfer.*, scripts/apply-pit-team-candidate.mjs, .github/workflows/pit-team-integration.yml]
permissions:
  contents: read
concurrency:
  group: pit-team-integration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve the unchanged baseline and same CPU workload
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --experimental-transform-types scripts/pit-team-cost.ts > "$RUNNER_TEMP/pit-team-before-cpu.json"
          cp src/rendering/crew-performance.geometry.json "$RUNNER_TEMP/prior-crew.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pit-team-baseline-web
          path: dist/
          retention-days: 3
      - name: Apply the explicit hash-verified source patch
        run: node scripts/apply-pit-team-candidate.mjs
      - name: Restore the same pinned official Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Author all fourteen evaluated actions on unchanged shared meshes
        run: ${{ runner.temp }}/blender-5.2.2-linux-x64/blender -b --python-exit-code 1 --python scripts/author-crew-performance.py
      - name: Full lint, unit suite, types, production build and measured CPU poses
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/pit-team-check.log"
          node --experimental-transform-types scripts/pit-team-cost.ts > "$RUNNER_TEMP/pit-team-after-cpu.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          before=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior-crew.json').read_text())
          after=json.loads(Path('src/rendering/crew-performance.geometry.json').read_text())
          assert before['meshes']==after['meshes']
          errors={}
          for name,clip in before['clips'].items():
              current=after['clips'][name]
              assert (clip['duration'],clip['fps'],len(clip['frames']))==(current['duration'],current['fps'],len(current['frames']))
              errors[name]=max(abs(x-y) for a,b in zip(clip['frames'],current['frames']) for x,y in zip(a,b))
              assert errors[name]<0.000003, (name,errors[name])
          print('Unchanged meshes; prior-action rounding errors:',errors)
          PY
      - name: Guard protected assets and the one deliberate physics correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- 'src/rendering/supplied-*' 'src/rendering/apx01-*' 'src/rendering/a61-*' 'src/rendering/aurel-people.*' scripts/apx01-assembly.blend scripts/aurel-people.blend scripts/grid-mechanic.blend
          test "$(git diff --name-only HEAD -- src/simulation)" = src/simulation/vehicle.ts
          python3 - <<'PY'
          import pathlib, subprocess
          p='src/simulation/vehicle.ts'
          old=subprocess.check_output(['git','show','HEAD:'+p]).decode()
          new=pathlib.Path(p).read_text()
          actual=[s.strip() for s in new.splitlines() if not s.strip().startswith('//')]
          expected=[s.strip() for s in old.replace('this.pitPhase <= 5 ? 0.19 : 0','this.pitPhase <= 4 ? 0.19 : 0').splitlines() if not s.strip().startswith('//')]
          assert actual==expected, 'Unexpected physics change'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pit-team-candidate-web
          path: dist/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: pit-team-authored-assets
          path: |
            scripts/crew-performance.blend
            src/rendering/crew-performance.geometry.json
            src/rendering/crew-performance.glb.gz
            src/rendering/crew-performance.manifest.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-team-authoring-check
          path: |
            ${{ runner.temp }}/pit-team-check.log
            ${{ runner.temp }}/pit-team-*-cpu.json
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        scene: [aurel-day, vellamar-wet-night]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      CREW_BASELINE: ${{ matrix.variant == 'baseline' && '1' || '0' }}
      PIT_TEAM_CIRCUIT: ${{ matrix.scene == 'aurel-day' && 'aurel' || 'vellamar' }}
      PIT_TEAM_NIGHT: ${{ matrix.scene == 'aurel-day' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/apply-pit-team-candidate.mjs
      - uses: actions/download-artifact@v4
        with:
          name: pit-team-authored-assets
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: pit-team-${{ matrix.variant }}-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils
      - name: Observe actual service, all role poses, continuous recorded replay and rewind
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/28-race-pit-presentation.spec.ts --grep 'populated pit journey' --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-team-${{ matrix.variant }}-${{ matrix.scene }}-evidence
          path: |
            test-results/
            playwright-report/
            browser-progress.json
            browser-backend.json
            dist/BUILD_IDENTITY.json
          retention-days: 7
  integrate:
    needs: [prepare, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-pit-team-candidate.mjs
      - uses: actions/download-artifact@v4
        with:
          name: pit-team-authored-assets
          path: .
      - name: Append only verified source and assets on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- 'src/rendering/supplied-*' 'src/rendering/apx01-*' 'src/rendering/a61-*' 'src/rendering/aurel-people.*' scripts/apx01-assembly.blend scripts/aurel-people.blend scripts/grid-mechanic.blend
          git add scripts/crew-performance.blend src/rendering/crew-performance.geometry.json src/rendering/crew-performance.glb.gz src/rendering/crew-performance.manifest.json
          git rm docs/pit-team-transfer.0 docs/pit-team-transfer.1 scripts/apply-pit-team-candidate.mjs .github/workflows/pit-team-integration.yml
          git diff --cached --check
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'feat(pit): coordinate all crew roles and lower jacks before release'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > "$RUNNER_TEMP/pit-team-integrated-source.txt"
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-team-integrated-source
          path: ${{ runner.temp }}/pit-team-integrated-source.txt
          retention-days: 7
