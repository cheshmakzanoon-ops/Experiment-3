name: Phase 27H verified Blender asset
on:
  push:
    branches: [main]
    paths: [.github/workflows/phase27h-author.yml]
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b52d0358448ad4d2c8318e007dbdbabb3cd4df5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Obtain the exact verified Blender archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --version
      - name: Recover exact locally inspected envelope and export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/rendering/car-surfaces.ts'); s=p.read_text()
          changes=[
            ('[0.7, 0.028, 0.264, 0.146]','[0.7, 0.035, 0.28, 0.151]'),
            ('[1.12, 0.012, 0.202, 0.112]','[1.12, 0.019, 0.224, 0.118]'),
            ('[1.5, -0.056, 0.15, 0.074]','[1.5, -0.046, 0.165, 0.082]'),
            ('[-1.58, -0.232, 0.17, 0.09]','[-1.58, -0.214, 0.183, 0.096]'),
            ('[-1.25, -0.19, 0.246, 0.11]','[-1.25, -0.175, 0.257, 0.123]'),
            ('[-0.9, -0.128, 0.3, 0.125]','[-0.9, -0.105, 0.305, 0.14]'),
            ('[-0.5, -0.065, 0.32, 0.148]','[-0.5, -0.042, 0.326, 0.16]')]
          for old,new in changes:
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          assert hashlib.sha256(Path('docs/MASTER_DIRECTIVE.md').read_bytes()).hexdigest()=='f508a1b9be8e8a19a2ccc39d744e82d774cf95ecc773c12482efbcb9fb89f75c'
          assert hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest()=='0ee732475bc70f3bec4bfa7787f904d51bc28c185534dff3762f2d18801bbc59'
          PY
          node --experimental-transform-types scripts/hero-seed.ts test-results/authoring/hero-seed.json
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --background --python scripts/author-hero.py -- test-results/authoring/hero-seed.json test-results/authoring/apx01-shell.glb
          python scripts/pack-hero.py test-results/authoring/apx01-shell.glb test-results/authoring/apx01-shell.glb.gz
      - name: Canonicalize metadata and verify both unchanged content checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,os,urllib.request
          root=Path('test-results/authoring')
          p=root/'apx01-shell.glb.gz'; original=p.read_bytes()
          assert len(original)==70988
          assert original[:9]==bytes.fromhex('1f8b08000000000002')
          assert original[9] in (3,255), 'Unexpected gzip metadata; investigate rather than relax validation'
          decoded=gzip.decompress(original)
          assert hashlib.sha256(decoded).hexdigest()=='98bc137389b32427bf5362f6db39e5956e55eda6aec6cf7913f0d040891bfbf9'
          # gzip.compress(mtime=0) delegated OS=3 to zlib on older Python.
          # This byte carries platform metadata, not DEFLATE content or its CRC.
          canonical=original[:9]+b'\xff'+original[10:]
          assert gzip.decompress(canonical)==decoded
          assert hashlib.sha256(canonical).hexdigest()=='0d091d333c355a5c25b3244becf4c6f49689d7beda9cf6adbf671b091e6713a5'
          p.write_bytes(canonical)
          manifest_path=root/'apx01-shell.glb.json'
          manifest=json.loads(manifest_path.read_text())
          assert manifest['sha256']==hashlib.sha256(decoded).hexdigest()
          manifest['compressedSHA256']=hashlib.sha256(canonical).hexdigest()
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          def retain(path):
              data=path.read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
              assert result['sha']==expected
              return {'blob':expected,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          report={'files':{name:retain(root/name) for name in ['apx01-shell.glb.gz','apx01-shell.glb.json','apx01-shell.blend']},'source':'3b52d0358448ad4d2c8318e007dbdbabb3cd4df5','publishedBranch':False,'humanAccepted':False,'finalArtApproved':False}
          (root/'verified-blob.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Verified original authored asset blobs; both original geometry checksums retained. No source branch advanced; no artistic/human acceptance.\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h-authored-asset
          path: test-results/authoring/
          retention-days: 7
          if-no-files-found: warn
