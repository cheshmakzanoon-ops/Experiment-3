name: A26 offline validation workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/a26-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Archive current source and dependencies without credentials
        run: |
          git rev-parse HEAD > a26-workspace-base.txt
          tar --exclude=.git --exclude=playable --exclude=test-results --exclude=playwright-report -czf "$RUNNER_TEMP/a26-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: a26-offline-workspace
          path: ${{ runner.temp }}/a26-workspace.tar.gz
          retention-days: 3
          if-no-files-found: error
