name: Settings transition validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/browser-backend.ts
      - .github/workflows/settings-transition-validation.yml
      - src/main.ts
      - src/rendering/**
      - src/core/settings-transition.ts
      - e2e/30-menu-access.spec.ts
      - e2e/28-race-hud-layout.spec.ts
      - e2e/49-festival-menu-access.spec.ts
      - e2e/fixtures/festival-menu-access.ts
      - e2e/fixtures/completed-input-poll.ts
      - tests/completed-input-poll.test.ts
      - e2e/fixtures/race-hud-layout.ts
      - src/ui/interface.ts
      - src/ui/motocross-presentation.ts
      - src/ui/style.css
      - e2e/settings-transition.spec.ts
      - e2e/menu-startup.ts
      - e2e/gpu-frame-gate.spec.ts
      - e2e/gpu-program-readiness.spec.ts
      - e2e/gpu-index-preupload.spec.ts
      - e2e/fixtures/supplied-index-preupload.ts
      - e2e/fixtures/program-readiness.ts
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Include graphics-process diagnostics when a cold software draw loses its context.
      DEBUG: pw:browser
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Retain locked offline test dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/apex-node-modules.tar.gz" node_modules
          sha256sum package-lock.json > "$RUNNER_TEMP/dependency-lock.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/dependency-source.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: settings-offline-dependencies
          path: |
            ${{ runner.temp }}/apex-node-modules.tar.gz
            ${{ runner.temp }}/dependency-lock.sha256
            ${{ runner.temp }}/dependency-source.txt
          retention-days: 1
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm run build
      - name: Validate completed controller sampling contracts
        run: npm test -- tests/completed-input-poll.test.ts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Original settings and paused-grid regression
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/30-menu-access.spec.ts e2e/settings-transition.spec.ts e2e/gpu-frame-gate.spec.ts e2e/gpu-program-readiness.spec.ts e2e/gpu-index-preupload.spec.ts e2e/28-race-hud-layout.spec.ts e2e/49-festival-menu-access.spec.ts --trace on
      - name: Retain settings evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-transition-evidence
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 7
