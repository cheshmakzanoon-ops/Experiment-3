name: Publish playable snapshot

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/publish-playable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare immutable playable snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/playable"
          mkdir -p "$RUNNER_TEMP/playable"
          cp -R dist/. "$RUNNER_TEMP/playable/"
          find "$RUNNER_TEMP/playable" -type f -name '*.map' -delete
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/playable/SOURCE_COMMIT.txt"
          touch "$RUNNER_TEMP/playable/.nojekyll"
      - name: Publish playable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan playable-publish
          git rm -rf .
          cp -R "$RUNNER_TEMP/playable/." .
          git add -A
          git commit -m "deploy: playable snapshot ${GITHUB_SHA::12}"
          git branch -M playable
          git push --force origin playable
