name: A31 isolated browser toolchain
on:
  push:
    branches: [main]
    paths: [.github/workflows/a31-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Package repository-pinned browsers without credentials
        run: tar -C "$HOME/.cache/ms-playwright" -czf "$RUNNER_TEMP/a31-browsers.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: a31-pinned-browsers
          path: ${{ runner.temp }}/a31-browsers.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
