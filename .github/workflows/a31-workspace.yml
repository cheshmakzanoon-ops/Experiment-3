name: A31 isolated authoring workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/a31-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - name: Package credential-free local authoring workspace
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > A31_WORKSPACE_BASE.txt
          tar --exclude='./.git' --exclude='./node_modules/.cache' -czf "$RUNNER_TEMP/a31-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: a31-local-authoring-workspace
          path: ${{ runner.temp }}/a31-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
