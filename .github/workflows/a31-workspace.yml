name: A31 isolated browser toolchain
on:
  push:
    branches: [main]
    paths: [.github/workflows/a31-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Preserve exact source and dependencies without Git credentials
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/a31-source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/a31-source.tar.gz"
          tar -czf "$RUNNER_TEMP/a31-node-modules.tar.gz" node_modules
          tar -C "$HOME/.cache/ms-playwright" -czf "$RUNNER_TEMP/a31-browsers.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: a31-recovery-workspace
          path: |
            ${{ runner.temp }}/a31-source-commit.txt
            ${{ runner.temp }}/a31-source.tar.gz
            ${{ runner.temp }}/a31-node-modules.tar.gz
            ${{ runner.temp }}/a31-browsers.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
