name: A34 candidate authoring and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/a34-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover reviewed A34 source without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path, PurePosixPath
          shas=['250508c1cfe19ecc5fdd75f2bfeaada3e0bd7443','7c2b141a66b3947dce0bd0c5e965fbd58473a5f0','249dfc9b7f2bdf0adff6c17f5d4929ff8992a64c','f5fd1af25dec5e269e74d45fbaa5f053c200f098','fdfde6bd2151a2b175c989f26fbf4f1cf9010dee','d83901c641f907a55261496b4ca5d799d8ebe2ee','e7d8e42b83824714935d6f1f72ab0eca43c4829c','c54bf21aaab8de1817e0ea9faef53bf2305a233c']
          packed=bytearray()
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              packed.extend(data)
          assert hashlib.sha256(packed).hexdigest()=='77181df3130f00511aecc4b28482dea8e9f0796e0c3d270838193065d8d75a8c'
          bundle=json.loads(gzip.decompress(packed))
          assert bundle['schema']==1
          allowed={'scripts/author-tyre-blankets.py','src/rendering/tyre-blankets.ts','tests/tyre-blankets.test.ts','e2e/fixtures/tyre-blankets.ts','e2e/a34-tyre-blankets.spec.ts','docs/A34_TYRE_BLANKETS.md','.github/workflows/tyre-blankets-authoring.yml'}
          assert set(bundle['files'])==allowed
          for name,text in bundle['files'].items():
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not Path(name).exists(), 'Another agent already owns '+name
              Path(name).parent.mkdir(parents=True,exist_ok=True)
              Path(name).write_text(text,encoding='utf-8')
          script=Path(os.environ['RUNNER_TEMP'])/'a34-apply.py'
          script.write_text(bundle['apply'],encoding='utf-8')
          subprocess.run(['python',str(script)],check=True)
          Path('a34-candidate.json').write_text(json.dumps(bundle),encoding='utf-8')
          print('A34 candidate source recovered; base:',Path('a34-base.json').read_text())
          PY
      - name: Install checksum-pinned Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Author editable source and require the locally inspected GLB
        shell: bash
        run: |
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python scripts/author-tyre-blankets.py -- --render
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          b=json.loads(Path('a34-candidate.json').read_text())
          m=json.loads(Path('src/rendering/tyre-blankets.manifest.json').read_text())
          assert hashlib.sha256(Path('scripts/author-tyre-blankets.py').read_bytes()).hexdigest()==b['expectedSource']
          actual=hashlib.sha256(Path('public/models/aurel-tyre-blankets-and-controllers.glb').read_bytes()).hexdigest()
          assert actual==m['sha256']==b['expectedGLB'], (actual,b['expectedGLB'])
          print('A34_LOCAL_HOST_EXPORT_MATCH',actual)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Format only A34 and its narrow integration hooks
        run: npx prettier --write src/rendering/tyre-blankets.ts src/rendering/tyre-blankets.manifest.json tests/tyre-blankets.test.ts e2e/fixtures/tyre-blankets.ts e2e/a34-tyre-blankets.spec.ts src/rendering/circuit.ts src/rendering/renderer.ts
      - name: Complete lint, unit and production build gate
        run: npm run check
      - name: Khronos glTF validation in a temporary dependency directory
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/a34-validator" --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          node --input-type=commonjs - <<'JS'
          const fs=require('node:fs');
          const validator=require(process.env.RUNNER_TEMP+'/a34-validator/node_modules/gltf-validator');
          validator.validateBytes(new Uint8Array(fs.readFileSync('public/models/aurel-tyre-blankets-and-controllers.glb')),{uri:'aurel-tyre-blankets-and-controllers.glb',maxIssues:1000}).then(report=>{
            fs.writeFileSync('a34-gltf-validation.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.issues,null,2));
            if(report.issues.numErrors) process.exitCode=1;
          }).catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils python3-pil
      - name: Normal startup and real-circuit A34, A22 and A24 browser regression
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: a34-browser-results.json
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a34-tyre-blankets.spec.ts e2e/43-hero-garage.spec.ts e2e/44-pit-wall-station.spec.ts --reporter=line,json
      - name: Retain verified Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,tarfile,urllib.request
          from pathlib import Path
          bundle=json.loads(Path('a34-candidate.json').read_text())
          base=json.loads(Path('a34-base.json').read_text())
          browser=json.loads(Path('a34-browser-results.json').read_text())
          validator=json.loads(Path('a34-gltf-validation.json').read_text())
          assert browser['stats']['unexpected']==0 and browser['stats']['skipped']==0 and browser['stats']['flaky']==0
          receipt={'assetId':'A34','candidateBase':base['commit'],'runId':os.environ['GITHUB_RUN_ID'],'localHostedGLBMatch':True,'fullCheck':'passed','browser':browser['stats'],'gltf':validator['issues'],'finalArtApproved':False,'hardwareFPSCertified':False,'drivenLapReview':False}
          Path('docs/A34_VALIDATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          names=sorted(set(bundle['files'])|set(base['files'])|{'scripts/aurel-tyre-blankets-and-controllers.blend','public/models/aurel-tyre-blankets-and-controllers.glb','src/rendering/tyre-blankets.manifest.json','docs/A34_VALIDATION.json'})
          report={'base':base,'runId':os.environ['GITHUB_RUN_ID'],'files':{},'branchUpdated':False}
          for name in names:
              data=Path(name).read_bytes()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as r: obj=json.load(r)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert obj['sha']==sha
              report['files'][name]={'blob':sha,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          Path('a34-retained-blobs.json').write_text(json.dumps(report,indent=2)+'\n')
          with tarfile.open('a34-candidate-source.tar.gz','w:gz') as archive:
              for name in names: archive.add(name,arcname=name)
          print('A34_RETAINED_BEGIN\n'+json.dumps(report,indent=2)+'\nA34_RETAINED_END')
          PY
      - name: Emit actual in-game thumbnail evidence
        if: always()
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import base64,io
          from PIL import Image
          for path in sorted(Path('test-results').rglob('*.png')):
              if 'a34-' not in path.name: continue
              im=Image.open(path).convert('RGB');im.thumbnail((480,270))
              stream=io.BytesIO();im.save(stream,'JPEG',quality=35)
              print('A34_VISUAL',str(path),base64.b64encode(stream.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a34-candidate-evidence
          path: |
            a34-base.json
            a34-retained-blobs.json
            a34-candidate-source.tar.gz
            a34-browser-results.json
            a34-gltf-validation.json
            scripts/aurel-tyre-blankets-and-controllers.blend
            public/models/aurel-tyre-blankets-and-controllers.glb
            src/rendering/tyre-blankets.manifest.json
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
