name: A24 pit-wall asset reproducibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pit-wall-authoring.yml
      - scripts/author-pit-wall.py
      - src/rendering/pit-wall-station.manifest.json
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve committed geometry receipt
        run: cp src/rendering/pit-wall-station.manifest.json "$RUNNER_TEMP/a24-committed.json"
      - name: Install checksum-pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Reproduce authored geometry
        run: '"$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --background --factory-startup --python scripts/author-pit-wall.py'
      - name: Require identical runtime export and source provenance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'a24-committed.json').read_text())
          actual=json.loads(Path('src/rendering/pit-wall-station.manifest.json').read_text())
          assert actual == expected, 'A24 export differs from the committed manifest'
          data=Path('public/models/aurel-pit-wall-command-station.glb').read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected['sha256']
          print('A24 GLB reproduced exactly:', expected['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a24-authored-source
          path: |
            scripts/aurel-pit-wall-command-station.blend
            public/models/aurel-pit-wall-command-station.glb
            src/rendering/pit-wall-station.manifest.json
          if-no-files-found: error
          retention-days: 7
