name: Reference renderer review
on:
  push:
    branches: [main]
    paths: [.github/workflows/reference-toolchain.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/04-reference-visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-renderer-review
          path: |
            test-results
            playwright-report
          retention-days: 7
