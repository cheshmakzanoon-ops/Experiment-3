name: Reference renderer repaired candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/reference-toolchain.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore candidate source and apply verified singular-bump repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 1c4df169b6c282fd44af543408d6dceb367dc2f6
          git restore --source=1c4df169b6c282fd44af543408d6dceb367dc2f6 --worktree --staged src tests
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          url='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3/git/blobs/5b0692442a707b97215e4538c3afd4377d330afb'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
          patch=gzip.decompress(base64.b64decode(data['content']))
          assert hashlib.sha256(patch).hexdigest()=='78a0cbdb67551d18943da2659f6aec7dffc775d4e97ebb06e85e6725a9e64839'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'finite-bump.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          subprocess.run(['git','add','src','tests'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/04-reference-visual.spec.ts
      - name: Preserve exact tested Git objects without publishing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3'
          def api(path,data=None):
              request=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA'];base=api('/git/commits/'+parent)['tree']['sha']
          files=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert len(files)==14 and all(p.startswith(('src/rendering/','src/shaders/','tests/')) and '..' not in p for p in files)
          entries=[];hashes={}
          for path in files:
              content=pathlib.Path(path).read_bytes();hashes[path]=hashlib.sha256(content).hexdigest()
              blob=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert blob['sha']==hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'feat: reference-driven surfaces and finite high-preset rendering\n\nCandidate validated by CPU and real Chromium reference gates. Final publication still requires explicit visual review and full repository CI.','tree':tree,'parents':[parent]})['sha']
          result={'candidate':commit,'tree':tree,'parent':parent,'files':hashes,'unit_tests':512,'reference_tests':2,'visual_parity':'NOT achieved'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'renderer-candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-renderer-repaired
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/renderer-candidate.json
          retention-days: 7
