name: Reference reflection HDR diagnosis
on:
  push:
    branches: [main]
    paths: [.github/workflows/reference-toolchain.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 1c4df169b6c282fd44af543408d6dceb367dc2f6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instrument actual cubemap texels without modifying runtime source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2e/fixtures/reference-visual.ts'); s=p.read_text()
          before="  const renderer = new RacingRenderer(canvas, simulation.track);"
          instrument='''  const probeSamples: object[] = [];
            const originalProbe = T.CubeCamera.prototype.update;
            T.CubeCamera.prototype.update = function(gl, scene) {
              originalProbe.call(this, gl, scene);
              const target = this.renderTarget;
              for (let face = 0; face < 6; face++) {
                const bits = new Uint16Array(target.width * target.height * 4);
                gl.readRenderTargetPixels(target, 0, 0, target.width, target.height, bits, face);
                let nonfinite = 0, maximum = 0, minimum = Infinity;
                const examples: object[] = [];
                for (let i = 0; i < bits.length; i++) {
                  if (i % 4 === 3) continue;
                  const value = T.DataUtils.fromHalfFloat(bits[i]);
                  if (!Number.isFinite(value)) {
                    nonfinite++;
                    if (examples.length < 8) examples.push({x: (i / 4 | 0) % target.width, y: (i / 4 / target.width | 0), channel: i % 4, bits: bits[i]});
                  } else { maximum = Math.max(maximum, value); minimum = Math.min(minimum, value); }
                }
                probeSamples.push({face, nonfinite, maximum, minimum, examples});
              }
            };
          '''
          assert before in s;s=s.replace(before,instrument+before)
          s=s.replace('captures, diagnostics };','captures, diagnostics, probeSamples };')
          s=s.replace('} finally { renderer.dispose(); canvas.remove(); }','} finally { T.CubeCamera.prototype.update = originalProbe; renderer.dispose(); canvas.remove(); }')
          p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/04-reference-visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reflection-hdr-diagnosis
          path: |
            test-results
            playwright-report
          retention-days: 7
