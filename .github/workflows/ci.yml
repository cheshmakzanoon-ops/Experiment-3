name: Build and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Static application build
        uses: actions/upload-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
          retention-days: 7
      - name: Preserve exact committed source
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/apex-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apex-source
          path: |
            ${{ runner.temp }}/apex-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 7
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: node --experimental-transform-types scripts/race-classification.ts
      - name: Scenario evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-scenarios
          path: |
            docs/scenario-results.json
            docs/dynamics-benchmark.json
            docs/marshal-integration.json
            docs/wet-pit-results.json
            docs/integrated-driving.json
            docs/rotation-benchmark.json
            docs/pit-integration.json
            docs/race-classification.json
          retention-days: 7
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    needs: validate
    runs-on: ubuntu-latest
    # Independent runners retain every test/timeout without contending for one
    # software GPU. Playwright shards the complete suite; no file is filtered.
    # Eight independent partitions retain every case while surfacing regressions sooner.
    # Each runner keeps one worker and the existing per-test and job limits.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Browser screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  wet-presentation:
    # Early, independently retained GPU evidence for the dynamic presentation pass.
    # The complete browser suite above still runs unchanged, including these cases.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/00-wet-presentation.spec.ts e2e/weather.spec.ts
      - name: Wet presentation screenshots and GPU measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wet-presentation
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  publish:
    # Ship exactly the build tested above, never a parallel unvalidated rebuild.
    # Main is the only source branch; compiled builds are artifacts, not branches.
    needs: [validate, scenarios, browser, wet-presentation]
    # Manual validation of the current main must produce the SAME gated artifact.
    # Keep success() and all needs: a dispatch never bypasses a failed test.
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: apex-playable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - name: Prepare tested main-branch release artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'A newer source commit exists; skipping stale release publication.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find dist -type f -name '*.map' -delete
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          touch dist/.nojekyll
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Tested release source on main: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve tested release without creating another branch
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-formula-release
          path: dist/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
