name: Build and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:physics
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            test-results/
            playwright-report/
            docs/scenario-results.json
          retention-days: 7
      - name: Static application build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apex-formula-web
          path: dist/
          retention-days: 7
