name: Build and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Let a running main validation finish so long race/browser evidence is not
# repeatedly lost to the next verified increment. GitHub's default single
# pending slot retains only the newest waiting run, not an unbounded backlog.
# Publication still requires all gates and that the tested SHA remains main.
concurrency:
  group: motobound-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      # Produce the exact build independently of the unit-test job. A unit
      # regression must not suppress browser diagnostics for a valid build;
      # publication still requires both jobs and every existing browser gate.
      - name: Lint, validate content, typecheck and build without source changes
        run: node --experimental-transform-types scripts/source-stability.ts -- bash -c 'npm run lint && npm run validate:content && npm run build'
      - name: Static application build
        uses: actions/upload-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
          retention-days: 7
      - name: Preserve exact committed source
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/apex-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apex-source
          path: |
            ${{ runner.temp }}/apex-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 7
  unit-tests:
    # Native Vitest partitions cover the complete suite exactly once. Each
    # matrix result remains required by publish; no assertions are excluded.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      # Retain pretest asset generation and all tests across four partitions.
      - name: Full unit suite partition without source changes
        run: node --experimental-transform-types scripts/source-stability.ts -- npm test -- --shard=${{ matrix.shard }}/4 --reporter=verbose
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: node --experimental-transform-types scripts/race-classification.ts
      - run: node --experimental-transform-types scripts/vellamar-race.ts clear,changeable
      - run: node --experimental-transform-types scripts/reference-targets.ts
      - name: Scenario evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-scenarios
          path: |
            docs/scenario-results.json
            docs/dynamics-benchmark.json
            docs/marshal-integration.json
            docs/pit-integration.json
            docs/wet-pit-results.json
            docs/integrated-driving.json
            docs/rotation-benchmark.json
            docs/race-classification.json
            docs/vellamar-race.json
            docs/reference-targets.json
          retention-days: 7
  vehicle-calibration:
    # Keep the full registry out of the preceding scenario job's 15-minute
    # aggregate budget. This is required, not a replacement or optional subset.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Enforce every existing vehicle calibration band
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vehicle-gate/docs/production"
          cp docs/production/CONTENT_PIPELINE.md "$RUNNER_TEMP/vehicle-gate/docs/production/CONTENT_PIPELINE.md"
          # The authoring command normally reports OUT without failing. Strict
          # mode enforces its existing fine/coarse target bands, unchanged.
          # Both generated reports belong outside committed source inputs.
          node --experimental-transform-types scripts/source-stability.ts -- bash -c '
            set -euo pipefail
            cd "$RUNNER_TEMP/vehicle-gate"
            node --experimental-transform-types "$GITHUB_WORKSPACE/scripts/vehicle-calibration.ts" --strict
          ' 2>&1 | tee "$RUNNER_TEMP/vehicle-gate/vehicle-calibration.log"
      - name: Preserve full calibration and near-edge disclosure, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-calibration
          path: |
            ${{ runner.temp }}/vehicle-gate/docs/vehicle-calibration.json
            ${{ runner.temp }}/vehicle-gate/docs/production/CONTENT_PIPELINE.md
            ${{ runner.temp }}/vehicle-gate/vehicle-calibration.log
          retention-days: 7
  offroad-scenarios:
    runs-on: ubuntu-latest
    # The full original gate took about 14 minutes locally. Give it a separate
    # bounded job so it cannot exhaust the existing 15-minute scenario job.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Full offroad calibrations and races without source changes
        # Leave time to upload partial reports and the log if the gate times out.
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offroad-gate/docs"
          # Guard the repository while the unchanged validators write their
          # relative docs/ reports outside the committed application inputs.
          node --experimental-transform-types scripts/source-stability.ts -- bash -c '
            set -euo pipefail
            unset OFFROAD_RACE
            cd "$RUNNER_TEMP/offroad-gate"
            node --experimental-transform-types "$GITHUB_WORKSPACE/scripts/offroad-calibration.ts"
            node --experimental-transform-types "$GITHUB_WORKSPACE/scripts/offroad-races.ts"
          ' 2>&1 | tee "$RUNNER_TEMP/offroad-gate/offroad-gate.log"
      - name: Offroad evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offroad-scenarios
          path: |
            ${{ runner.temp }}/offroad-gate/docs/offroad-calibration.json
            ${{ runner.temp }}/offroad-gate/docs/offroad-races.json
            ${{ runner.temp }}/offroad-gate/offroad-gate.log
          retention-days: 7
  browser:
    # Run every original case on a verified software renderer capable of
    # continuous observation. The separate SwiftShader GPU gate is retained.
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    needs: validate
    runs-on: ubuntu-latest
    # Enumerate the full suite, balance long race cases, then verify the selected
    # IDs against Playwright itself. Every case belongs to exactly one partition;
    # serial groups remain intact. Long Mesa shards previously reached the 45
    # minute job cap mid-suite; retain all tests and per-test assertions.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - run: npx playwright install --with-deps chromium
      - name: Install Mesa software graphics and virtual display
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e:shard -- ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Preserve compact browser acceptance receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-receipts-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: |
            browser-shard-plan.json
            browser-backend.json
            browser-progress.json
            dist/BUILD_IDENTITY.json
          retention-days: 7
      - name: Browser screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: |
            test-results/
            playwright-report/
            browser-shard-plan.json
            browser-backend.json
            browser-progress.json
          retention-days: 7

  wet-presentation:
    env:
      APEX_BROWSER_BACKEND: swiftshader
    # Early GPU evidence for wet presentation and source-preserving player passes.
    # The complete browser suite above still runs unchanged, including these cases.
    needs: validate
    runs-on: ubuntu-latest
    # The five specs take 6.6-7.3 min of an 8-9 min job on a typical runner and
    # 9.0-9.4 min on a slower one (unrelated specs 15-35% slower in the same
    # run), so 10 min cancelled passing runs. Installing Playwright's system
    # packages usually takes under a minute but took 6 min on runs for 2383805
    # and 8cf27c2, which were cancelled at 15 min with the specs still running.
    # A full software-GPU wet review can exceed the former 20-minute job cap
    # even when every scene and rendering assertion remains unchanged.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/00-wet-presentation.spec.ts e2e/weather.spec.ts e2e/41-player-render-budget.spec.ts e2e/42-full-scene-index-budget.spec.ts e2e/30-race-finish.spec.ts
      - name: Wet and supplied-player presentation screenshots and GPU measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wet-presentation
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 7

  publish:
    # Ship exactly the build tested above, never a parallel unvalidated rebuild.
    # The CDN workflow consumes this gated artifact, not an independent build.
    needs: [validate, unit-tests, scenarios, vehicle-calibration, offroad-scenarios, browser, wet-presentation]
    # Manual validation of the current main must produce the SAME gated artifact.
    # Keep success() and all needs: a dispatch never bypasses a failed test.
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: apex-playable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Retry only artifact transport. A third failure remains a hard failure;
      # no build is regenerated and no browser assertion is retried or skipped.
      - name: Download tested build (attempt 1 of 3)
        id: download_web_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 2
        if: steps.download_web_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed; retrying the same run artifact.'
          rm -rf -- dist/
          sleep 5
      - name: Download tested build (attempt 2 of 3)
        id: download_web_2
        if: steps.download_web_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Clear partial download and back off before retry 3
        if: steps.download_web_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::Build artifact download failed twice; making the final attempt.'
          rm -rf -- dist/
          sleep 15
      - name: Download tested build (final attempt)
        id: download_web_3
        if: steps.download_web_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: apex-formula-web
          path: dist/
      - name: Require downloaded build before continuing
        shell: bash
        env:
          DOWNLOAD_SUCCEEDED: ${{ steps.download_web_1.outcome == 'success' || steps.download_web_2.outcome == 'success' || steps.download_web_3.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_SUCCEEDED" = true
          test -s dist/index.html
          test -d dist/assets
      - name: Prepare tested main-branch release artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'A newer source commit exists; skipping stale release publication.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find dist -type f -name '*.map' -delete
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          touch dist/.nojekyll
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Tested release source on main: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve tested release without creating another branch
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-formula-release
          path: dist/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
