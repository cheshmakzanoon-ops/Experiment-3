name: A32 candidate validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/a32-candidate.yml]
permissions:
  contents: write
concurrency:
  group: a32-candidate-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Recover exact scoped candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a32-evidence"
          for sha in b7e20ed4e8349394346253d822660a868a5cee6c 77b56267828bf90cbe3e625e7d80c84eee378859 17148057d6d747fe22f47044fc12ce564b54f1bb; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 -d >> "$RUNNER_TEMP/a32-candidate.br"
          done
          echo '0887b84ca26870e574a1ea5e5f54d1489a44647d8a37a39b658e2713b173bfb5  '"$RUNNER_TEMP/a32-candidate.br" | sha256sum -c
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          fs.writeFileSync(process.env.RUNNER_TEMP+'/a32-payload.json',zlib.brotliDecompressSync(fs.readFileSync(process.env.RUNNER_TEMP+'/a32-candidate.br')));
          JS
          git fetch --no-tags origin 51466782bf02e7e9e98fde53fabdf8fee89afcbf --depth=1
          python <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path.cwd(); tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=json.loads((tmp/'a32-payload.json').read_text())
          allowed={'scripts/author-a32-pit-jacks.py','src/rendering/a32-pit-jacks.ts','tests/a32-pit-jacks.test.ts','e2e/a32-pit-jacks.spec.ts','e2e/fixtures/a32-pit-jacks.ts','docs/A32_FRONT_REAR_JACKS.md'}
          modified={'src/rendering/pit-crew.ts','src/rendering/pit-machinery.ts','src/rendering/pit-presentation.ts','src/rendering/renderer.ts'}
          assert set(p['files'])==allowed and set(p['modified'])==modified
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          before={f:git('rev-parse','HEAD:'+f) for f in sorted(modified|{'.github/workflows/a32-jacks-authoring.yml'})}
          (tmp/'a32-evidence/preimages.json').write_text(json.dumps({'head':git('rev-parse','HEAD'),'blobs':before},indent=2)+'\n')
          (tmp/'a32.patch').write_text(p['patch'])
          subprocess.run(['git','apply','--3way','--index',str(tmp/'a32.patch')],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==modified
          for f, text in p['files'].items():
              path=root/f
              assert not path.exists(), 'Candidate path already exists: '+f
              path.write_text(text)
          print('Applied A32-only candidate; no branch reference updated.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4510393630d9094ef4362f493a71ad9da64a3629" --jq .content | base64 -d > "$RUNNER_TEMP/a32-rolling.patch"
          echo '059358a523ba3606eb34ae7c7db93f83606b48302a5434ad125a5f8a9c9c2e14  '"$RUNNER_TEMP/a32-rolling.patch" | sha256sum -c
          git apply "$RUNNER_TEMP/a32-rolling.patch"
      - name: Pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 240 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum -c
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --python-exit-code 1 --python scripts/author-a32-pit-jacks.py | tee "$RUNNER_TEMP/a32-evidence/blender.log"
      - name: Complete source validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check 2>&1 | tee "$RUNNER_TEMP/a32-evidence/check.log"
      - run: npx playwright install --with-deps chromium
      - name: Install verified Mesa renderer
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Real-circuit A32 browser validation
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a32-pit-jacks.spec.ts 2>&1 | tee "$RUNNER_TEMP/a32-evidence/browser.log"
      - name: Retain validated Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); root=pathlib.Path.cwd()
          p=json.loads((tmp/'a32-payload.json').read_text())
          outputs=['scripts/a32-pit-jacks.blend','public/models/a32-pit-jacks.glb','src/rendering/a32-pit-jacks.manifest.json']
          assert p['outputs']==outputs
          workflow='.github/workflows/a32-jacks-authoring.yml'
          (root/workflow).write_text(p['finalWorkflow'])
          files=sorted(list(p['files'])+p['modified']+outputs+[workflow])
          objects=[]
          for name in files:
              raw=(root/name).read_bytes()
              expected=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              body=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=120) as response: result=json.load(response)
              assert result['sha']==expected
              objects.append({'path':name,'mode':'100644','type':'blob','sha':expected,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          receipt={'run':os.environ['GITHUB_RUN_ID'],'preimages':json.loads((tmp/'a32-evidence/preimages.json').read_text()),'objects':objects,'check':'passed','browser':'passed','finalArtApproved':False}
          (tmp/'a32-evidence/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Collect candidate and visual evidence
        if: always()
        shell: bash
        run: |
          python <<'PY'
          import json, os, pathlib, shutil
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); out=tmp/'a32-evidence'; out.mkdir(exist_ok=True)
          payload=tmp/'a32-payload.json'
          if payload.exists():
              p=json.loads(payload.read_text())
              for name in list(p['files'])+p['modified']+p['outputs']+['.github/workflows/a32-jacks-authoring.yml']:
                  src=pathlib.Path(name)
                  if src.exists():
                      dest=out/'candidate'/name; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dest)
          for name in ['test-results','playwright-report']:
              if pathlib.Path(name).exists(): shutil.copytree(name,out/name,dirs_exist_ok=True)
          if pathlib.Path('browser-backend.json').exists(): shutil.copy2('browser-backend.json',out/'browser-backend.json')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a32-candidate-evidence
          path: ${{ runner.temp }}/a32-evidence
          retention-days: 7
          if-no-files-found: error
