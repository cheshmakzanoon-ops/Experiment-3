name: A08-A10 exact operations candidate
on:
  push:
    branches: [main]
    paths:
      - .github/operations-stage.py
      - .github/operations-candidate.*.xzpart
      - .github/workflows/trackside-operations-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurel-operations-candidate
  cancel-in-progress: true
env:
  BASE_COMMIT: f952d587fa9a3ccfae562611371bb18cea2987a4
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python .github/operations-stage.py prepare
      - name: Pinned Blender export and native reopen
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/blender"
          python scripts/rebuild-trackside-operations.py --blender "$RUNNER_TEMP/blender/blender" --output-root "$RUNNER_TEMP/operations-export"
          python .github/operations-stage.py collect
      - run: python .github/operations-stage.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: operations-source
          path: |
            ${{ runner.temp }}/operations-source.tar.gz
            ${{ runner.temp }}/operations-source.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-authoring
          path: |
            ${{ runner.temp }}/operations-export/logs/
            ${{ runner.temp }}/operations-export/authoring-receipt.json
          retention-days: 7
  check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operations-source
          path: ${{ runner.temp }}/source
      - run: python .github/operations-stage.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: operations-web
          path: dist/
          retention-days: 7
          if-no-files-found: error
  survey:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        lighting: [day, sunset, night]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      OPERATIONS_BASELINE: ${{ matrix.revision == 'baseline' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operations-source
          path: ${{ runner.temp }}/source
      - name: Restore baseline or exact candidate
        run: |
          if [ '${{ matrix.revision }}' = baseline ]; then
            git checkout --detach "$BASE_COMMIT"
          else
            python .github/operations-stage.py restore
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Add only inspection helpers after the original baseline build
        if: matrix.revision == 'baseline'
        run: |
          tar -xzf "$RUNNER_TEMP/source/operations-source.tar.gz" \
            e2e/57-trackside-operations.spec.ts e2e/fixtures/trackside-operations.ts \
            src/rendering/track-board-plan.ts src/rendering/track-signal-plan.ts \
            src/rendering/broadcast-camera-placement.ts src/rendering/broadcast-cameras.manifest.json
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/57-trackside-operations.spec.ts --grep 'production ${{ matrix.lighting }} operations'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-${{ matrix.revision }}-${{ matrix.lighting }}
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 7
  journeys:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: retained-infrastructure
            specs: e2e/56-track-infrastructure.spec.ts
          - name: cockpit
            specs: e2e/p0-cockpit-framing.spec.ts
          - name: grid-and-venue
            specs: e2e/50-grid-presentation.spec.ts e2e/55-start-finish.spec.ts
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operations-source
          path: ${{ runner.temp }}/source
      - run: python .github/operations-stage.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test ${{ matrix.specs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-journey-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 7
  compare:
    needs: survey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: operations-*-*
          path: ${{ runner.temp }}/evidence
      - name: Compare identical complete-frame workloads against f952d587
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'evidence'
          rows=[]
          for lighting in ['day','sunset','night']:
              reports=[]
              for revision in ['baseline','candidate']:
                  paths=list((root/f'operations-{revision}-{lighting}').rglob('operations-report.json'))
                  assert len(paths)==1,(revision,lighting,paths)
                  reports.append(json.loads(paths[0].read_text()))
              before,after=reports
              assert before['configuration']==after['configuration'],'Workload configuration changed'
              a=next(i for i in before['images'] if i['name']=='normal-cockpit')
              b=next(i for i in after['images'] if i['name']=='normal-cockpit')
              for key in ['calls','triangles']:
                  assert b[key]*100<=a[key]*102,(lighting,key,a[key],b[key])
              rows.append({'lighting':lighting,'baseline':a,'candidate':b,'configuration':before['configuration']})
          out=Path(os.environ['RUNNER_TEMP'])/'operations-comparison.json'
          out.write_text(json.dumps({'baseline':'f952d587fa9a3ccfae562611371bb18cea2987a4','rows':rows,'hardwareFPS':False},indent=2))
          print(out.read_text())
      - uses: actions/upload-artifact@v4
        with:
          name: operations-comparison
          path: ${{ runner.temp }}/operations-comparison.json
          retention-days: 7
          if-no-files-found: error
  seal:
    needs: [check, survey, journeys, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operations-source
          path: ${{ runner.temp }}/source
      - run: tar -xzf "$RUNNER_TEMP/source/operations-source.tar.gz"
      - name: Seal passing candidate without advancing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/operations-stage.py seal
      - uses: actions/upload-artifact@v4
        with:
          name: operations-publication
          path: ${{ runner.temp }}/operations-publication.json
          retention-days: 7
          if-no-files-found: error
