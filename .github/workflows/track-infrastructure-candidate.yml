name: A01-A07 exact infrastructure candidate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/track-infrastructure-candidate.yml
      - .github/infrastructure-stage.py
      - .github/infrastructure-resume.xz
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: aurel-infrastructure-candidate
  cancel-in-progress: true
env:
  BASE_COMMIT: 1b82c5a4424b6f503649d0516a4217608c0d54c3
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: infrastructure-source
          run-id: 37149330552
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Restore exact authored candidate and corrected observer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/infrastructure-stage.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-reviewed-source
          path: |
            ${{ runner.temp }}/infrastructure-reviewed-source.tar.gz
            ${{ runner.temp }}/infrastructure-reviewed-source.json
          retention-days: 7
          if-no-files-found: error
  check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: infrastructure-reviewed-source
          path: ${{ runner.temp }}/reviewed
      - run: python .github/infrastructure-stage.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-reviewed-web
          path: dist/
          retention-days: 7
          if-no-files-found: error
  survey:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        lighting: [day, sunset, night]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      INFRASTRUCTURE_BASELINE: ${{ matrix.revision == 'baseline' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: infrastructure-reviewed-source
          path: ${{ runner.temp }}/reviewed
      - name: Restore selected source
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.revision }}' = baseline ]; then
            git checkout --detach "$BASE_COMMIT"
          else
            python .github/infrastructure-stage.py restore
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Add only observation files to the already built original baseline
        if: matrix.revision == 'baseline'
        run: |
          tar -xzf "$RUNNER_TEMP/reviewed/infrastructure-reviewed-source.tar.gz" \
            e2e/56-track-infrastructure.spec.ts e2e/fixtures/track-infrastructure.ts \
            scripts/infrastructure-render-budget.ts docs/TRACK_INFRASTRUCTURE_RENDER_BASELINE.json
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Complete production scene and recorded lamp pixels
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/56-track-infrastructure.spec.ts --grep 'production ${{ matrix.lighting }} scene'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-reviewed-${{ matrix.revision }}-${{ matrix.lighting }}
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 7
  seal:
    needs: [prepare, check, survey]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: infrastructure-reviewed-source
          path: ${{ runner.temp }}/reviewed
      - name: Create tested immutable commit without advancing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/infrastructure-stage.py seal
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 7
          if-no-files-found: error
