name: Publish playable static F1 bundle

on:
  push:
    paths:
      - '.github/workflows/live-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Build current F1 game
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Stage browser-ready static bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf playable
          mkdir -p playable
          cp -R dist/. playable/
          find playable -type f -name '*.map' -delete

          # Remove temporary deployment experiments from the source tree.
          rm -f .github/workflows/live-preview.yml
          rm -f .github/workflows/pages.yml

          test -f playable/index.html
          test -n "$(find playable/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$(find playable/assets -maxdepth 1 -type f -name 'three-*.js' -print -quit)"
          test -n "$(find playable/assets -maxdepth 1 -type f -name 'apx01-shell*.gz' -print -quit)"
          git diff --check

      - name: Commit static playable bundle to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add -A playable .github/workflows/live-preview.yml .github/workflows/pages.yml
          git commit -m "build: publish browser-ready playable F1 bundle"             -m "Generate the static Vite production output from the current F1 main tree, retain only runtime assets (no source maps), and remove temporary deployment-helper workflows. Game source and simulation behavior are unchanged."
          git push origin HEAD:main
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify CDN source files exist at published commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PUBLISHED_SHA"
          test -f playable/index.html
          echo "Published static bundle at $PUBLISHED_SHA"
