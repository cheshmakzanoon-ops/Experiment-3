name: Apply supplied-player runtime correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-diagnostics.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify base and apply exact reviewed correction
        env:
          PATCH_SHA256: 67c602dd02f95ed8a860e519576e335deecbfc1821ad7c118185fcada5bce9bd
          PATCH_B64: |
            
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b538bc551023799f055051f6d5c500c9f05d783c
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256'], 'Patch integrity mismatch'
          Path(os.environ['RUNNER_TEMP'], 'runtime.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/runtime.patch"
          git apply "$RUNNER_TEMP/runtime.patch"
          git rm .github/workflows/runtime-diagnostics.yml
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Validate final source before committing
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/runtime-check.log"
      - name: Commit validated runtime source and start normal CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add docs/PLAYER_RUNTIME_RECOVERY.md e2e/41-player-render-budget.spec.ts e2e/fixtures/player-render-budget.ts src/rendering/pit-material-warmup.ts src/rendering/preparation.ts src/rendering/renderer.ts src/rendering/supplied-player.ts src/rendering/supplied-shader-work.ts src/rendering/supplied-skin-bounds.ts tests/pit-material-warmup.test.ts tests/preparation.test.ts tests/startup.test.ts tests/supplied-shader-work.test.ts tests/supplied-skin-bounds.test.ts
          git diff --cached --check
          git config user.name cheshmakzanoon-ops
          git config user.email cheshmakzanoon@gmail.com
          git commit -m "perf: bound supplied-player skinning and prepare actual scene shaders before grid release"
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-source-commit.txt"
          git show --stat --oneline HEAD > "$RUNNER_TEMP/runtime-source-summary.txt"
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-correction-validation
          path: |
            ${{ runner.temp }}/runtime-check.log
            ${{ runner.temp }}/runtime-source-commit.txt
            ${{ runner.temp }}/runtime-source-summary.txt
          retention-days: 7
          if-no-files-found: warn
