name: Runtime diagnostic toolchain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-diagnostics.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve locked dependencies for offline source validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-toolchain"
          tar -czf "$RUNNER_TEMP/runtime-toolchain/node_modules.tar.gz" node_modules
          sha256sum package-lock.json > "$RUNNER_TEMP/runtime-toolchain/package-lock.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-toolchain/source-commit.txt"
          node --version > "$RUNNER_TEMP/runtime-toolchain/node-version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostic-toolchain
          path: ${{ runner.temp }}/runtime-toolchain/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
