name: Software graphics backend investigation
on:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-backend-investigation.yml]
permissions:
  contents: read
jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install standard Mesa software graphics and virtual display
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Install isolated backend selection and identity assertion
        shell: bash
        run: |
          cat > playwright.backend.config.ts <<'EOF'
          import { defineConfig, chromium } from '@playwright/test';
          import base from './playwright.config.ts';
          export default defineConfig(base, {
            use: {
              ...base.use,
              headless: false,
              launchOptions: {
                executablePath: chromium.executablePath(),
                args: ['--use-gl=angle', '--use-angle=gl', '--ignore-gpu-blocklist'],
              },
            },
          });
          EOF
          cat > e2e/00-backend-identity.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';
          test('software backend identity and real WebGL2 framebuffer', async ({page}, info) => {
            await page.goto('/');
            const adapter = await page.evaluate(() => {
              const canvas = document.createElement('canvas');
              const gl = canvas.getContext('webgl2');
              if (!gl) throw new Error('No WebGL2 context');
              const debug = gl.getExtension('WEBGL_debug_renderer_info');
              if (!debug) throw new Error('No renderer identity');
              gl.clearColor(0.25, 0.5, 0.75, 1); gl.clear(gl.COLOR_BUFFER_BIT);
              const pixel = new Uint8Array(4); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
              const result = {renderer:gl.getParameter(debug.UNMASKED_RENDERER_WEBGL),version:gl.getParameter(gl.VERSION),pixel:[...pixel],error:gl.getError()};
              gl.getExtension('WEBGL_lose_context')?.loseContext(); return result;
            });
            console.log('MESA_ADAPTER '+JSON.stringify(adapter));
            await info.attach('software-adapter.json',{body:JSON.stringify(adapter,null,2),contentType:'application/json'});
            expect(adapter.renderer).toMatch(/llvmpipe/i);
            expect(adapter.renderer).not.toMatch(/swiftshader/i);
            expect(adapter.error).toBe(0);
            expect(adapter.pixel).toEqual([64,128,191,255]);
          });
          EOF
      - name: Run original exact-pixel and resource oracles unchanged
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test --config=playwright.backend.config.ts e2e/00-backend-identity.spec.ts e2e/41-player-render-budget.spec.ts e2e/42-full-scene-index-budget.spec.ts
      - name: Preserve backend identity, images, timings and all failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-backend-investigation
          path: |
            test-results/
            playwright-report/
          retention-days: 3
