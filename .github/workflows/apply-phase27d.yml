name: Apply validated Phase 27D crowd-night increment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-phase27d.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact integration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b19824e5457e92098f5733c0038e01ff5cd1c62b"

      - name: Reconstruct and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase27d-part0 .phase27d-part1 .phase27d-part2 .phase27d-part3 \
            | base64 --decode | gzip --decompress > /tmp/phase27d.patch
          git apply --check /tmp/phase27d.patch
          git apply /tmp/phase27d.patch
          rm .phase27d-part0 .phase27d-part1 .phase27d-part2 .phase27d-part3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Full static, unit and production-build gate
        run: npm run check

      - name: Native physics and race integration gate
        run: npm run test:physics

      - name: Commit and push the validated source increment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No Phase 27D changes to publish"; exit 1; }
          git commit -m "feat: add bounded distant crowds and snapshot-driven spectator reactions" \
            -m "Replay the locally validated Phase 27D presentation increment on top of the published diagonal spray stability fix without weakening existing gates."
          git push origin HEAD:main
