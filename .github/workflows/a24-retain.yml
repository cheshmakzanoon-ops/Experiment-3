name: A24 candidate authoring and validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/a24-retain.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover source and pin the inspected hosted export
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request, zlib
          from pathlib import Path, PurePosixPath
          shas=['e751f9f84575bea6d1af70d2ebb04bcc0337b95b','28b705dc530e963a0ef684f25006cbc2f0dd1a68','95902b71d6b2d6da5abeb5a2e8cfa1488bd4e4e3','b76366ccb7b507ecb50da2cdf91558bcecde9db0']
          chunks=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r: value=json.load(r)
              part=base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              chunks.append(part)
          packed=b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest()=='17aae0b9188dee5281b9e9406ef30265714fc15511b852237d5e1555d6b420e3'
          data=json.loads(zlib.decompress(packed))
          assert data['version']==1 and data['baseCommit']=='db09939ad40508f1cbcea616b4615677d08c663d'
          for name,sha in data['baseSHA256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, 'Baseline changed: '+name
          patch=Path(os.environ['RUNNER_TEMP'])/'a24.patch'
          patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,text in data['files'].items():
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not Path(name).exists(), name
              Path(name).parent.mkdir(parents=True,exist_ok=True)
              Path(name).write_text(text,encoding='utf-8')
          for name,sha in data['expectedSHA256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, name
          # Explicit reviewed revision: retain the independently inspected hosted bytes.
          # This does not pretend that the earlier local/host comparison passed.
          manifest='src/rendering/pit-wall-station.manifest.json'
          receipt=json.loads(Path(manifest).read_text())
          receipt['bytes']=6282844
          receipt['sha256']='702497c1a912213fbd5f047dda1b28b7fe4e08ad001c57d34f1d84fbf20c1cf3'
          Path(manifest).write_text(json.dumps(receipt,indent=2)+'\n')
          doc=Path('docs/A24_PIT_WALL_STATION.md')
          note="### Export identity\n\nThe chosen hosted export is SHA-256 `702497c1a912213fbd5f047dda1b28b7fe4e08ad001c57d34f1d84fbf20c1cf3`. Two independent hosted runs produced these bytes. The local export `3c451d60a898836ca95c0cb1fc1fd00f29ad1177f3b6d3505911f910ad185e03` differed in indexed geometry/vertex packing; the embedded texture, counts, hierarchy and sockets agreed. That failed reproduction was retained, not called a pass. Pixel equivalence and universal cross-host byte reproducibility are not claimed. Regenerated exports are candidates requiring review. Runtime integrity remains exact, and tests run against the chosen export. The read-only authoring workflow reports future differences without overwriting release assets.\n\n"
          doc.write_text(doc.read_text().replace('original deterministic Blender authoring script','original procedural Blender authoring script').replace('6,282,972','6,282,844').replace('Hosted main CI remains',note+'Hosted main CI remains'))
          revised={'docs/A24_PIT_WALL_STATION.md':'987b8f1b4664d3dddf37000f2749c89d61242a3eb28cbd224b96dbe2db2602f9',manifest:'0d49f123a8a0a3c9144e3cb9b38b5d05915be8c70cf326470a881febb105254a'}
          for name,sha in revised.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, name
          data['expectedSHA256'].update(revised)
          data['glbSHA256']=receipt['sha256']
          Path('a24-candidate.json').write_text(json.dumps(data,indent=2)+'\n')
          print('Verified candidate files:',len(data['expectedSHA256']))
          PY
      - name: Install checksum-pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Author editable source and runtime model
        run: '"$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --background --factory-startup --python scripts/author-pit-wall.py'
      - name: Require the exact inspected hosted export
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('a24-candidate.json').read_text())
          for name,sha in data['expectedSHA256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, name
          glb=Path('public/models/aurel-pit-wall-command-station.glb').read_bytes()
          assert hashlib.sha256(glb).hexdigest()==data['glbSHA256']
          print('A24 exact reviewed hosted GLB:',data['glbSHA256'])
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Retain candidate Git objects without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,tarfile,urllib.request
          from pathlib import Path
          candidate=json.loads(Path('a24-candidate.json').read_text())
          names=sorted(set(candidate['expectedSHA256'])|{'scripts/aurel-pit-wall-command-station.blend','public/models/aurel-pit-wall-command-station.glb'})
          report={'source':os.environ['GITHUB_SHA'],'baseCommit':candidate['baseCommit'],'files':{},'branchUpdated':False}
          for name in names:
              data=Path(name).read_bytes()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as r: result=json.load(r)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha']==sha
              report['files'][name]={'blob':sha,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          Path('a24-retained-blobs.json').write_text(json.dumps(report,indent=2)+'\n')
          with tarfile.open('a24-candidate-source.tar.gz','w:gz') as archive:
              for name in names: archive.add(name,arcname=name)
          print(json.dumps(report,indent=2))
          PY
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: Normal startup, A24 day sunset rain, and retained A22 regression
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/44-pit-wall-station.spec.ts e2e/43-hero-garage.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a24-candidate-evidence
          path: |
            a24-retained-blobs.json
            a24-candidate-source.tar.gz
            scripts/aurel-pit-wall-command-station.blend
            public/models/aurel-pit-wall-command-station.glb
            src/rendering/pit-wall-station.manifest.json
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error
