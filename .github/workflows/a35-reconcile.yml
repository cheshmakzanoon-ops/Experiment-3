name: A35 final concurrent integration check
on:
  push:
    branches: [main]
    paths: [.github/workflows/a35-reconcile.yml]
permissions:
  contents: read
concurrency:
  group: a35-final-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PLAYWRIGHT_JSON_OUTPUT_FILE: a35-final-browser.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Recover retained assets and reconcile only A35-owned edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          files={'.github/workflows/a35-authoring.yml':'9816b3550dbc4708e063b21645adea3d5c0e434c','docs/A35_TYRE_TROLLEYS_RACKS.md':'24cc08000e5b5ab2f55f61b18edf07609cb401ec','e2e/a35-tyre-trolleys-racks.spec.ts':'2e05e747194a2fc3db294ce599aeb2fe1f44c8f4','e2e/fixtures/tyre-trolleys-racks.ts':'23d925ba57022fad173994779b85d32d75a8e46f','public/models/aurel-tyre-trolleys-racks.glb':'94ca8313aacd36a9d91a4231f983a43b25e66f9b','scripts/aurel-tyre-trolleys-racks.blend':'fcca21ba4ebdaead2d3f847354a30749c4a680e3','scripts/author-tyre-trolleys-racks.py':'fda3160efa1af9134fd90ab36e87147f28951aad','src/rendering/tyre-trolleys-racks.manifest.json':'a0c213810a22ee060c1dd1f02d252e34e2743fc7','src/rendering/tyre-trolleys-racks.ts':'ecdb6f2d8995724a8d376dfcfb226d5d2b74e63d','tests/tyre-trolleys-racks.test.ts':'d6d7f54fe975b166a7475aec8bebbecf52b3a088'}
          base=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=90) as r: doc=json.load(r)
              raw=base64.b64decode(doc['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          for name,sha in files.items():
              p=Path(name);assert not p.exists(),'Concurrent A35 owner: '+name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob(sha))
          def change(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old)
              p.write_text(s.replace(old,new,1))
          before={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['src/rendering/renderer.ts','3dmodels.md']}
          for old,new in json.loads(blob('893229e3a9e40ff752a8748cc1f012d6364305ad'))['edits']:
              change('src/rendering/renderer.ts',old,new)
          f='e2e/fixtures/tyre-trolleys-racks.ts'
          change(f,"import { HeroGarage }", "import { TyreBlanketSet } from '../../src/rendering/tyre-blankets.ts';\nimport { shadowAnchor, lightingDirection } from '../../src/rendering/daylight.ts';\nimport { HeroGarage }")
          change(f,"  lighting: 'day' | 'sunset' | 'night',", "  lighting: 'day' | 'sunset' | 'night',\n  blanketsEncoded: string,")
          change(f,'  view.circuit.heroGarage = garage;', "  view.circuit.heroGarage = garage;\n  const blankets = new TyreBlanketSet((await loader.parseAsync(bytes(blanketsEncoded), '')).scene);\n  view.circuit.tyreBlankets = blankets;")
          change(f,'    view.venueLighting.update(',"    // Use the existing sun shadow anchor around the inspection subject.\n    shadowAnchor(point([0, 0, 0]), view.sun.shadow.mapSize.x, view.sun.shadow.camera.right, view.sun.target.position, lighting);\n    view.sun.position.copy(view.sun.target.position).add(lightingDirection(lighting));\n    view.sun.target.updateMatrixWorld();\n    view.venueLighting.update(")
          change(f,"      garage.update(view.camera, 'high', lighting);", "      garage.update(view.camera, 'high', lighting);\n      blankets.update(view.camera, 'high', lighting);\n      blankets.alignGarageWheels(garage.spareWheelStorage);")
          change(f,'      movingSurveyFrames: 8,', '      movingSurveyFrames: 8,\n      includesA34: blankets.root.parent !== null,')
          f='e2e/a35-tyre-trolleys-racks.spec.ts'
          change(f,'async ({ encoded, garage, lighting }) =>','async ({ encoded, garage, lighting, blankets }) =>')
          change(f,'.A35Survey.captureTyreEquipment(encoded, garage, lighting)', '.A35Survey.captureTyreEquipment(encoded, garage, lighting, blankets)')
          change(f,"        garage: readFileSync('public/models/aurel-hero-garage-bay.glb').toString('base64'),", "        garage: readFileSync('public/models/aurel-hero-garage-bay.glb').toString('base64'),\n        blankets: readFileSync('public/models/aurel-tyre-blankets-and-controllers.glb').toString('base64'),")
          change(f,'    expect(report.movingSurveyFrames).toBe(8);','    expect(report.movingSurveyFrames).toBe(8);\n    expect(report.includesA34).toBe(true);')
          change('3dmodels.md','\n\nAn integrated revision is not final approval', '\n| A35 | Mobile trolley and fixed rack; empty, partial and full loads, eight sockets, three LODs and three bay-05 placements. | Parked visual props only; live handling, final art, full-lap and hardware approval remain. See [A35 notes](docs/A35_TYRE_TROLLEYS_RACKS.md). |\n\nAn integrated revision is not final approval')
          p=Path('docs/A35_TYRE_TROLLEYS_RACKS.md')
          p.write_text(p.read_text()+'\n## Publication validation\n\nThe retained GLB and Blender source were authored and validated in run 36593534419 (1,342 unit tests and 16 A35/A33/A22/A24 browser cases). Subsequent reconciliation preserves the newer A31, A33 and A34 contributions. Final combined-garage surveys explicitly load A34 alongside A35 and use the existing sun-shadow anchor. Measured current-main results and acceptance limits are recorded in `docs/A35_VALIDATION.json`; actual circuit captures are retained in `docs/A35_GAMEPLAY_CONTACT_SHEET.jpg`. Studio renders, survey motion and normal startup are not a human-driven lap or representative-GPU FPS certification. Cross-host byte-identical regeneration is not claimed.\n')
          paths=sorted(set(files)|{'src/rendering/renderer.ts','3dmodels.md','docs/A35_VALIDATION.json','docs/A35_GAMEPLAY_CONTACT_SHEET.jpg'})
          Path('a35-final-base.json').write_text(json.dumps({'base':base,'baseTree':tree,'sharedBeforeSHA256':before,'paths':paths,'branchUpdated':False}))
          print('A35 retained export restored on',base)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only changed A35 fixtures
        run: npx prettier --write e2e/fixtures/tyre-trolleys-racks.ts e2e/a35-tyre-trolleys-racks.spec.ts
      - name: Full combined lint, unit and production build check
        run: set -o pipefail; npm run check 2>&1 | tee a35-final-check.log
      - name: Khronos GLB validation without changing repository dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/a35-validator" --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          node --input-type=commonjs - <<'JS'
          const fs=require('node:fs');
          const validator=require(process.env.RUNNER_TEMP+'/a35-validator/node_modules/gltf-validator');
          validator.validateBytes(new Uint8Array(fs.readFileSync('public/models/aurel-tyre-trolleys-racks.glb')),{uri:'aurel-tyre-trolleys-racks.glb',maxIssues:1000}).then(report=>{
            fs.writeFileSync('a35-gltf-validation.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.issues));
            if(report.issues.numErrors) process.exitCode=1;
          }).catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 python3-pil
      - name: A35 combined garage surveys and A34 regression on current main
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a35-tyre-trolleys-racks.spec.ts e2e/a34-tyre-blankets.spec.ts --reporter=line,json
      - name: Save evidence and upload only validated Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64,hashlib,io,json,os,re,tarfile,urllib.request
          from pathlib import Path
          from PIL import Image,ImageDraw
          base=json.loads(Path('a35-final-base.json').read_text())
          report=json.loads(Path('a35-final-browser.json').read_text());stats=report['stats']
          assert stats['expected']==8 and stats['unexpected']==stats['flaky']==stats['skipped']==0,stats
          shots={}
          def collect(x):
              if isinstance(x,dict):
                  if x.get('contentType')=='image/png' and x.get('name','').startswith('a35-') and x.get('body'):
                      shots[x['name']]=base64.b64decode(x['body'])
                  for v in x.values():collect(v)
              elif isinstance(x,list):
                  for v in x:collect(v)
          collect(report);assert len(shots)==9,shots.keys()
          sheet=Image.new('RGB',(1280,1215),(245,245,245));draw=ImageDraw.Draw(sheet)
          draw.text((16,16),'A35 | ACTUAL COMBINED GARAGE SURVEY | A34 included | final art approval remains open',fill=(15,15,15))
          for row,light in enumerate(['day','sunset','night']):
              for col,view in enumerate(['loaded-trolley','full-rack']):
                  image=Image.open(io.BytesIO(shots['a35-'+light+'-'+view+'.png'])).convert('RGB').resize((640,360),Image.Resampling.LANCZOS)
                  y=45+row*390;sheet.paste(image,(col*640,y));draw.text((col*640+12,y+367),light+' / '+view,fill=(15,15,15))
          sheet.save('docs/A35_GAMEPLAY_CONTACT_SHEET.jpg',quality=90)
          check=re.sub(r'\x1b\[[0-9;]*m','',Path('a35-final-check.log').read_text())
          tests=int(re.search(r'Tests\s+(\d+) passed',check).group(1))
          m=json.loads(Path('src/rendering/tyre-trolleys-racks.manifest.json').read_text())
          issues=json.loads(Path('a35-gltf-validation.json').read_text())['issues']
          v={'assetId':'A35','revision':m['revision'],'retainedAssetValidationRun':'36593534419','retainedAssetUnitTests':1342,'retainedAssetBrowserCases':16,'retainedAssetBrowserFailuresRetriesSkips':0,'concurrentIntegrationRun':os.environ['GITHUB_RUN_ID'],'concurrentIntegrationBase':base['base'],'concurrentFullCheck':'passed','concurrentUnitTests':tests,'concurrentBrowser':stats,'glbSHA256':m['sha256'],'blendSHA256':m['blendSHA256'],'gltfValidation':issues,'visualEvidence':'docs/A35_GAMEPLAY_CONTACT_SHEET.jpg','visualEvidenceIncludesA34':True,'crossHostExactGLBReproduction':False,'finalArtApproved':False,'drivenLapReview':False,'hardwareFPSCertified':False,'externalSiteRedeployed':False}
          Path('docs/A35_VALIDATION.json').write_text(json.dumps(v,indent=2)+'\n')
          with tarfile.open('a35-final-files.tar.gz','w:gz') as tar:
              for name in base['paths']:tar.add(name,arcname=name)
          base['files']={}
          for name in base['paths']:
              raw=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              base['files'][name]={'gitBlob':sha,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          Path('a35-final-receipt.json').write_text(json.dumps(base,indent=2)+'\n')
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          for name,info in base['files'].items():
              req=urllib.request.Request(api+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(Path(name).read_bytes()).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response:remote=json.load(response)
              assert remote['sha']==info['gitBlob'],name
              print('A35_BLOB',name,remote['sha'])
          base['blobsUploaded']=True
          Path('a35-final-receipt.json').write_text(json.dumps(base,indent=2)+'\n')
          print(json.dumps(base));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a35-final-publication
          retention-days: 7
          path: |
            a35-final-receipt.json
            a35-final-base.json
            a35-final-check.log
            a35-final-browser.json
            a35-final-files.tar.gz
            a35-gltf-validation.json
            docs/A35_VALIDATION.json
            docs/A35_GAMEPLAY_CONTACT_SHEET.jpg
            browser-backend.json
            test-results/
