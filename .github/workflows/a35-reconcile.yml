name: A35 final concurrent integration check
on:
  push:
    branches: [main]
    paths: [.github/workflows/a35-reconcile.yml]
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PLAYWRIGHT_JSON_OUTPUT_FILE: a35-reconcile-browser.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Recover exact validated assets and apply only A35 renderer hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          files={'.github/workflows/a35-authoring.yml':'9816b3550dbc4708e063b21645adea3d5c0e434c','docs/A35_TYRE_TROLLEYS_RACKS.md':'24cc08000e5b5ab2f55f61b18edf07609cb401ec','e2e/a35-tyre-trolleys-racks.spec.ts':'2e05e747194a2fc3db294ce599aeb2fe1f44c8f4','e2e/fixtures/tyre-trolleys-racks.ts':'23d925ba57022fad173994779b85d32d75a8e46f','public/models/aurel-tyre-trolleys-racks.glb':'94ca8313aacd36a9d91a4231f983a43b25e66f9b','scripts/aurel-tyre-trolleys-racks.blend':'fcca21ba4ebdaead2d3f847354a30749c4a680e3','scripts/author-tyre-trolleys-racks.py':'fda3160efa1af9134fd90ab36e87147f28951aad','src/rendering/tyre-trolleys-racks.manifest.json':'a0c213810a22ee060c1dd1f02d252e34e2743fc7','src/rendering/tyre-trolleys-racks.ts':'ecdb6f2d8995724a8d376dfcfb226d5d2b74e63d','tests/tyre-trolleys-racks.test.ts':'d6d7f54fe975b166a7475aec8bebbecf52b3a088'}
          base=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          for name,sha in files.items():
              p=Path(name);assert not p.exists(),'Concurrent A35 owner: '+name
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=90) as r: doc=json.load(r)
              raw=base64.b64decode(doc['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha,name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
          edits=[["import { loadPitWallStation } from './pit-wall-station.ts';","import {\n  loadTyreEquipment,\n  installTyreEquipment,\n  type TyreEquipmentKit,\n} from './tyre-trolleys-racks.ts';\nimport { loadPitWallStation } from './pit-wall-station.ts';"],["  private suppliedPlayerAsset: SuppliedPlayerAsset | null = null;","  private suppliedPlayerAsset: SuppliedPlayerAsset | null = null;\n  tyreEquipment: TyreEquipmentKit | null = null;"],["      renderer.circuit.pitWallStation = await loadPitWallStation(cancelled);","      renderer.circuit.pitWallStation = await loadPitWallStation(cancelled);\n      // A35 owns its instancing/LODs outside destructive static prop batching.\n      progress({ completed: 0, total: 1, fraction: 0, label: 'Loading Aurel tyre logistics' });\n      renderer.tyreEquipment = await loadTyreEquipment(cancelled);\n      installTyreEquipment(renderer.tyreEquipment, track);\n      renderer.circuit.group.add(renderer.tyreEquipment.root);"],["    this.circuit.heroGarage?.update(this.camera, this.quality, illumination);","    this.circuit.heroGarage?.update(this.camera, this.quality, illumination);\n    this.tyreEquipment?.update(this.camera, this.quality);"],["      environmentAssets: this.circuit.environmentDiagnostics(),","      environmentAssets: {\n        ...this.circuit.environmentDiagnostics(),\n        tyreEquipment: this.tyreEquipment?.diagnostics() ?? null,\n      },"],["    this.suppliedPlayerAsset?.dispose();","    this.suppliedPlayerAsset?.dispose();\n    this.tyreEquipment?.dispose();"]]
          p=Path('src/rendering/renderer.ts');text=p.read_text();before=hashlib.sha256(text.encode()).hexdigest()
          for old,new in edits:
              assert text.count(old)==1,'Concurrent hook changed: '+old
              text=text.replace(old,new,1)
          p.write_text(text)
          Path('a35-reconcile-base.json').write_text(json.dumps({'base':base,'baseTree':base_tree,'rendererBeforeSHA256':before,'files':files,'branchUpdated':False}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full combined lint, unit and production build check
        run: set -o pipefail; npm run check 2>&1 | tee a35-reconcile-check.log
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 python3-pil
      - name: Normal startup with all concurrently integrated equipment
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/a35-tyre-trolleys-racks.spec.ts --grep 'normal menu/practice' --reporter=line,json
      - name: Retain exact merge blob and durable prior visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64,hashlib,io,json,os,re,subprocess,urllib.request,zipfile
          from pathlib import Path
          from PIL import Image,ImageDraw
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          req=urllib.request.Request(api+'/actions/artifacts/11045453878/zip',headers=headers)
          with urllib.request.urlopen(req,timeout=90) as response: archive=zipfile.ZipFile(io.BytesIO(response.read()))
          # These nine actual-circuit images belong to the exact binary from run 36593534419.
          sheet=Image.new('RGB',(1280,1215),(245,245,245));draw=ImageDraw.Draw(sheet)
          draw.text((16,16),'A35 | ACTUAL CIRCUIT SURVEY | day / sunset / rainy night | run 36593534419',fill=(15,15,15))
          for row,light in enumerate(['day','sunset','night']):
              for col,view in enumerate(['loaded-trolley','full-rack']):
                  names=[n for n in archive.namelist() if n.endswith('/a35-'+light+'-'+view+'.png')]
                  assert len(names)==1,names
                  image=Image.open(io.BytesIO(archive.read(names[0]))).convert('RGB').resize((640,360),Image.Resampling.LANCZOS)
                  y=45+row*390;sheet.paste(image,(col*640,y));draw.text((col*640+12,y+367),light+' / '+view,fill=(15,15,15))
          sheet.save('docs/A35_GAMEPLAY_CONTACT_SHEET.jpg',quality=90)
          base=json.loads(Path('a35-reconcile-base.json').read_text())
          browser=json.loads(Path('a35-reconcile-browser.json').read_text())['stats']
          assert browser['expected']==1 and browser['unexpected']==browser['flaky']==browser['skipped']==0,browser
          log=re.sub(r'\x1b\[[0-9;]*m','',Path('a35-reconcile-check.log').read_text())
          tests=int(re.search(r'Tests\s+(\d+) passed',log).group(1))
          m=json.loads(Path('src/rendering/tyre-trolleys-racks.manifest.json').read_text())
          v={'assetId':'A35','revision':m['revision'],'retainedAssetValidationRun':'36593534419','retainedAssetUnitTests':1342,'retainedAssetBrowserCases':16,'retainedAssetBrowserFailuresRetriesSkips':0,'concurrentIntegrationRun':os.environ['GITHUB_RUN_ID'],'concurrentIntegrationBase':base['base'],'concurrentFullCheck':'passed','concurrentUnitTests':tests,'concurrentStartupBrowser':browser,'glbSHA256':m['sha256'],'blendSHA256':m['blendSHA256'],'visualEvidence':'docs/A35_GAMEPLAY_CONTACT_SHEET.jpg','visualEvidenceIncludesA34':False,'crossHostExactGLBReproduction':False,'finalArtApproved':False,'drivenLapReview':False,'hardwareFPSCertified':False,'externalSiteRedeployed':False}
          Path('docs/A35_VALIDATION.json').write_text(json.dumps(v,indent=2)+'\n')
          owned=['src/rendering/renderer.ts','docs/A35_VALIDATION.json','docs/A35_GAMEPLAY_CONTACT_SHEET.jpg']
          base['uploaded']={}
          for name in owned:
              raw=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              req=urllib.request.Request(api+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),method='POST',headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response: result=json.load(response)
              assert result['sha']==sha,name
              base['uploaded'][name]={'gitBlob':sha,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          Path('a35-reconcile-receipt.json').write_text(json.dumps(base,indent=2)+'\n')
          print(json.dumps(base));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a35-reconciled-publication
          retention-days: 7
          path: |
            a35-reconcile-receipt.json
            a35-reconcile-base.json
            a35-reconcile-check.log
            a35-reconcile-browser.json
            src/rendering/renderer.ts
            docs/A35_VALIDATION.json
            docs/A35_GAMEPLAY_CONTACT_SHEET.jpg
            browser-backend.json
            test-results/
