name: Verify bounded GPU frame submissions
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-gpu-frame-gate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 379a6add2686f9f0bea5dfa1bdba3c52effc2920
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact bounded-GPU candidate without advancing a branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '9d853fd29fe48f154f3c1bbcbec7a1972704662dde5964175477dc0950b7070b'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', 'src/main.ts', 'src/rendering/renderer.ts', 'src/rendering/gpu-frame-gate.ts', 'tests/gpu-frame-gate.test.ts'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'af58d91089ef990b2c7739b4a3722d167fff15c8', tree
          pathlib.Path('candidate-tree.txt').write_text(tree + '\n')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Retain locked dependencies for this repair session
        run: tar -czf "$RUNNER_TEMP/gpu-verification-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-verification-dependencies
          path: ${{ runner.temp }}/gpu-verification-dependencies.tar.gz
          retention-days: 1
      - name: Lint, all unit tests, TypeScript and exact production build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Unchanged driver acceptance twice with zero retries
        run: npm run test:e2e -- e2e/24-coupled-driver.spec.ts --repeat-each=2
      - name: Store the verified source tree only; do not advance a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          paths = ['src/main.ts', 'src/rendering/renderer.ts', 'src/rendering/gpu-frame-gate.ts', 'tests/gpu-frame-gate.test.ts']
          payload = {'base_tree':'c84e0b9d2facd5cd8c666387cd8d11c0edcacbc7', 'tree':[{'path':p, 'mode':'100644', 'type':'blob', 'content':pathlib.Path(p).read_text()} for p in paths]}
          result = json.loads(subprocess.check_output(['gh','api','repos/cheshmakzanoon-ops/Experiment-3/git/trees','--input','-'], input=json.dumps(payload), text=True))
          assert result['sha'] == 'af58d91089ef990b2c7739b4a3722d167fff15c8', result['sha']
          pathlib.Path('verified-tree.json').write_text(json.dumps({'tree':result['sha'],'base':'379a6add2686f9f0bea5dfa1bdba3c52effc2920','branchAdvanced':False},indent=2))
          PY
      - name: Retain verification evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-frame-gate-verification
          path: |
            candidate-tree.txt
            verified-tree.json
            test-results/
            playwright-report/
          retention-days: 7
