name: Validate and publish source update
on:
  push:
    branches: [main]
    paths: ['.github/source-update.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-source-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify readable patch parts and apply only allowed source paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          manifest = json.loads(pathlib.Path('.github/source-update.json').read_text())
          message = manifest.get('commit_message', 'feat: integrate verified simulator source')
          if not isinstance(message, str) or not 1 <= len(message) <= 200 or any(ord(c) < 32 for c in message):
              raise SystemExit('Invalid commit description')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-commit-message.txt').write_text(message + '\n')
          parts = manifest['parts']
          if not 1 <= len(parts) <= 8:
              raise SystemExit('Invalid source part count')
          patch = bytearray()
          for part in parts:
              name = part['path']
              if not re.fullmatch(r'\.github/source-update-[1-8]\.patch', name):
                  raise SystemExit('Unsafe patch path')
              data = pathlib.Path(name).read_bytes()
              if hashlib.sha256(data).hexdigest() != part['sha256']:
                  raise SystemExit('Patch integrity mismatch: ' + name)
              patch.extend(data)
          if len(patch) > 250000:
              raise SystemExit('Source update exceeds size limit')
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'source.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--recount',str(path)],check=True)
          subprocess.run(['git','apply','--index','--recount',str(path)],check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          roots = {'src','tests','e2e','scripts','docs','public'}
          allowed = {'README.md','package.json','package-lock.json','index.html','tsconfig.json','vite.config.ts','vitest.config.ts','playwright.config.ts','eslint.config.js','.gitignore','.prettierrc.json'}
          for name in filter(None,names):
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or (p.parts[0] not in roots and name not in allowed):
                  raise SystemExit('Disallowed source path: '+name)
          for root, expected in manifest['trees'].items():
              if root not in roots:
                  raise SystemExit('Disallowed source tree')
              actual = subprocess.check_output(['git','write-tree','--prefix='+root+'/']).decode().strip()
              if actual != expected:
                  raise SystemExit('Source tree differs from validated local files: '+root)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified source and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git rm -- .github/source-update.json .github/source-update-*.patch
          git add -- docs/scenario-results.json docs/pit-integration.json docs/rotation-benchmark.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F "$RUNNER_TEMP/source-commit-message.txt"
          git push origin HEAD:main
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve candidate source and validation evidence
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz "$(git write-tree)" > "$RUNNER_TEMP/source-candidate.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/base-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-update-validation
          path: |
            ${{ runner.temp }}/source-candidate.tar.gz
            ${{ runner.temp }}/base-commit.txt
            docs/scenario-results.json
            docs/pit-integration.json
            docs/rotation-benchmark.json
            test-results/
            playwright-report/
          retention-days: 7
