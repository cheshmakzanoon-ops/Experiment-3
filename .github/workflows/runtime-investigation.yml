name: Runtime exact candidate validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-investigation.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: runtime-exact-candidate
  cancel-in-progress: true
env:
  BASE_COMMIT: ca10afc209fc009ea41aaef36bbe466e2e3bf48a
  TARGET_TREE: 5a0f52336e1fa6f95d0a999c609b34bb037eca29
jobs:
  validate-and-publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct exact source correction with concurrent-change guard
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, hashlib, gzip, base64
          base=os.environ['BASE_COMMIT']
          stage='.github/workflows/runtime-investigation.yml'
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip()=='7a04f7b2ab3bbecb8296110efabf249bdfb8aa4e'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[stage], 'Concurrent source changes require reconciliation'
          encoded='?'
          PY
