name: Validate exact replay continuation
on:
  push:
    branches: [main]
    paths: [.github/workflows/verification-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TREE: a50ca942d8ca4b8fe060a60c08cecd280a6e835c
      SOURCE_DELTA: >-
        
        
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply checksum-guarded source changes and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '70e51c029e87a3bb906db24e1aabaaba8aa21b7a'
          python - <<'PYCODE'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(os.environ['SOURCE_DELTA']))
          assert hashlib.sha256(raw).hexdigest() == '444fe2aa6f38a66bc70ad355bb8c4c329b6f5b96809fa0e1523379856a57f90b'
          changes = json.loads(raw)
          allowed = {'README.md', 'docs/DEVELOPMENT_STATUS.md', 'docs/IMPLEMENTATION_MATRIX.md', 'docs/RECORDING_AND_REPLAY.md', 'e2e/replay-state.spec.ts', 'src/audio/engine.ts', 'src/input/controller.ts', 'src/main.ts', 'src/storage/replay-pages.ts', 'tests/bindings.test.ts', 'tests/recording.test.ts'}
          assert set(changes) == allowed
          for name, record in changes.items():
              path = pathlib.Path(name)
              original = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(original).hexdigest() if original is not None else None) == record['before'], name
              lines = original.decode('utf-8').splitlines(keepends=True) if original is not None else []
              for start, end, text in reversed(record['ops']):
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == record['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(changes)], check=True)
          PYCODE
          git rm .github/workflows/verification-toolchain.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Test replay ownership and recorded wet-track export
        run: npm run test:e2e -- e2e/replay-state.spec.ts e2e/application.spec.ts --grep 'recorded playback has exclusive|recorded telemetry exports'
      - name: Prepare verified Git tree without moving any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const expected = process.env.EXPECTED_TREE;
            const localTree = cp.execFileSync('git', ['write-tree'], {encoding:'utf8'}).trim();
            if (localTree !== expected) throw new Error('Index changed during validation');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
            const entries = paths.map(path => fs.existsSync(path)
              ? {path, mode:'100644', type:'blob', content:fs.readFileSync(path,'utf8')}
              : {path, mode:'100644', type:'blob', sha:null});
            const parent = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            const result = await github.rest.git.createTree({...context.repo, base_tree:parent.data.tree.sha, tree:entries});
            if (result.data.sha !== expected) throw new Error('Remote tree differs from tested tree');
            fs.writeFileSync('prepared-tree.json', JSON.stringify({parent:context.sha, tree:result.data.sha, base:'a2195f928e359f81ffb61664a7c4a9a48d52d228', unitTests:460, browserTests:2, branchMoved:false}, null, 2));
            await core.summary.addHeading('Exact continuation prepared, not yet published').addCodeBlock(JSON.stringify({parent:context.sha, tree:result.data.sha})).write();
      - name: Preserve validation and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-continuation-validation
          path: |
            prepared-tree.json
            test-results/
            playwright-report/
          retention-days: 7
