name: A21 frontage candidate validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/a21-retain.yml]
permissions:
  contents: read
concurrency:
  group: a21-frontage-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover hash-pinned candidate and preserve concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path, PurePosixPath
          shas=['453da029daf97cdd2490d45aa4ef048487f23bce','3daa12efe90f0acb51828eca7dbc7e72a42afa06','0a9798e580d9dda74f9b9a8e2a3dee7fd2793a26','5138199e3ecf5c70fff2b4db2294c5985c6a4433','1b2ee65947fa04b16979a55086f878ea64290209']
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          parts=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: value=json.load(response)
              part=base64.b64decode(value['content'])
              assert blob_sha(part)==sha
              parts.append(part)
          packed=b''.join(parts)
          assert len(packed)==25625
          assert hashlib.sha256(packed).hexdigest()=='b564ac99101369bd67c868a3879949744e7751c7d6b6df3d622062b2cc0017cb'
          packed_path=Path(os.environ['RUNNER_TEMP'])/'a21.br'
          packed_path.write_bytes(packed)
          raw=subprocess.check_output(['node','-e','process.stdout.write(require("node:zlib").brotliDecompressSync(require("node:fs").readFileSync(process.argv[1])))',str(packed_path)])
          data=json.loads(raw)
          assert data['version']==1 and data['baseCommit']=='5dff567a03dd478e418c3fee2fff4317148ba422'
          allowed={'3dmodels.md','docs/ASSET_PROVENANCE.md','src/rendering/circuit.ts','src/rendering/renderer.ts','tests/race-view-continuity.test.ts'}
          assert set(data['modified'])==allowed
          assert set(data['baseSHA256'])==allowed
          data['preMergeBlobSHA']={name:blob_sha(Path(name).read_bytes()) for name in data['modified']}
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',data['baseCommit']],check=True)
          for name,sha in data['baseSHA256'].items():
              baseline=subprocess.check_output(['git','show',data['baseCommit']+':'+name])
              assert hashlib.sha256(baseline).hexdigest()==sha
          patch=Path(os.environ['RUNNER_TEMP'])/'a21.patch'
          patch.write_text(data['patch'])
          subprocess.run(['git','apply','--3way',str(patch)],check=True)
          for name,text in data['files'].items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not Path(name).exists(), 'A21 path already exists: '+name
              Path(name).parent.mkdir(parents=True,exist_ok=True)
              Path(name).write_text(text,encoding='utf-8')
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==data['expectedSHA256'][name]
          # The first hosted artifact was inspected against local geometry before
          # choosing these bytes. Keep runtime integrity exact; do not accept an
          # arbitrary newly generated hash or silently declare reproduction.
          target='e9f4710bd48b8e6d3d1aa4a09e5341ec0a568d56e0e08169333da77033723f6f'
          name='src/rendering/pit-building-frontage.manifest.json'
          manifest=json.loads(Path(name).read_text())
          assert manifest['sha256']=='9e972f3fb4f74566d865cb14c9a4d7b76f6e28d28cf69fd216a0b557d0d6553b'
          manifest['sha256']=target
          Path(name).write_text(json.dumps(manifest,indent=2)+'\n')
          data['glbSHA256']=target
          data['files'][name]=Path(name).read_text()
          data['expectedSHA256'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          name='docs/A21_HERO_PIT_BUILDING.md'
          note='### Export identity\n\nThe selected hosted export is SHA-256 `'+target+'`. The local export `9e972f3fb4f74566d865cb14c9a4d7b76f6e28d28cf69fd216a0b557d0d6553b` differs in 201 bytes. Inspection found identical GLB JSON, index topology, textures, bounds, sockets and counts; changed floating-point accessors have maximum position difference 4.77e-7 m, normal-component difference about 1.001e-4 and UV difference 9.54e-7. The failed cross-host byte comparison was retained in run 36590458254, not called a pass. Universal cross-host byte reproducibility and pixel equivalence are not claimed. The selected hosted bytes undergo full tests and exact runtime integrity checks; future regenerated exports remain review candidates.\n\n'
          text=Path(name).read_text()
          assert text.count('## Concurrent publication')==1
          text=text.replace('## Concurrent publication',note+'## Concurrent publication')
          Path(name).write_text(text)
          data['files'][name]=text
          data['expectedSHA256'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).strip()
          Path('a21-candidate.json').write_text(json.dumps(data,indent=2)+'\n')
          print('A21 source verified; shared-file edits merged without discarding concurrent changes')
          PY
      - name: Install checksum-pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Author editable Blender source and four-chunk runtime geometry
        run: '"$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --background --factory-startup --python scripts/author-pit-building-frontage.py'
      - name: Require the exact inspected hosted export
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('a21-candidate.json').read_text())
          for name in data['files']:
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==data['expectedSHA256'][name], name
          glb=Path('public/models/aurel-hero-pit-building-frontage.glb').read_bytes()
          assert hashlib.sha256(glb).hexdigest()==data['glbSHA256']
          print('Exact A21 runtime export:',data['glbSHA256'])
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: Normal startup, four A21 lighting surveys, and A22/A24 regressions
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/45-a21-pit-building-frontage.spec.ts e2e/43-hero-garage.spec.ts e2e/44-pit-wall-station.spec.ts
      - name: Retain verified Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,tarfile,urllib.request
          from pathlib import Path
          candidate=json.loads(Path('a21-candidate.json').read_text())
          names=sorted(set(candidate['expectedSHA256'])|{'scripts/aurel-hero-pit-building-frontage.blend','public/models/aurel-hero-pit-building-frontage.glb'})
          report={'source':os.environ['GITHUB_SHA'],'baseCommit':candidate['baseCommit'],'preMergeBlobSHA':candidate['preMergeBlobSHA'],'files':{},'branchUpdated':False}
          for name in names:
              data=Path(name).read_bytes()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response: result=json.load(response)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha']==sha
              report['files'][name]={'blob':sha,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          Path('a21-retained-blobs.json').write_text(json.dumps(report,indent=2)+'\n')
          with tarfile.open('a21-validated-source.tar.gz','w:gz') as archive:
              for name in names: archive.add(name,arcname=name)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a21-candidate-evidence
          path: |
            a21-retained-blobs.json
            a21-validated-source.tar.gz
            a21-candidate.json
            scripts/aurel-hero-pit-building-frontage.blend
            public/models/aurel-hero-pit-building-frontage.glb
            src/rendering/pit-building-frontage.manifest.json
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error
