name: A21 frontage final integration
on:
  push:
    branches: [main]
    paths: [.github/workflows/a21-retain.yml]
permissions:
  contents: write
concurrency:
  group: a21-frontage-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare idempotent A21 reconciliation script
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/apply-a21.py" <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path, PurePosixPath

          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          FILES = {
              '.github/workflows/pit-building-authoring.yml': '4921dae5756c9251fde08c9ce9c9218e1a3ebe92',
              'docs/A21_HERO_PIT_BUILDING.md': '87d60f282999ea193ef46ffa793176a6e45d6c29',
              'e2e/45-a21-pit-building-frontage.spec.ts': 'a10155db62cec03ad833c22ecb9f73ee76f3f509',
              'e2e/fixtures/pit-building-frontage.ts': '634da96aabe0c0280f8c068b862fae856b7a63a9',
              'public/models/aurel-hero-pit-building-frontage.glb': '0640e3b5086ee2c54d0abbe1ce8feef4e5726cc9',
              'scripts/aurel-hero-pit-building-frontage.blend': 'a2bc7be56340150343b7b880e695d36d03af193d',
              'scripts/author-pit-building-frontage.py': 'f3f68b4b40139d0384e1dd18c24c91cb334ba838',
              'src/rendering/pit-building-frontage.manifest.json': 'f4852aff6561ebd3a006bc1f89bd9eb00dc8e959',
              'src/rendering/pit-building-frontage.ts': 'd62e3516f7657c7e4b3849361cb56849f63a5686',
              'src/rendering/pit-building-layout.ts': 'a06f8ec284185c3bef0775dd1bbe5d0d85f75037',
              'tests/pit-building-frontage.test.ts': 'a3199a089865bc05f8377f7c7546989d10b6cf9b',
          }

          def gitsha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def fetch_blob(sha: str) -> bytes:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  value = json.load(response)
              data = base64.b64decode(value['content'])
              assert gitsha(data) == sha
              return data

          def install_exact(name: str, sha: str) -> None:
              posix = PurePosixPath(name)
              assert not posix.is_absolute() and '..' not in posix.parts and '.git' not in posix.parts
              target = Path(name)
              data = fetch_blob(sha)
              if target.exists():
                  actual = gitsha(target.read_bytes())
                  if actual == sha:
                      return
                  raise RuntimeError(f'A21-owned path already exists with different content: {name} ({actual})')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          for name, sha in FILES.items():
              install_exact(name, sha)

          path = Path('3dmodels.md')
          text = path.read_text()
          if '| A21 |' not in text:
              marker = '| A22 |'
              assert text.count(marker) == 1
              row = '| A21 | Four architectural frontage sections across all twelve existing bays, three LODs per section, 43 placement sockets and retained Blender/GLB source. | Final art, driven-lap and hardware approval remain open; other agents’ equipment and the cockpit repair remain separate. See [A21 notes](docs/A21_HERO_PIT_BUILDING.md). |\n'
              text = text.replace(marker, row + marker, 1)
              path.write_text(text)

          path = Path('docs/ASSET_PROVENANCE.md')
          text = path.read_text()
          if '## A21 original pit-building frontage' not in text:
              text = text.rstrip() + '''\n\n## A21 original pit-building frontage\n\n`author-pit-building-frontage.py` authors the original structural frontage, gallery,\ncanopy sections, exterior stair-core shells and original packed micro-surface maps.\nThe retained Blender source and GLB contain no imported scans, photographs, stock\ngeometry, commercial-game meshes, team logos or external font files. Built-in text\nis converted to mesh. Forty-three sockets are placement metadata only. Existing\nA22, A24, car, cockpit and driver payloads are unchanged. See [A21 scope, integration\nand validation boundaries](A21_HERO_PIT_BUILDING.md).\n'''
              path.write_text(text)

          path = Path('src/rendering/circuit.ts')
          text = path.read_text()
          if "import { type PitBuildingFrontage } from './pit-building-frontage.ts';" not in text:
              text = "import { type PitBuildingFrontage } from './pit-building-frontage.ts';\n" + text
          if '  pitBuildingFrontage: PitBuildingFrontage | null = null;' not in text:
              marker = '  tyreBlankets: TyreBlanketSet | null = null;\n'
              assert text.count(marker) == 1
              text = text.replace(marker, marker + '  pitBuildingFrontage: PitBuildingFrontage | null = null;\n', 1)
          if 'this.pitBuildingFrontage?.root' not in text:
              old = '''          [this.heroGarage?.root, this.tyreBlankets?.root, this.pitWallStation?.root].filter(\n            (o): o is T.Group => !!o,\n          ),'''
              new = '''          [\n            this.heroGarage?.root,\n            this.tyreBlankets?.root,\n            this.pitWallStation?.root,\n            this.pitBuildingFrontage?.root,\n          ].filter((o): o is T.Group => !!o),'''
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          if 'frontage: this.pitBuildingFrontage?.diagnostics() ?? null,' not in text:
              marker = '      pitWall: this.pitWallStation?.diagnostics() ?? null,\n'
              assert text.count(marker) == 1
              text = text.replace(marker, marker + '      frontage: this.pitBuildingFrontage?.diagnostics() ?? null,\n', 1)
          if "this.construction.add('A21 hero pit-building frontage'" not in text:
              marker = "    this.construction.add('A24 pit-wall command station', 2, () => {\n"
              assert text.count(marker) == 1
              block = '''    this.construction.add('A21 hero pit-building frontage', 2, () => {\n      if (!this.pitBuildingFrontage) return;\n      this.props.add(this.pitBuildingFrontage.root);\n      this.pitBuildingFrontage.place(this.track, this.sightlines);\n    });\n'''
              text = text.replace(marker, block + marker, 1)
          path.write_text(text)

          path = Path('src/rendering/renderer.ts')
          text = path.read_text()
          if "import { loadPitBuildingFrontage } from './pit-building-frontage.ts';" not in text:
              marker = "import { measureWheelGunFits } from './wheel-gun-contact.ts';\n"
              assert text.count(marker) == 1
              text = text.replace(marker, marker + "import { loadPitBuildingFrontage } from './pit-building-frontage.ts';\n", 1)
          if 'renderer.circuit.pitBuildingFrontage = await loadPitBuildingFrontage(cancelled);' not in text:
              marker = '''      renderer.wheelGunStorage = new WheelGunStorage(\n        renderer.pitCrew.wheelGuns!.prototype,\n        renderer.circuit.heroGarage.root,\n      );\n'''
              assert text.count(marker) == 1
              block = '''      progress({\n        completed: 0,\n        total: 1,\n        fraction: 0,\n        label: 'Loading Aurel pit-building frontage',\n      });\n      renderer.circuit.pitBuildingFrontage = await loadPitBuildingFrontage(cancelled);\n'''
              text = text.replace(marker, marker + block, 1)
          if 'this.circuit.pitBuildingFrontage?.update(this.camera, this.quality, illumination);' not in text:
              marker = '    this.circuit.pitWallStation?.update(\n'
              assert text.count(marker) == 1
              text = text.replace(marker, '    this.circuit.pitBuildingFrontage?.update(this.camera, this.quality, illumination);\n' + marker, 1)
          if 'this.circuit.pitBuildingFrontage.dispose();' not in text:
              marker = '''    if (this.circuit.pitWallStation && !this.circuit.pitWallStation.root.parent)\n      this.circuit.pitWallStation.dispose();\n'''
              assert text.count(marker) == 1
              addition = '''    if (this.circuit.pitBuildingFrontage && !this.circuit.pitBuildingFrontage.root.parent)\n      this.circuit.pitBuildingFrontage.dispose();\n'''
              text = text.replace(marker, marker + addition, 1)
          path.write_text(text)

          path = Path('tests/race-view-continuity.test.ts')
          text = path.read_text()
          if 'const frontageUpdate = vi.fn' not in text:
              marker = '''      const stationUpdate = vi.fn((currentCamera: T.PerspectiveCamera) => {\n        expect(currentCamera).toBe(camera);\n        expect(currentCamera.position.toArray()).toEqual([60, 0.4, 0.2]);\n      });\n'''
              assert text.count(marker) == 1
              block = '''      const frontageUpdate = vi.fn((currentCamera: T.PerspectiveCamera) => {\n        expect(currentCamera).toBe(camera);\n        expect(currentCamera.position.toArray()).toEqual([60, 0.4, 0.2]);\n        expect(currentCamera.projectionMatrix.elements).toEqual(\n          new T.PerspectiveCamera(\n            currentCamera.fov,\n            currentCamera.aspect,\n            currentCamera.near,\n            currentCamera.far,\n          ).projectionMatrix.elements,\n        );\n      });\n'''
              text = text.replace(marker, marker + block, 1)
          if 'pitBuildingFrontage: { update: frontageUpdate },' not in text:
              marker = '          pitWallStation: { update: stationUpdate },\n'
              assert text.count(marker) == 1
              text = text.replace(marker, marker + '          pitBuildingFrontage: { update: frontageUpdate },\n', 1)
          if "expect(frontageUpdate).toHaveBeenCalledExactlyOnceWith(camera, 'high', 'day');" not in text:
              marker = "      expect(garageUpdate).toHaveBeenCalledExactlyOnceWith(camera, 'high', 'day');\n"
              assert text.count(marker) == 1
              block = "      expect(frontageUpdate).toHaveBeenCalledExactlyOnceWith(camera, 'high', 'day');\n      expect(frontageUpdate.mock.invocationCallOrder[0]).toBeLessThan(\n        stationUpdate.mock.invocationCallOrder[0],\n      );\n"
              text = text.replace(marker, marker + block, 1)
          path.write_text(text)

          manifest = json.loads(Path('src/rendering/pit-building-frontage.manifest.json').read_text())
          glb = Path('public/models/aurel-hero-pit-building-frontage.glb').read_bytes()
          assert len(glb) == manifest['bytes']
          assert hashlib.sha256(glb).hexdigest() == manifest['sha256']
          assert manifest['assetId'] == 'A21'
          print('A21 reconciled against', os.environ.get('GITHUB_SHA'), 'with GLB', manifest['sha256'])
          PY
          python "$RUNNER_TEMP/apply-a21.py"
      - name: Full lint, unit and production-build gate
        shell: bash
        run: set -o pipefail; npm ci --no-audit --no-fund && npm run check 2>&1 | tee a21-final-check.log
      - name: Install Chromium and software WebGL dependencies
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: A21, A22, A24 and A35 browser regression set
        shell: bash
        run: set -o pipefail; xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e -- e2e/45-a21-pit-building-frontage.spec.ts e2e/43-hero-garage.spec.ts e2e/44-pit-wall-station.spec.ts e2e/a35-tyre-trolleys-racks.spec.ts 2>&1 | tee a21-final-browser.log
      - name: Commit and fast-forward main, reconciling one concurrent advance if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cheshmakzanoon-ops
          git config user.email cheshmakzanoon@gmail.com
          make_commit() {
            rm -f .github/workflows/a21-retain.yml
            git add -A
            git commit -m "feat(a21): integrate hero pit-building frontage" -m "Add four independently placed frontage sections across all twelve garages, three LODs per section, 43 future-asset sockets, retained Blender source, integrity-pinned GLB, broadcast occluders, loader lifecycle, focused browser coverage and provenance. Preserve A22/A24/A31/A33/A34/A35 and A26-era concurrent work; no pit physics, simulation, car, cockpit or driver changes. Final art, hardware profiling and cockpit-camera repair remain open."
          }
          make_commit
          if ! git push origin HEAD:main; then
            echo 'Main advanced during validation; reconciling A21 once against the new head.'
            git fetch origin main
            git reset --hard origin/main
            python "$RUNNER_TEMP/apply-a21.py"
            npm test -- tests/pit-building-frontage.test.ts tests/hero-garage.test.ts tests/pit-wall-station.test.ts tests/race-view-continuity.test.ts
            npm run build
            make_commit
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a21-final-integration-evidence
          path: |
            a21-final-check.log
            a21-final-browser.log
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
