name: Cockpit budget and continuity validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/cockpit-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore reviewed candidate and apply verified batching repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 3a1bffbd7003d2f2345a2b57cfa71919b6e8853b
          git restore --source=3a1bffbd7003d2f2345a2b57cfa71919b6e8853b --worktree --staged README.md docs src tests e2e
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3'
          parts=['75e6f89e0caf545b7d07664b294fc7a420b3781a','bf8a1fdeb4fa08c6acac4cd64d36d161c4e88cba','46d79c76f0f4e48e318a4bf944a692f8b2ba5159']
          chunks=[]
          for sha in parts:
              request=urllib.request.Request(root+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
              chunk=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              chunks.append(chunk)
          patch=gzip.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest()=='6324eacab806976d2acc42d94eecc39b95f1d05c45ede5b6af1d47e5eed009af'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'cockpit-repair.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          subprocess.run(['git','add','README.md','docs','src','tests','e2e'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/04-reference-visual.spec.ts e2e/05-cockpit-detail.spec.ts e2e/pit-presentation.spec.ts
      - name: Preserve tested source objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3'
          def api(path,data=None):
              request=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA'];base=api('/git/commits/'+parent)['tree']['sha']
          files=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          expected=['README.md','docs/ASSET_PROVENANCE.md','docs/COCKPIT_REFERENCE_CONTINUATION.md','docs/IMPLEMENTATION_MATRIX.md','docs/REFERENCE_VISUAL_REVIEW.md','e2e/05-cockpit-detail.spec.ts','e2e/fixtures/cockpit-detail.ts','src/rendering/car.ts','src/rendering/cockpit.ts','src/rendering/driver-materials.ts','src/rendering/driver.ts','src/rendering/mirrors.ts','src/rendering/reflections.ts','src/rendering/renderer.ts','src/rendering/texture-budget.ts','tests/cockpit-detail.test.ts','tests/mirrors.test.ts','tests/reflections.test.ts']
          assert sorted(files)==sorted(expected)
          entries=[];hashes={}
          for path in files:
              content=pathlib.Path(path).read_bytes();hashes[path]=hashlib.sha256(content).hexdigest()
              blob=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert blob['sha']==hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'feat: validated batched cockpit and replay reflection continuity candidate\n\n527 unit cases and four focused Chromium cases including the unchanged pit draw budget. No full-spec or photorealism claim.','tree':tree,'parents':[parent]})['sha']
          result={'candidate':commit,'tree':tree,'parent':parent,'files':hashes,'unit_tests':527,'focused_browser_cases':4,'full_browser_cases':29,'visual_parity':'NOT achieved'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'cockpit-candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cockpit-budget-validation
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/cockpit-candidate.json
          retention-days: 7
