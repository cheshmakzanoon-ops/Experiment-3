name: Continuation validation environment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/continuation-environment.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package exact locked dependencies
        run: |
          sha256sum package-lock.json > "$RUNNER_TEMP/lock.sha256"
          tar -czf "$RUNNER_TEMP/apex-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-dependencies
          path: |
            ${{ runner.temp }}/apex-dependencies.tar.gz
            ${{ runner.temp }}/lock.sha256
          retention-days: 1
