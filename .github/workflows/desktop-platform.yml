name: Build and check one desktop platform
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      linux_graphics:
        required: false
        type: string
        default: mesa
      smoke_journey:
        required: false
        type: string
        default: full
      gpu_trace:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # Includes four additional full-content installed-game journeys. Individual
    # startup/input/capture budgets remain explicit in the smoke helper.
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      # Capture stderr even when Electron exits before the automation connection.
      # Logging only: no sandbox, driver, quality or timeout changes.
      DEBUG: pw:browser
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MOTOBOUND_TARGET_ARCH: ${{ inputs.arch }}
      MOTOBOUND_SMOKE_JOURNEY: ${{ inputs.smoke_journey }}
      MOTOBOUND_GPU_TRACE: ${{ inputs.gpu_trace && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate desktop isolation and engine contracts
        run: npm test -- tests/preview-promotion.test.ts tests/startup.test.ts tests/preparation.test.ts tests/preparation-passes.test.ts tests/program-readiness.test.ts tests/program-first-use.test.ts tests/fullscreen-preparation.test.ts tests/owned-menu-preview.test.ts tests/menu-timing-mode.test.ts tests/menu-dof-diagnostic.test.ts tests/native-preparation-evidence.test.ts tests/native-smoke-control.test.ts tests/native-gpu-trace.test.ts tests/native-gpu-trace-workflow.test.ts tests/automatic-shift-stability.test.ts tests/vehicle-calibration-ci.test.ts tests/supplied-compaction.test.ts tests/supplied-index-preparation.test.ts tests/mirrors.test.ts tests/calibration-provenance.test.ts tests/ci-workflow.test.ts tests/far-shadow.test.ts tests/festival-presentation-gate.test.ts tests/festival-startup-lifetime.test.ts tests/festival-startup-presentation.test.ts tests/festival-held-ready.test.ts tests/festival-travel-readiness.test.ts tests/festival-late-assets.test.ts tests/abortable-startup.test.ts tests/graphics-observation.test.ts tests/desktop-policy.test.ts tests/desktop-graphics-health.test.ts tests/desktop-target.test.ts tests/repository-portability.test.ts tests/motocross-ground-physics.test.ts tests/motocross-contact-impulse.test.ts tests/babylon-*.test.ts tests/input.test.ts tests/motion-receipt.test.ts tests/worker-pause.test.ts tests/open-world-traffic.test.ts tests/basis-transcoder.test.ts
      - name: Build the bundled offline desktop game
        run: npm run desktop:package -- --${{ inputs.target }} --${{ inputs.arch }} --publish never
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y libgl1-mesa-dri mesa-utils
      - name: Launch the packaged Linux executable
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOTOBOUND_CI_GL: ${{ inputs.linux_graphics }}
        run: xvfb-run -a node scripts/desktop-smoke.mjs
      - name: Launch the packaged Windows or macOS application
        if: runner.os != 'Linux'
        env:
          MOTOBOUND_CI_GL: ${{ inputs.target == 'mac' && inputs.arch == 'x64' && 'swiftshader' || '' }}
        run: node scripts/desktop-smoke.mjs
      - name: Validate retained GPU trace evidence (diagnostic only)
        if: always() && inputs.gpu_trace
        run: node scripts/native-gpu-trace.mjs --validate desktop-evidence/report.json
      - name: Record package checksums and exact source
        if: inputs.smoke_journey == 'full' && !inputs.gpu_trace
        run: node scripts/desktop-checksums.mjs
      - name: Preserve native launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ inputs.target }}-${{ inputs.arch }}${{ inputs.smoke_journey != 'full' && '-compatibility-diagnostic' || '' }}${{ inputs.gpu_trace && '-gpu-trace' || '' }}
          path: desktop-evidence/
          retention-days: 7
      - name: Upload development installers
        if: inputs.smoke_journey == 'full' && !inputs.gpu_trace
        uses: actions/upload-artifact@v4
        with:
          name: motobound-package-${{ inputs.target }}-${{ inputs.arch }}
          path: |
            desktop-out/*.exe
            desktop-out/*.dmg
            desktop-out/*.AppImage
            desktop-out/*.tar.gz
            desktop-out/*.zip
            desktop-out/SHA256SUMS-*.txt
            desktop-out/source-*.json
          if-no-files-found: error
          retention-days: 7
