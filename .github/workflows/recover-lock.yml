name: Recover exact validated dependency lock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-lock.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download this repository's original validation artifact
        uses: actions/download-artifact@v4
        with:
          name: validation-toolchain
          run-id: 35193563344
          github-token: ${{ github.token }}
          repository: cheshmakzanoon-ops/Experiment-3
          path: recovered
      - name: Verify and store the exact lock as a Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, tarfile, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'cheshmakzanoon-ops/Experiment-3'
          with tarfile.open('recovered/validation-toolchain.tgz', 'r:gz') as archive:
              data = archive.extractfile('package-lock.json').read()
          assert hashlib.sha256(data).hexdigest() == '0ee732475bc70f3bec4bfa7787f904d51bc28c185534dff3762f2d18801bbc59', 'Lock checksum mismatch'
          expected = 'efb97c7f7cdf9984237a6d23c786df5ed0e51f9f'
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
          request = urllib.request.Request(
              'https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3/git/blobs',
              data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
              method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected, 'Stored Git blob checksum mismatch'
          print('Verified dependency lock stored:', result['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Exact archive lock recovered and verified: `' + expected + '`. No branch or source files were modified by this job.\n')
          PY
