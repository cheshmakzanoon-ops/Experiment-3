name: Verified asset authoring toolchain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/asset-authoring-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain lockfile-bound offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Dependency transport only. This is NOT the application validation job.
          # Lifecycle scripts run normally in CI and in the restored workspace.
          npm ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"
          npm cache verify --cache "$RUNNER_TEMP/npm-cache"
          mkdir -p "$RUNNER_TEMP/development-toolchain"
          tar -czf "$RUNNER_TEMP/development-toolchain/npm-cache.tar.gz" -C "$RUNNER_TEMP" npm-cache
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/development-toolchain/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/development-toolchain/commit.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/development-toolchain/source-commit.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/development-toolchain/package-lock.sha256"
          node --version > "$RUNNER_TEMP/development-toolchain/node-version.txt"
          npm --version > "$RUNNER_TEMP/development-toolchain/npm-version.txt"
          cd "$RUNNER_TEMP/development-toolchain"
          sha256sum npm-cache.tar.gz source.tar.gz commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: apex-offline-development-toolchain
          path: ${{ runner.temp }}/development-toolchain/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Download and verify pinned official Blender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' -o "$RUNNER_TEMP/blender-5.2.2-linux-x64.tar.xz"
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  '"$RUNNER_TEMP/blender-5.2.2-linux-x64.tar.xz" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.2-verified-development-toolchain
          path: ${{ runner.temp }}/blender-5.2.2-linux-x64.tar.xz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
