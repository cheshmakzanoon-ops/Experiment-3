name: Compare current Linux Mesa environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-linux-current-mesa.yml'
      - '.github/workflows/desktop-platform.yml'
      - 'src/engine/babylon/**'
      - 'src/rendering/**'
      - 'desktop/target.ts'
      - 'scripts/desktop-smoke.mjs'
      - 'scripts/desktop-compatibility.mjs'
permissions:
  contents: read
concurrency:
  group: linux-current-mesa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    # Same packaged workload and deadlines on a newer OS/Mesa stack. This is
    # diagnostic, cannot publish, and does not replace required Ubuntu 22 Mesa.
    # OS, system libraries and driver differ together: success alone would not
    # isolate a single driver defect or qualify representative physical hardware.
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ubuntu-24.04
      target: linux
      arch: x64
      linux_graphics: mesa
