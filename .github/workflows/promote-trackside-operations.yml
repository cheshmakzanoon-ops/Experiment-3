name: Promote sealed A08-A10 source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-trackside-operations.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: promote-sealed-a08-a10
  cancel-in-progress: true
jobs:
  promote:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operations-source
          path: ${{ runner.temp }}/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37163800021
      - name: Verify sealed source, create exact commit and advance main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          EXPECTED_STAGING = 'bba877f8b111835171dcf7e1c511c7b1380421c0'
          EXPECTED_TREE = '207f104a3399afac9838ec0234a23bdba2a78d07'
          PROMOTER = '.github/workflows/promote-trackside-operations.yml'
          temp = Path(os.environ['RUNNER_TEMP'])
          source = temp / 'source'
          work = temp / 'promoted-source'
          work.mkdir(parents=True, exist_ok=True)

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def api(route, body=None, method=None):
              if method is None:
                  method = 'GET' if body is None else 'POST'
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + route,
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.load(response)

          receipt_path = source / 'operations-source.json'
          archive_path = source / 'operations-source.tar.gz'
          receipt = json.loads(receipt_path.read_text())
          assert receipt['stagingCommit'] == EXPECTED_STAGING
          assert receipt['tree'] == EXPECTED_TREE
          assert digest(archive_path) == receipt['archiveSHA256']
          assert len(receipt['files']) == 40

          with tarfile.open(archive_path, 'r:gz') as archive:
              members = {member.name: member for member in archive.getmembers()}
              for name, expected in receipt['files'].items():
                  relative = PurePosixPath(name)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  member = members[name]
                  assert member.isfile() and not member.issym() and not member.islnk()
                  target = work / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  handle = archive.extractfile(member)
                  assert handle is not None
                  target.write_bytes(handle.read())
                  assert digest(target) == expected, name

          current = api('/git/ref/heads/main')['object']['sha']
          assert current == os.environ['GITHUB_SHA'], 'main advanced; refuse to overwrite'
          parent = api('/git/commits/' + current)
          cursor = current
          depth = 0
          while cursor != EXPECTED_STAGING:
              ancestry = api('/git/commits/' + cursor)
              assert len(ancestry['parents']) == 1
              cursor = ancestry['parents'][0]['sha']
              depth += 1
              assert depth <= 5, 'unexpected promotion ancestry'

          entries = []
          for name, expected in receipt['files'].items():
              path = work / name
              assert digest(path) == expected
              blob = api('/git/blobs', {
                  'content': base64.b64encode(path.read_bytes()).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          removed = list(receipt['removedTransport']) + [PROMOTER]
          assert len(removed) == len(set(removed))
          entries.extend({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None} for name in removed)

          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          assert tree['sha'] == EXPECTED_TREE, (tree['sha'], EXPECTED_TREE)
          commit = api('/git/commits', {
              'message': 'feat(venue): integrate A08-A10 trackside operations and local displays\n\nAdd three original Blender families, 18 approach boards plus two sector markers, passive split housings and 20 broadcast-camera installations. Preserve current cars, people, physics, collision geometry and replay optics. Bind retained LED meshes to recorded local marshal witnesses with bounded palette ownership. Include editable sources, provenance, deterministic placement, LODs and geometry/render tests. Final art, representative hardware approval, mechanical camera tracking and Vellamar propagation remain separate.',
              'tree': tree['sha'],
              'parents': [current],
          })
          api('/git/refs/heads/main', {'sha': commit['sha'], 'force': False}, method='PATCH')
          assert api('/git/ref/heads/main')['object']['sha'] == commit['sha']

          publication = {
              **receipt,
              'promoterCommit': current,
              'candidateCommit': commit['sha'],
              'branchAdvanced': True,
              'removedTransport': removed,
          }
          (temp / 'operations-publication.json').write_text(json.dumps(publication, indent=2) + '\n')
          print('Advanced main to exact sealed tree:', commit['sha'])
      - uses: actions/upload-artifact@v4
        with:
          name: operations-final-publication
          path: ${{ runner.temp }}/operations-publication.json
          retention-days: 7
          if-no-files-found: error
