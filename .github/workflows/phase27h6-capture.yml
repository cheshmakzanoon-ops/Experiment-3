name: Reconciled 27H.6 capture validation
on:
  push:
    branches: [main]
    paths: ['.github/phase27h6-capture.b64', '.github/workflows/phase27h6-capture.yml']
permissions:
  contents: read
concurrency:
  group: phase27h6-capture-workloads
  cancel-in-progress: false
env:
  BASE: a0c9211a2a673bbe9811787c5e0fa8108bd9b509
  BASE_TREE: 6bbf79ca9129be100fbb1b2a115f5bde0bbd4fd2
  CI: 'true'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
      tree: ${{ steps.objects.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the exact menu repair to the reconciled source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REPOSITORY']=='cheshmakzanoon-ops/Experiment-3'
          assert git('rev-parse','HEAD^')=='8c6f0ee191c157a81dfee651d24f960e900fcc78', 'Concurrent changes require reconciliation'
          paths=['.github/phase27h6-capture.b64','.github/workflows/phase27h6-capture.yml']
          assert git('diff','--name-only','HEAD^','HEAD').splitlines()==paths
          packed=base64.b64decode(pathlib.Path(paths[0]).read_bytes(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='d8609effd395491f7725df9e6abfc5aa3ff49beaef07594d12b1d2bd478ceabb'
          patch=zlib.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='3dbd31da4a721d22887829068b1d55d80f04272e175f19534882f4701ecfd44c'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'menu-repair.patch';p.write_bytes(patch)
          subprocess.run(['git','fetch','--depth=1','origin',os.environ['BASE']],check=True)
          assert git('rev-parse',os.environ['BASE']+'^{tree}')==os.environ['BASE_TREE']
          subprocess.run(['git','read-tree','--reset','-u',os.environ['BASE']],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['node','--experimental-transform-types','scripts/phase27h-matrix.ts','--write'],check=True)
          subprocess.run(['git','add','docs/PHASE_27H_MATRIX.md'],check=True)
          allowed=['docs/PHASE_27H6_MENU_REPAIR.md','docs/PHASE_27H_MATRIX.md','e2e/30-menu-access.spec.ts','e2e/fixtures/menu-access.ts','src/ui/style.css']
          assert git('diff','--cached','--name-only',os.environ['BASE']).splitlines()==allowed
          assert git('rev-parse',':src/ui/style.css')=='5afca70227d88a545a57b5f1c753a8993224ab44'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Candidate tree:',git('write-tree'))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-transform-types scripts/phase27h-matrix.ts --check
      - run: npx playwright install --with-deps chromium
      - name: Fast production-menu regression before race workloads
        run: npm run test:e2e -- e2e/30-menu-access.spec.ts
      - name: Retain checked candidate without advancing a branch
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, time, urllib.request, urllib.error
          repo='cheshmakzanoon-ops/Experiment-3'
          assert os.environ['GITHUB_REPOSITORY']==repo
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def post(path,body):
              for attempt in range(3):
                  request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(request,timeout=45) as response: return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==2: raise
                  except urllib.error.URLError:
                      if attempt==2: raise
                  time.sleep(2**attempt)
          tree=git('write-tree');changes=[]
          for path in git('diff','--cached','--name-only',os.environ['BASE']).splitlines():
              data=subprocess.check_output(['git','show',':'+path])
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              actual=post('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert actual==expected,path
              changes.append({'path':path,'mode':git('ls-files','--stage','--',path).split()[0],'type':'blob','sha':actual})
          actual=post('/git/trees',{'base_tree':os.environ['BASE_TREE'],'tree':changes})['sha'];assert actual==tree
          message='feat: activate reconciled 27H.6 racing presentation with accessible menus\n\nRetain all changes from candidate a0c9211, including both saved and staged implementations. Bound and scroll the real menu between the masthead and footer so the 640x400 workload and short player windows can reach every action. Add seven-size production-Interface keyboard, wheel, settings and action checks plus a normal-application persisted-settings and paused-grid regression. No forced clicks, event injection, relaxed assertions, reduced opponents, hidden source replacement or force push.\n\nThe exact source passed lint, unit tests, strict TypeScript, production build, matrix verification and fast menu regressions before this object was created. Full hosted browser/numerical validation is recorded in the originating preflight and must be reviewed before branch activation. Original CI workflows, simulation, input, storage, audio, authored assets and dependencies are retained. Temporary staging helpers are absent from this game tree. Final art, physical hardware and Steam acceptance remain separate.'
          commit=post('/git/commits',{'message':message,'tree':tree,'parents':[os.environ['GITHUB_SHA']]})['sha']
          report={'candidate':commit,'tree':tree,'parent':os.environ['GITHUB_SHA'],'base':os.environ['BASE'],'changedFiles':changes,'branchAdvanced':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP']);(out/'candidate.json').write_text(json.dumps(report,indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'candidate-source.tar.gz'),tree],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+commit+'\ntree='+tree+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h6-menu-preflight
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h6-capture-source
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-source.tar.gz
            ${{ runner.temp }}/menu-repair.patch
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h6-capture-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: phase27h6-capture-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Complete unchanged browser suite and menu regressions
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h6-capture-browser-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  scenarios:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: node --experimental-transform-types scripts/race-classification.ts
      - run: node --experimental-transform-types scripts/phase27h6-racing.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h6-capture-scenarios
          path: |
            docs/*results.json
            docs/*benchmark.json
            docs/*integration.json
            docs/integrated-driving.json
            docs/race-classification.json
          retention-days: 14
