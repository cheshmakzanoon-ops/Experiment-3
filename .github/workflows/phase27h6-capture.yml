name: Reconciled 27H.6 capture validation
on:
  push:
    branches: [main]
    paths: ['.github/phase27h6-capture.b64', '.github/workflows/phase27h6-capture.yml']
permissions:
  contents: read
concurrency:
  group: phase27h6-capture-workloads
  cancel-in-progress: false
env:
  BASE: 7a07fb10a6497e46586dc8eaead67000e67919e8
  BASE_TREE: 0c651973d0af0590703b1222eb4408f93fa65e5e
  TARGET_TREE: 6bbf79ca9129be100fbb1b2a115f5bde0bbd4fd2
  CI: 'true'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct both candidates and enforce exact source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='06d97ed7315509f91f7def532e59ba5fffff03e8', 'Concurrent source requires reconciliation'
          paths=['.github/phase27h6-capture.b64','.github/workflows/phase27h6-capture.yml']
          assert git('diff','--name-only','HEAD^','HEAD').splitlines()==paths
          packed=base64.b64decode(pathlib.Path(paths[0]).read_bytes(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='38e7c2b521c24007f1b5b2f8c6a6ec16c75aa1531394920432421e9da01a9230'
          patch=subprocess.check_output(['node','-e',"let a=[];process.stdin.on('data',d=>a.push(d)).on('end',()=>process.stdout.write(require('node:zlib').brotliDecompressSync(Buffer.concat(a))))"],input=packed)
          assert hashlib.sha256(patch).hexdigest()=='a32914fef6887df771c950c90870001322583ac6839c35852e3aa5f45f344ac3'
          subprocess.run(['git','fetch','--depth=1','origin',os.environ['BASE']],check=True)
          assert git('rev-parse',os.environ['BASE']+'^{tree}')==os.environ['BASE_TREE']
          subprocess.run(['git','read-tree','--reset','-u',os.environ['BASE']],check=True)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-0.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary',str(p)],check=True)
          subprocess.run(['node','--experimental-transform-types','scripts/phase27h-matrix.ts','--write'],check=True)
          subprocess.run(['git','add','docs/PHASE_27H_MATRIX.md'],check=True)
          assert git('write-tree')==os.environ['TARGET_TREE'], 'Reconstructed source mismatch'
          protected=['src/simulation/','src/workers/','src/input/','src/storage/','src/audio/','src/assets/','.github/','package.json','package-lock.json','docs/MASTER_DIRECTIVE.md','playwright.config.ts','vitest.config.ts']
          assert not git('diff','--cached',os.environ['BASE'],'--',*protected), 'Protected source or existing gates changed'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Exact reconciled tree:',git('write-tree'))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-transform-types scripts/phase27h-matrix.ts --check
      - name: Retain verified source and commit without advancing any branch
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, time, urllib.request, urllib.error
          repo='cheshmakzanoon-ops/Experiment-3'
          assert os.environ['GITHUB_REPOSITORY']==repo
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          target=os.environ['TARGET_TREE'];assert git('write-tree')==target
          def post(path,body):
              for attempt in range(3):
                  request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(request,timeout=45) as response: return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==2: raise
                  except urllib.error.URLError:
                      if attempt==2: raise
                  time.sleep(2**attempt)
          changes=[]
          for path in git('diff','--cached','--name-only',os.environ['BASE']).splitlines():
              data=pathlib.Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              actual=post('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert actual==expected,path
              changes.append({'path':path,'mode':git('ls-files','--stage','--',path).split()[0],'type':'blob','sha':actual})
          actual=post('/git/trees',{'base_tree':os.environ['BASE_TREE'],'tree':changes})['sha']
          assert actual==target
          message='feat: publish reconciled 27H.6 racing presentation and repair grid, replay and capture integration\n\nPreserve both saved and staged candidates: adaptive HUD, event-qualified race captures, solid broadcast occluders, conforming damp roads and full pit-crew framing. Repair initial grid observation, early replay seek bounds, and explicit paused-grid preparation. Held replay pose checks use normal resize invalidation without advancing the recording. Calibrate diagnostic-only normal output without changing production shading or relaxing assertions. Functional sequence cases explicitly record a 640x400 Low workload so the software GPU can provide the required adjacent frames; default-quality wet/pit journeys remain separate. Request legal replay range steps and keep the pit journey live.\n\nExact source passes lint, 1090 unit tests, strict TypeScript, production build and matrix verification. Hosted preflight results are attached to the associated workflow; publication and final visual/hardware acceptance remain separate. Remove temporary reconciliation/import/toolchain files from this tree. No force update, engine change, dependency change or weakened original CI gate.'
          commit=post('/git/commits',{'message':message,'tree':target,'parents':[os.environ['GITHUB_SHA']]})['sha']
          report={'candidate':commit,'tree':target,'parent':os.environ['GITHUB_SHA'],'files':len(changes),'branchAdvanced':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP']);(out/'candidate.json').write_text(json.dumps(report,indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'candidate-source.tar.gz'),target],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+commit+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h6-capture-source
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-source.tar.gz
            ${{ runner.temp }}/candidate-*.patch
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h6-capture-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: phase27h6-capture-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Both retained race suites and GPU contracts with original assertions
        run: npm run test:e2e -- e2e/28-race-hud-layout.spec.ts e2e/28-race-pit-presentation.spec.ts e2e/29-populated-race-review.spec.ts e2e/weather.spec.ts e2e/27-visual-coherence.spec.ts --grep '27H\.6|27H\.5 GPU|actual wet simulation' --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h6-capture-browser-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  scenarios:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:physics
      - run: node --experimental-transform-types scripts/rotation-benchmark.ts
      - run: node --experimental-transform-types scripts/pit-integration.ts
      - run: node --experimental-transform-types scripts/race-classification.ts
      - run: node --experimental-transform-types scripts/phase27h6-racing.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27h6-capture-scenarios
          path: |
            docs/*results.json
            docs/*benchmark.json
            docs/*integration.json
            docs/integrated-driving.json
            docs/race-classification.json
          retention-days: 14
