name: Transfer saved 27H.3 source objects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase27h3-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'cheshmakzanoon-ops/Experiment-3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Upload the exact saved source tree without advancing main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, time, urllib.error, urllib.request
          
          REPO = 'cheshmakzanoon-ops/Experiment-3'
          BASE = 'ee4fc48f5d91f88882551ba220799ee54c47a743'
          BASE_TREE = '6139040c9f9987ecadcdaad98a960cc49ca18150'
          CANDIDATE = '9273f70af3eee2c5f5eea4a85b8c8d5f879e0c37'
          TREE = 'c84e0b9d2facd5cd8c666387cd8d11c0edcacbc7'
          WORKFLOW = '.github/workflows/phase27h3-transfer.yml'
          ALLOWED = set('''docs/ASSET_PROVENANCE.md
          docs/DEVELOPMENT_STATUS.md
          docs/PHASE_27H3_IMPLEMENTATION.md
          docs/PHASE_27H_MATRIX.md
          e2e/11-phase27c.spec.ts
          e2e/25-people.spec.ts
          e2e/pit-presentation.spec.ts
          e2e/pit-scene.ts
          scripts/phase27c-oracles.ts
          src/rendering/crew-pose.ts
          src/rendering/crowd-impostor.ts
          src/rendering/crowd.ts
          src/rendering/grandstand.ts
          src/rendering/people-asset.ts
          src/rendering/pit-crew.ts
          src/rendering/pit-machinery.ts
          src/rendering/renderer.ts
          tests/people.test.ts
          tests/pit-presentation.test.ts
          tests/presentation-continuity.test.ts'''.splitlines())
          PARTS = [
              ('bb6a43ca9264f8aac5553b181343a85a5fde0149', 'bb6a43ca9264f8aac5553b181343a85a5fde0149'),
              ('0629d2751ae3ca99ec123f7bcf8b1a4bcf4ce48f', '35d97e2544ecf3f91ea40e061982ab0f62a00f41'),
              ('c85493a337785e91dd46c290bd9b7001ff901bd8', 'c85493a337785e91dd46c290bd9b7001ff901bd8'),
              ('7c1a7a557f16f4ee020fbad846085d70a86018fb', '7c1a7a557f16f4ee020fbad846085d70a86018fb'),
          ]
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          def text(*args):
              return git(*args).decode().strip()
          
          def oid(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path,
                  data=None if body is None else json.dumps(body).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      if attempt == 2:
                          raise
                  time.sleep(2 ** (attempt + 1))
              raise RuntimeError('Transfer retry budget exhausted')
          
          def restore_part(stored, raw):
              # Correct one identified transport-only base64 insertion. Content-addressed
              # checks protect both the received bytes and the exact reconstructed part.
              if stored == PARTS[1][0]:
                  encoded = base64.b64encode(raw).decode()
                  assert encoded.count('NofSSSbDp') == 1
                  raw = base64.b64decode(encoded.replace('NofSSSbDp', 'NofSSbDp') + '=', validate=True)
              return raw
          
          def main():
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              staging = os.environ['GITHUB_SHA']
              assert text('rev-parse', 'HEAD') == staging
              assert text('rev-parse', 'HEAD^') == BASE
              assert api('/git/ref/heads/main')['object']['sha'] == staging
              assert text('diff', '--name-only', BASE, staging) == WORKFLOW
              assert text('rev-parse', BASE + '^{tree}') == BASE_TREE
              payload = bytearray()
              for stored, expected in PARTS:
                  response = api('/git/blobs/' + stored)
                  assert response['encoding'] == 'base64'
                  raw = base64.b64decode(response['content'])
                  assert oid(raw) == stored
                  raw = restore_part(stored, raw)
                  assert oid(raw) == expected
                  payload.extend(raw)
              assert len(payload) == 31101
              assert hashlib.sha256(payload).hexdigest() == 'de32d9201e215ddb48847583e5f0ad538ff580c2abe44de23608e04020754e15'
              bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase27h3.bundle'
              bundle.write_bytes(payload)
              subprocess.run(['git', 'bundle', 'verify', str(bundle)], check=True)
              subprocess.run(['git', 'bundle', 'unbundle', str(bundle)], check=True)
              assert text('rev-parse', CANDIDATE + '^{tree}') == TREE
              assert text('show', '-s', '--format=%P', CANDIDATE) == BASE
              paths = set(text('diff-tree', '--no-commit-id', '--name-only', '-r', BASE, CANDIDATE).splitlines())
              assert paths == ALLOWED
              entries = []
              for name in sorted(paths):
                  mode, kind, sha, path = text('ls-tree', CANDIDATE, '--', name).split(maxsplit=3)
                  assert path == name and mode == '100644' and kind == 'blob'
                  data = git('cat-file', 'blob', sha)
                  assert len(data) < 250000 and oid(data) == sha
                  saved = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
                  assert saved['sha'] == sha
                  entries.append({'path': name, 'mode': mode, 'type': kind, 'sha': sha})
              saved = api('/git/trees', {'base_tree': BASE_TREE, 'tree': entries})
              assert saved['sha'] == TREE, 'Remote source tree differs from the saved implementation'
              assert api('/git/ref/heads/main')['object']['sha'] == staging
              receipt = {'repository': REPO, 'base': BASE, 'stagingCommit': staging,
                  'savedLocalCommit': CANDIDATE, 'uploadedTree': TREE, 'changedFiles': entries,
                  'mainAdvanced': False, 'fullHostedValidation': 'NOT RUN by transfer job'}
              pathlib.Path(os.environ['RUNNER_TEMP'], 'phase27h3-transfer.json').write_text(json.dumps(receipt, indent=2) + '\n')
              print(json.dumps(receipt, indent=2))
          
          if __name__ == '__main__':
              main()
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: phase27h3-transfer-receipt
          path: ${{ runner.temp }}/phase27h3-transfer.json
          retention-days: 7
          if-no-files-found: error
