name: Verify replay and driver repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-replay-repair.yml]
permissions:
  contents: write
jobs:
  verify-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the exact reviewed repair to its verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-evidence"
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          payload = ' '
          spec = json.loads(zlib.decompress(base64.b64decode(payload)))
          root = Path.cwd()
          for name, patch in spec.items():
              path = root / name
              if not path.resolve().is_relative_to(root):
                  raise RuntimeError('Unsafe source path')
              if 'content' in patch:
                  if path.exists():
                      raise RuntimeError('New file already exists: '+name)
                  text = patch['content']
              else:
                  raw = path.read_bytes()
                  if hashlib.sha256(raw).hexdigest() != patch['sha256']:
                      raise RuntimeError('Source changed; refuse stale patch: '+name)
                  text = raw.decode('utf-8')
                  for before, after in patch['edits']:
                      if text.count(before) != 1:
                          raise RuntimeError('Ambiguous patch: '+name)
                      text = text.replace(before, after)
              path.write_bytes(text.encode('utf-8'))
          Path('/tmp/replay-repair-paths.json').write_text(json.dumps(list(spec)))
          print('Applied six reviewed source/test edits; no assets, physics or test budgets changed.')
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Repeat both failed specifications without retries or weakened assertions
        run: npm run test:e2e -- e2e/replay-state.spec.ts e2e/24-coupled-driver.spec.ts --repeat-each=2
      - name: Create the tested commit object without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'cheshmakzanoon-ops/Experiment-3'
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise RuntimeError('Wrong repository')
          parent = os.environ['GITHUB_SHA']
          def api(path, data=None):
              headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'apex-replay-repair'}
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=body, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          if api('/git/ref/heads/main')['object']['sha'] != parent:
              raise RuntimeError('main moved during verification; preserve work without overwriting')
          names = json.loads(Path('/tmp/replay-repair-paths.json').read_text())
          workflow = '.github/workflows/verify-replay-repair.yml'
          Path(workflow).unlink()
          subprocess.run(['git','add','--',*names,workflow],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          actual = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(actual) != set(names+[workflow]):
              raise RuntimeError('Unexpected changed paths: '+repr(actual))
          evidence = Path(os.environ['RUNNER_TEMP'])/'repair-evidence'
          (evidence/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          entries = []
          hashes = {}
          for name in names:
              raw = Path(name).read_bytes()
              hashes[name] = hashlib.sha256(raw).hexdigest()
              blob = api('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':workflow,'mode':'100644','type':'blob','sha':None})
          base = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree = api('/git/trees',{'base_tree':base,'tree':entries})
          message = 'fix: freeze covered replay presentation and avoid driver diagnostic GPU stalls\n\nFix browser shard 3 failures from run 35913002334. Replay modals hold the last presented frame; paused playback redraws only for a seek or explicit invalidation. Keep its wall clock current. Expose the actual driver pose without unrelated mesh raycasting or mirror readback. Preserve every screenshot, video, original assertion, rendering setting, timeout and physics safeguard; add presented steering and replay timestamp checks.\n\nVerified npm run check and both failing specifications twice with retries=0 on this exact source. Add scheduling unit tests and frame-callback regressions. Remove the temporary verification workflow. Full normal CI is required after the branch is advanced.'
          commit = api('/git/commits',{'message':message,'tree':tree['sha'],'parents':[parent]})
          result = {'candidate_sha':commit['sha'],'parent_sha':parent,'tree_sha':tree['sha'],'files_sha256':hashes,'focused_run':os.environ['GITHUB_RUN_ID'],'branch_updated':False}
          (evidence/'candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Tested candidate (branch not moved): `'+commit['sha']+'`\n')
          PY
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-repair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repair-evidence/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
