name: Exact-source race review preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/phase27h-view-capture.yml]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact same-repository commit to inspect; blank uses this main revision'
        type: string
        required: false
      export_toolchain:
        description: 'Retain locked public Node dependencies for offline reproduction (one day)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: race-review-preflight-${{ github.sha }}-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate the requested commit identifier
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record exact inspected source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/package-lock.sha256"
      - run: npm ci --no-audit --no-fund
      - name: Retain optional offline dependencies without credentials
        if: inputs.export_toolchain || github.event_name == 'push'
        run: tar -czf "$RUNNER_TEMP/apex-node-dependencies.tar.gz" node_modules
      - name: Export optional locked offline toolchain
        if: inputs.export_toolchain || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apex-preflight-toolchain
          path: |
            ${{ runner.temp }}/apex-node-dependencies.tar.gz
            ${{ runner.temp }}/package-lock.sha256
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
          if-no-files-found: error
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Repeat the real populated pit review three times without retries
        run: npm run test:e2e -- e2e/29-populated-race-review.spec.ts --grep 'pit-service day' --repeat-each=3
      - name: Retain exact-source review and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-pit-review-preflight
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/package-lock.sha256
          retention-days: 7
          if-no-files-found: error
# This read-only diagnostic workflow does not publish, rebuild assets, update main,
# skip the ordinary ci.yml suite, or certify final art / human / hardware acceptance.
