name: Verify road-contact continuation
on:
  push:
    branches: [main]
    paths: [.github/workflows/contact-candidate.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TREE: a12e347716a00008a596b21120d8558c5aa75277
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read immutable source delta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const file_sha of ['b035bbffb6c02fd59d2a737850a19fd6c9df25c3', '4beef005d20a4dc8965aa7ceea4855aec40ce12e']) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha});
              if (data.encoding !== 'base64' || data.sha !== file_sha) throw new Error('Unexpected source blob');
              parts.push(Buffer.from(data.content, 'base64').toString('utf8'));
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/contact-delta.b64', parts.join(''));
      - name: Apply source with before and after checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '318a170a32cbd5aad0848e204472ad258785f420'
          python - <<'PYCODE'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          encoded = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'contact-delta.b64').read_text()
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '86a3df61cff46bb90af9820caef52bb48362fc594b9dc3aebb571c028f709033'
          raw = lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == 'cfba19f4b18dc86953a284a4a3fe25c177babf097e084cf0c7333f9cad8731b7'
          changes = json.loads(raw)
          allowed = {'README.md', 'docs/DEVELOPMENT_STATUS.md', 'docs/IMPLEMENTATION_MATRIX.md', 'docs/RECORDING_AND_REPLAY.md', 'docs/ROAD_CONTACT_AND_SKIDS.md', 'docs/contact-benchmark.json', 'docs/dynamics-benchmark.json', 'docs/integrated-driving.json', 'docs/marshal-integration.json', 'docs/scenario-results.json', 'docs/wet-pit-results.json', 'e2e/01-worker-portability.spec.ts', 'e2e/03-skid-contact.spec.ts', 'e2e/application.spec.ts', 'e2e/fixtures/skid-contact.ts', 'scripts/contact-benchmark.ts', 'scripts/integrated-driving.ts', 'scripts/weather-oracles.ts', 'src/rendering/effects.ts', 'src/rendering/frame-state.ts', 'src/simulation/pit-safety.ts', 'src/simulation/protocol.ts', 'src/simulation/road-contact.ts', 'src/simulation/skid-contact.ts', 'src/simulation/vehicle.ts', 'src/simulation/world.ts', 'src/storage/recorders.ts', 'src/storage/telemetry-schema.ts', 'src/workers/diagnostics.ts', 'tests/engineering.test.ts', 'tests/pit-approach.test.ts', 'tests/recording.test.ts', 'tests/road-contact.test.ts', 'tests/skid-contact.test.ts', 'tests/skid-recording.test.ts', 'tests/wheel-alignment.test.ts'}
          assert set(changes) == allowed
          for name, record in changes.items():
              path = pathlib.Path(name)
              original = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(original).hexdigest() if original is not None else None) == record['before'], name
              lines = original.decode('utf8').splitlines(keepends=True) if original is not None else []
              for start, end, text in reversed(record['ops']):
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf8')
              assert hashlib.sha256(result).hexdigest() == record['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(changes)], check=True)
          PYCODE
          git rm .github/workflows/contact-candidate.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify rendered production skid contact and existing weather effects
        run: npm run test:e2e -- e2e/03-skid-contact.spec.ts e2e/weather.spec.ts
      - name: Prepare exact tested Git tree without moving main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const tree = cp.execFileSync('git', ['write-tree'], {encoding:'utf8'}).trim();
            if (tree !== process.env.EXPECTED_TREE) throw new Error('Tested index changed');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
            const entries = paths.map(path => fs.existsSync(path)
              ? {path, mode:'100644', type:'blob', content:fs.readFileSync(path, 'utf8')}
              : {path, mode:'100644', type:'blob', sha:null});
            const parent = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            const prepared = await github.rest.git.createTree({...context.repo, base_tree:parent.data.tree.sha, tree:entries});
            if (prepared.data.sha !== tree) throw new Error('Remote source differs from tested source');
            const evidence = {parent:context.sha, tree, base:'318a170a32cbd5aad0848e204472ad258785f420', branchMoved:false};
            fs.writeFileSync('prepared-tree.json', JSON.stringify(evidence, null, 2));
            await core.summary.addHeading('Contact continuation tested, not yet published').addCodeBlock(JSON.stringify(evidence)).write();
      - name: Preserve candidate evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-candidate-validation
          path: |
            prepared-tree.json
            test-results/
            playwright-report/
          retention-days: 7
