name: Apply preserved local continuation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-preserved-continuation.yml']
permissions:
  contents: write
concurrency:
  group: apply-preserved-continuation
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'cheshmakzanoon-ops/Experiment-3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify preserved source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          cat             .github/preserved-continuation.part1.b64             .github/preserved-continuation.part2a.b64             .github/preserved-continuation.part2b.b64             .github/preserved-continuation.part3a.b64             .github/preserved-continuation.part3b.b64             .github/preserved-continuation.part4a.b64             .github/preserved-continuation.part4b.b64             > "$RUNNER_TEMP/continuation.b64"
          echo "2446a096a64322a6b8ce268017d60f419a14f94985b974b6f3e8de645e46f94f  $RUNNER_TEMP/continuation.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/continuation.b64" | gzip -d > "$RUNNER_TEMP/continuation.patch"
          echo "145e142bdc9dfe5ed029ce3987c781984eb1c2b42b33a217c0f9ea6b64f7e71d  $RUNNER_TEMP/continuation.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/continuation.patch"
          git apply "$RUNNER_TEMP/continuation.patch"
          # Workflow-file changes are applied later through the authorized GitHub connector.
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f             .github/preserved-continuation.part1.b64             .github/preserved-continuation.part2a.b64             .github/preserved-continuation.part2b.b64             .github/preserved-continuation.part3a.b64             .github/preserved-continuation.part3b.b64             .github/preserved-continuation.part4a.b64             .github/preserved-continuation.part4b.b64
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Refusing staged workflow mutation in Actions token push" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Commit and push verified non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'agent@example.invalid'
          git commit -m "fix: preserve camera continuity and complete controller mappings" -m "Apply the exact locally validated non-workflow portion of the continuation on top of the published Markdown-6 implementation. Workflow-file changes are committed separately through the authorized GitHub connector."
          git push origin HEAD:main
