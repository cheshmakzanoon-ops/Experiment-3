name: Stage settings repair source objects
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/settings-source-staging.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage reviewed patch in an isolated index, never in the application checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/settings-runtime.patch" <<'PATCH'
