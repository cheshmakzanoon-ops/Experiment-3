          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'cheshmakzanoon-ops/Experiment-3'
          expected = {
            'src/main.ts': ('89d138e3d708893d3ebaa0b05fc532943f957720', 'da4f40de594692188bb0c0bb25793e47ca20be43'),
            'src/rendering/renderer.ts': ('13021a876ef3376ccf23025f97d8b6bd6aa04792', '59ccf430e381a667185fb4afda65a898ff64ff87'),
          }
          def git(*args, env=None):
            return subprocess.check_output(['git', *args], env=env)
          before = git('status', '--porcelain')
          for path, (old, _) in expected.items():
            assert git('rev-parse', 'HEAD:' + path).decode().strip() == old, path
          env = dict(os.environ, GIT_INDEX_FILE=os.environ['RUNNER_TEMP'] + '/settings.index')
          git('read-tree', 'HEAD', env=env)
          patch = os.environ['RUNNER_TEMP'] + '/settings-runtime.patch'
          git('apply', '--cached', '--check', patch, env=env)
          git('apply', '--cached', patch, env=env)
          receipt = {'source': os.environ['GITHUB_SHA'], 'updatesRefs': False, 'files': []}
          for path, (old, new) in expected.items():
            assert git('rev-parse', ':' + path, env=env).decode().strip() == new, path
            content = git('show', ':' + path, env=env).decode('utf-8')
            req = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs',
              data=json.dumps({'encoding': 'utf-8', 'content': content}).encode(), method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
            with urllib.request.urlopen(req, timeout=60) as response:
              result = json.load(response)
            assert result['sha'] == new, path
            receipt['files'].append({'path': path, 'before': old, 'after': new})
          assert git('status', '--porcelain') == before
          output = Path(os.environ['RUNNER_TEMP']) / 'settings-source-receipt.json'
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          print(output.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: settings-source-receipt
          path: ${{ runner.temp }}/settings-source-receipt.json
          retention-days: 7
