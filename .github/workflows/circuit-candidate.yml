name: Grounded circuit candidate validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/circuit-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore reviewed circuit source and verify the complete grounding patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin bc3a3113530cd7b0f17e288750a162b4ebe058a8
          git restore --source=bc3a3113530cd7b0f17e288750a162b4ebe058a8 --worktree --staged README.md docs src tests e2e
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3'
          sha='49afa614e1db2b2131f59260919cf2acdf028e9b'
          request=urllib.request.Request(root+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
          encoded=base64.b64decode(data['content'])
          assert hashlib.sha1(b'blob '+str(len(encoded)).encode()+b'\0'+encoded).hexdigest()==sha
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0cf867b0fa7faf76bbb86dbf77f6fa52e2115cfc0e6df8a6c4ed480b22ad1c29'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'circuit-grounding.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          subprocess.run(['git','add','README.md','docs','src','tests','e2e'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          assert hashlib.sha256(pathlib.Path('docs/MASTER_DIRECTIVE.md').read_bytes()).hexdigest()=='f508a1b9be8e8a19a2ccc39d744e82d774cf95ecc773c12482efbcb9fb89f75c'
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/04-reference-visual.spec.ts e2e/05-cockpit-detail.spec.ts e2e/06-circuit-survey.spec.ts e2e/construction.spec.ts e2e/pit-presentation.spec.ts
      - name: Preserve exact tested Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/cheshmakzanoon-ops/Experiment-3'
          def api(path,data=None):
              request=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA'];base=api('/git/commits/'+parent)['tree']['sha']
          files=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          expected=['README.md','docs/ASSET_PROVENANCE.md','docs/CIRCUIT_REFERENCE_CONTINUATION.md','docs/IMPLEMENTATION_MATRIX.md','e2e/06-circuit-survey.spec.ts','e2e/fixtures/circuit-survey.ts','src/rendering/circuit-barriers.ts','src/rendering/circuit-finish.ts','src/rendering/circuit.ts','src/rendering/daylight.ts','src/rendering/grandstand.ts','src/rendering/ground-profile.ts','src/rendering/landscape.ts','src/rendering/renderer.ts','src/rendering/surface-detail.ts','tests/circuit-detail.test.ts','tests/daylight-environment.test.ts','tests/reference-rendering.test.ts']
          assert sorted(files)==sorted(expected)
          entries=[];hashes={}
          for path in files:
              content=pathlib.Path(path).read_bytes();hashes[path]=hashlib.sha256(content).hexdigest()
              blob=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert blob['sha']==hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'feat: tested grounded circuit candidate\n\nProfiled barriers, filtered fencing, original terraced grandstands, surface finish, weather-consistent sky and contact-aligned apron triangles. Strict check and seven focused browser cases passed. Full repository CI and explicit source publication remain separate. No photorealism-parity claim.','tree':tree,'parents':[parent]})['sha']
          result={'candidate':commit,'tree':tree,'parent':parent,'files':hashes,'expected_unit_cases':541,'focused_browser_cases':7,'full_browser_cases':31,'visual_parity':'NOT achieved'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'circuit-candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-circuit-candidate-validation
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/circuit-candidate.json
          retention-days: 7
