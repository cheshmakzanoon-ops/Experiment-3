appId: io.github.cheshmakzanoon-ops.motobound
productName: MOTOBOUND
asar: true
npmRebuild: false
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
  app: desktop-stage
  output: desktop-out
  buildResources: build
files:
  - '**/*'
  - '!**/*.map'
  - '!**/node_modules/**'
icon: build/icon.png
win:
  target: nsis
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target: [dmg, zip]
  category: public.app-category.games
  identity: null
linux:
  target: [AppImage, tar.gz]
  executableName: motobound
  category: Game
publish: null
